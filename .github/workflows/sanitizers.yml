# SPDX-License-Identifier: MIT
# Sanitizer checks: bytecask_tests under ASan, TSan, MSan and UBSan, on each
# key directory (BYTECASK_KEYDIR). sql-layer.yml calls it for sql_layer_tests.
#
# ci.yml calls this workflow and picks the matrix: ASan, TSan and UBSan on the
# default blind tree, for a PR and for the push to main that merges it. The
# schedule below runs the full keydir x sanitizer matrix nightly. Eight jobs is too
# slow for PR feedback, and the keyed B+ tree shares its inner nodes and
# BuildSession with the default, so shared-code bugs already surface in the
# PR run.
#
# MSan runs only off the PR path: origin tracking
# (-fsanitize-memory-track-origins=2) makes its test step both the slowest of
# the four and by far the least predictable. It is built at -O1 (see
# apply_sanitizer in xmake.lua); at the debug mode's -O0 it took about an
# hour per key directory.
# It also requires an MSan-instrumented libc++: the system's libcxx-devel
# package (used as-is by the others) isn't instrumented, and linking it into
# an MSan binary produces false positives. See scripts/build_msan_libcxx.sh
# and docs/correctness_validation.md.

name: Sanitizers

on:
  workflow_call:
    inputs:
      keydirs:
        description: "JSON array of key directories (blind, btree)"
        type: string
        required: true
      sanitizers:
        description: "JSON array of sanitizers (address, thread, memory, undefined)"
        type: string
        required: true
      target:
        description: "The test target to build and run"
        type: string
        default: bytecask_tests
      sql_layer:
        description: "Configure with the SQL layer (xmake option sql_layer), for sql_layer_tests"
        type: boolean
        default: false
  schedule:
    - cron: "40 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanitizers:
    runs-on: ubuntu-latest
    # Clean MSan runs took 56-87 minutes even at -O0, and the six-hour runs
    # stalled rather than ran slow. Two hours is headroom for a slow runner;
    # past it, waiting out GitHub's six-hour default only delays the report.
    # --durations below names the last test that finished.
    timeout-minutes: ${{ matrix.sanitizer == 'memory' && 120 || 60 }}
    container:
      image: fedora:43
      # TSan and MSan re-exec themselves with personality(ADDR_NO_RANDOMIZE)
      # when the runner's vm.mmap_rnd_bits is too high for their memory
      # layout. Docker's default seccomp profile refuses that personality, and
      # the binary dies at startup with no test run (#558; MSan: "CHECK
      # failed: msan_linux.cpp ... ADDR_NO_RANDOMIZE"). Only those two legs
      # loosen it.
      options: ${{ (matrix.sanitizer == 'thread' || matrix.sanitizer == 'memory') && '--security-opt seccomp=unconfined' || '' }}
    env:
      BYTECASK_MARCH: x86-64-v3
      XMAKE_ROOT: "y"
      CLANG_TARGET_TRIPLE: x86_64-redhat-linux-gnu
      BYTECASK_KEYDIR: ${{ matrix.keydir }}
    strategy:
      fail-fast: false
      matrix:
        # Scheduled and dispatched runs have no inputs: full matrix.
        keydir: ${{ fromJSON(inputs.keydirs || '["blind", "btree"]') }}
        sanitizer: ${{ fromJSON(inputs.sanitizers || '["address", "thread", "memory", "undefined"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y \
            clang llvm llvm-devel lld \
            libcxx libcxx-devel libstdc++-static \
            xmake cmake make which \
            python3-pip python3-devel \
            git ninja-build
          # bytecaskdb_python's on_load() asks nanobind for its include dir,
          # and xmake f loads every target. make and which: the libpg_query
          # and TinyCC builds, when sql-layer.yml calls this with sql_layer.
          pip3 install nanobind pytest hypothesis

      # build_msan_libcxx.sh picks its llvm-project release branch from the
      # installed Clang's major version, so that version belongs in the key:
      # without it a Fedora LLVM bump restores a libc++ built from the old
      # branch, and the script's own "already installed" check then skips the
      # rebuild, silently pairing it with the new clang and MSan runtime.
      # The key is the same for every key directory, so the three MSan jobs
      # share one cache entry.
      - name: Resolve Clang major version
        if: matrix.sanitizer == 'memory'
        id: clang
        run: echo "major=$(clang -dumpversion | cut -d. -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache MSan-instrumented libc++
        if: matrix.sanitizer == 'memory'
        uses: actions/cache@v4
        with:
          path: .msan-libcxx
          key: msan-libcxx-fedora43-clang${{ steps.clang.outputs.major }}-${{ hashFiles('scripts/build_msan_libcxx.sh') }}

      - name: Build MSan-instrumented libc++
        if: matrix.sanitizer == 'memory'
        run: bash scripts/build_msan_libcxx.sh

      # The SQL layer's libpg_query and TinyCC are cloned and built from
      # source: cached, a fetch failure costs a cache miss, not the run.
      - name: Cache the SQL layer's xmake packages
        if: inputs.sql_layer
        uses: actions/cache@v4
        with:
          path: ~/.xmake/packages
          key: xmake-packages-sql-layer-${{ matrix.sanitizer }}-fedora43-${{ hashFiles('xmake.lua', 'bytecaskdb-sql-layer/xmake.lua') }}

      - name: Configure xmake
        run: |
          RESOURCE_DIR=$(clang --print-resource-dir)
          xmake f --toolchain=clang \
            --cxflags="-resource-dir=${RESOURCE_DIR}" \
            --sanitizer=${{ matrix.sanitizer }} \
            --sql_layer=${{ inputs.sql_layer && 'y' || 'n' }} \
            -m debug -y

      # Scheduled and dispatched runs have no inputs: bytecask_tests.
      - name: Build
        env:
          TARGET: ${{ inputs.target || 'bytecask_tests' }}
        run: |
          xmake build "$TARGET"
          if [ "$TARGET" = "bytecask_tests" ] && [ "${{ matrix.sanitizer }}" = "undefined" ] && [ "${{ matrix.keydir }}" = "blind" ]; then
            xmake build btree_tests
          fi

      # The key-directory trees' own tests, where the bit arithmetic is
      # exercised most directly. They do not depend on BYTECASK_KEYDIR, so
      # one key directory runs them.
      - name: Run tree tests under undefined sanitizer
        if: (inputs.target || 'bytecask_tests') == 'bytecask_tests' && matrix.sanitizer == 'undefined' && matrix.keydir == 'blind'
        run: xmake run btree_tests

      - name: Run ${{ inputs.target || 'bytecask_tests' }} under ${{ matrix.sanitizer }} sanitizer on ${{ matrix.keydir }} key directory
        # No halt_on_error=0 for ASan/MSan: without -fsanitize-recover=<san>
        # Clang emits the noreturn report stubs (__asan_report_*, not
        # *_noabort; __msan_warning_noreturn, not __msan_warning), so the
        # setting is dead config that would quietly turn into a
        # failure-masking one if a recover flag were ever added. TSan keeps
        # it: it genuinely continues past a report and exits nonzero at the
        # end if any race was found.
        env:
          ASAN_OPTIONS: ${{ matrix.sanitizer == 'address' && 'detect_leaks=1' || '' }}
          TSAN_OPTIONS: ${{ matrix.sanitizer == 'thread' && 'halt_on_error=0 history_size=4' || '' }}
        # --durations prints each test as it finishes, so a run cut off by
        # the timeout shows the last test that completed.
        run: |
          target="${{ inputs.target || 'bytecask_tests' }}"
          if [ "$target" = "sql_layer_tests" ] && [ "${{ matrix.sanitizer }}" = "address" ]; then
            # The SQL layer's allocation-failure sweeps run apart, with
            # LeakSanitizer told of the one leak the engine makes under a
            # failed allocation (#390); everything else with no suppression.
            # Only ASan checks leaks; elsewhere the sweeps skip, and a run of
            # only skipped tests would fail.
            xmake run "$target" "~[alloc]" --durations yes
            LSAN_OPTIONS="suppressions=$PWD/bytecaskdb-sql-layer/tests/lsan_alloc_sweeps.supp" \
              xmake run "$target" "[alloc]" --durations yes
          else
            xmake run "$target" --durations yes
          fi
