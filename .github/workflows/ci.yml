# SPDX-License-Identifier: MIT
# Main CI pipeline: build, test, sanitizers, and fuzz testing (Linux only).
# macOS coverage is handled by build-wheels.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Build and run all test targets
  # ---------------------------------------------------------------------------
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: fedora:43
    permissions:
      contents: read
      checks: write
      id-token: write
    env:
      BYTECASK_MARCH: x86-64-v3
      XMAKE_ROOT: "y"
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y \
            clang llvm llvm-devel lld \
            libcxx libcxx-devel \
            xmake \
            python3-pip python3-devel \
            git ninja-build
          pip3 install nanobind pytest hypothesis

      - name: Configure xmake
        run: |
          RESOURCE_DIR=$(clang --print-resource-dir)
          xmake f --toolchain=clang \
            --cxflags="-resource-dir=${RESOURCE_DIR}" \
            -y

      - name: Build all test targets
        run: |
          xmake build bytecask_tests
          xmake build radix_tree_memory_tests
          xmake build unordered_view_tests

      - name: Run tests and generate JUnit reports
        run: |
          mkdir -p test-results
          status=0
          build/linux/x86_64/release/bytecask_tests --reporter junit --out test-results/bytecask_tests.xml || status=1
          build/linux/x86_64/release/radix_tree_memory_tests --reporter junit --out test-results/radix_tree_memory_tests.xml || status=1
          build/linux/x86_64/release/unordered_view_tests --reporter junit --out test-results/unordered_view_tests.xml || status=1
          exit "$status"

      - name: Run proof independence tests (Hypothesis)
        run: |
          xmake build bytecaskdb_python
          PYTHONPATH=bytecaskdb-python python3 -m pytest tests/proof/test_independence.py -v

      - name: Enrich JUnit reports with source metadata
        if: ${{ always() && !cancelled() }}
        run: |
          /usr/bin/python scripts/enrich_junit_sources.py \
            --pair build/linux/x86_64/release/bytecask_tests:test-results/bytecask_tests.xml \
            --pair build/linux/x86_64/release/radix_tree_memory_tests:test-results/radix_tree_memory_tests.xml \
            --pair build/linux/x86_64/release/unordered_view_tests:test-results/unordered_view_tests.xml

      - name: Publish test results in GitHub Checks
        if: ${{ always() && !cancelled() }}
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: test-results/*.xml
          check_name: Test Results
          comment_mode: off

      - name: Upload JUnit reports artifact
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: test-results/*.xml

      - name: Upload test results to Codecov
        if: ${{ always() && !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          files: |
            ./test-results/bytecask_tests.xml
            ./test-results/radix_tree_memory_tests.xml
            ./test-results/unordered_view_tests.xml
          report_type: test_results
          flags: cpp
          name: bytecask-cpp-tests
          slug: gustavoamigo/bytecaskdb
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          use_oidc: true

  # ---------------------------------------------------------------------------
  # Sanitizer checks (ASan / TSan)
  # ---------------------------------------------------------------------------
  sanitizers:
    runs-on: ubuntu-latest
    container:
      image: fedora:43
    env:
      BYTECASK_MARCH: x86-64-v3
      XMAKE_ROOT: "y"
      CLANG_TARGET_TRIPLE: x86_64-redhat-linux-gnu
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y \
            clang llvm llvm-devel lld \
            libcxx libcxx-devel \
            xmake \
            python3-pip python3-devel \
            git ninja-build
          pip3 install nanobind pytest hypothesis

      - name: Configure xmake
        run: |
          RESOURCE_DIR=$(clang --print-resource-dir)
          xmake f --toolchain=clang \
            --cxflags="-resource-dir=${RESOURCE_DIR}" \
            --sanitizer=${{ matrix.sanitizer }} \
            -m debug -y

      - name: Build
        run: xmake build bytecask_tests

      - name: Run tests under ${{ matrix.sanitizer }} sanitizer
        env:
          ASAN_OPTIONS: ${{ matrix.sanitizer == 'address' && 'halt_on_error=0 detect_leaks=1' || '' }}
          TSAN_OPTIONS: ${{ matrix.sanitizer == 'thread' && 'halt_on_error=0 history_size=4' || '' }}
        run: xmake run bytecask_tests

  # ---------------------------------------------------------------------------
  # Fuzz testing (libFuzzer + ASan, 60s per target)
  # ---------------------------------------------------------------------------
  fuzz:
    runs-on: ubuntu-latest
    container:
      image: fedora:43
    env:
      BYTECASK_MARCH: x86-64-v3
      XMAKE_ROOT: "y"
      CLANG_TARGET_TRIPLE: x86_64-redhat-linux-gnu
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_data_entry, fuzz_hint_entry]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y \
            clang llvm llvm-devel lld \
            libcxx libcxx-devel \
            xmake \
            python3-pip python3-devel \
            git ninja-build
          pip3 install nanobind pytest hypothesis

      - name: Configure xmake
        run: |
          RESOURCE_DIR=$(clang --print-resource-dir)
          xmake f --toolchain=clang \
            --cxflags="-resource-dir=${RESOURCE_DIR}" \
            --sanitizer=fuzzer,address \
            -m debug -y

      - name: Generate seed corpus
        run: |
          xmake build gen_fuzz_corpus
          xmake run gen_fuzz_corpus

      - name: Build fuzz target
        run: xmake build ${{ matrix.target }}

      - name: Run ${{ matrix.target }} (60s)
        run: |
          TARGET=${{ matrix.target }}
          NAME="${TARGET#fuzz_}"
          CORPUS="tests/fuzz/corpus/$NAME/"
          SEED="tests/fuzz/seed/$NAME/"
          mkdir -p "$CORPUS"
          BIN="build/linux/x86_64/debug/$TARGET"
          "$BIN" "$CORPUS" "$SEED" -max_total_time=60 -max_len=65536

  # ---------------------------------------------------------------------------
  # Coverage (LLVM/Clang)
  # ---------------------------------------------------------------------------
  coverage:
    runs-on: ubuntu-latest
    container:
      image: fedora:43
    permissions:
      contents: read
      id-token: write
    env:
      BYTECASK_MARCH: x86-64-v3
      XMAKE_ROOT: "y"
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y \
            clang llvm llvm-devel lld \
            libcxx libcxx-devel \
            xmake \
            python3-pip python3-devel \
            git ninja-build
          pip3 install nanobind pytest hypothesis

      - name: Run coverage pipeline
        run: bash scripts/run_coverage.sh

      - name: Upload coverage HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/html/

      - name: Upload lcov artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          files: ./lcov.info
          flags: cpp
          name: bytecask-cpp
          slug: gustavoamigo/bytecaskdb
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          use_oidc: true
