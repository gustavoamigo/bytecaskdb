# SPDX-License-Identifier: MIT
# Main CI pipeline: build, test, sanitizers, and the MariaDB
# plugin suites (Linux only).
# macOS coverage is handled by build-wheels.yml.

name: CI

on:
  # A change that touches only documentation runs nothing here, as a pull
  # request or as a push to main: no job reads Markdown. A change that also
  # touches anything else runs everything.
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch, main or a pull request's, cancels the run it
# supersedes: only the latest commit's result is wanted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Build and run all test targets
  # ---------------------------------------------------------------------------
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: fedora:43
    permissions:
      contents: read
      checks: write
      id-token: write
    env:
      BYTECASK_MARCH: x86-64-v3
      XMAKE_ROOT: "y"
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y \
            clang llvm llvm-devel lld \
            libcxx libcxx-devel libstdc++-static \
            xmake \
            python3-pip python3-devel \
            git ninja-build
          pip3 install nanobind pytest hypothesis

      - name: Configure xmake
        run: |
          RESOURCE_DIR=$(clang --print-resource-dir)
          xmake f --toolchain=clang \
            --cxflags="-resource-dir=${RESOURCE_DIR}" \
            -y

      - name: Build all test targets
        run: |
          xmake build bytecask_tests
          xmake build btree_tests
          # Built here so a break shows up on the PR; they run in
          # crash-nightly.yml, isolation-nightly.yml and chaos-nightly.yml.
          xmake build crash_consistency
          xmake build isolation_history
          xmake build chaos_worker

      - name: Run tests and generate JUnit reports
        run: |
          mkdir -p test-results
          status=0
          build/linux/x86_64/release/bytecask_tests --reporter junit --out test-results/bytecask_tests.xml || status=1
          build/linux/x86_64/release/btree_tests --reporter junit --out test-results/btree_tests.xml || status=1
          exit "$status"

      - name: Run chaosfs model tests
        # The chaos rig's filesystem model, without FUSE; the rig itself runs
        # in chaos-nightly.yml.
        run: python3 -m unittest tests/chaos/test_chaosfs.py -v

      - name: Run proof independence tests (Hypothesis) and the Python reference
        run: |
          xmake build bytecaskdb_python
          PYTHONPATH=bytecaskdb-python python3 -m pytest tests/proof/test_independence.py \
            bytecaskdb-python/tests/test_reference.py \
            bytecaskdb-python/tests/test_persistent_tree.py -v

      - name: Enrich JUnit reports with source metadata
        if: ${{ always() && !cancelled() }}
        run: |
          /usr/bin/python scripts/enrich_junit_sources.py \
            --pair build/linux/x86_64/release/bytecask_tests:test-results/bytecask_tests.xml \
            --pair build/linux/x86_64/release/btree_tests:test-results/btree_tests.xml

      - name: Publish test results in GitHub Checks
        if: ${{ always() && !cancelled() }}
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: test-results/*.xml
          check_name: Test Results
          comment_mode: off

      - name: Upload JUnit reports artifact
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: test-results/*.xml

      - name: Upload test results to Codecov
        if: ${{ always() && !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          files: |
            ./test-results/bytecask_tests.xml
            ./test-results/btree_tests.xml
          report_type: test_results
          flags: cpp
          name: bytecask-cpp-tests
          slug: gustavoamigo/bytecaskdb
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          use_oidc: true

  thread-local-tags:
    # Every thread_local in engine and binding code says whether it is
    # scratch, process-wide or per-DB (docs/bytecask_design.md, Per-thread
    # state): one that holds a DB's state leaks across instances.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every thread_local is tagged
        run: python3 scripts/check_thread_local.py

  mutation-patches:
    # The soak's, the chaos rig's and the durability sites' mutations are
    # diffs against engine code.
    # Each must still apply by three-way merge (scripts/mutation_patch.sh): a
    # change to lines near its target merges, a change to the targeted code
    # conflicts, and then the patch must be regenerated (make the same break,
    # save `git diff`) or deleted if its target is gone. The merge needs the
    # blobs the patches were made against, so this job checks out all history.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mutation patches still apply
        run: |
          status=0
          for p in tests/soak_mutations/*.patch tests/chaos_mutations/*.patch \
                   tests/durability_mutations/*.patch; do
            if ! scripts/mutation_patch.sh check "$p"; then
              echo "::error file=$p::conflicts with the current code; regenerate it"
              status=1
            fi
          done
          exit "$status"

  # ---------------------------------------------------------------------------
  # The blind-leaf tree (docs/blind_leaf_btree_design.md) is the default key
  # directory, so the main job covers it. The B+ tree that keeps its keys in
  # the leaves stays selectable with BYTECASK_KEYDIR=btree; this job runs the
  # same engine suite on it.
  # ---------------------------------------------------------------------------
  btree-keydir:
    runs-on: ubuntu-latest
    container:
      image: fedora:43
    env:
      BYTECASK_MARCH: x86-64-v3
      XMAKE_ROOT: "y"
      BYTECASK_KEYDIR: btree
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y \
            clang llvm llvm-devel lld \
            libcxx libcxx-devel libstdc++-static \
            xmake \
            python3-pip python3-devel \
            git ninja-build
          # bytecaskdb_python's on_load() asks nanobind for its include dir, and
          # xmake f loads every target — so this job needs it even though it
          # only builds bytecask_tests.
          pip3 install nanobind

      - name: Configure xmake
        run: |
          RESOURCE_DIR=$(clang --print-resource-dir)
          xmake f --toolchain=clang \
            --cxflags="-resource-dir=${RESOURCE_DIR}" \
            -y

      - name: Build and run the engine suite on the keyed B+ tree key directory
        run: |
          xmake build bytecask_tests
          build/linux/x86_64/release/bytecask_tests

  # ---------------------------------------------------------------------------
  # MariaDB storage engine plugin: unit + proof tests (Catch2/ctest) and the
  # functional suite against a live mariadbd (pytest).
  # ---------------------------------------------------------------------------
  mariadb-plugin:
    runs-on: ubuntu-latest
    container:
      image: fedora:43
    permissions:
      contents: read
      checks: write
      id-token: write
    env:
      BYTECASK_MARCH: x86-64-v3
      XMAKE_ROOT: "y"
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y \
            clang llvm llvm-devel lld \
            libcxx libcxx-devel libstdc++-static \
            gcc gcc-c++ cmake \
            xmake \
            python3-pip python3-devel \
            git ninja-build \
            mariadb mariadb-server mariadb-devel \
            google-crc32c-devel
          pip3 install nanobind
          pip3 install -r bytecaskdb-mariadb-plugin/tests/functional/requirements.txt

      - name: Configure xmake
        run: |
          RESOURCE_DIR=$(clang --print-resource-dir)
          xmake f --toolchain=clang \
            --cxflags="-resource-dir=${RESOURCE_DIR}" \
            -y

      - name: Build engine static libraries
        run: |
          xmake build bytecask
          xmake build bytecask_testing

      - name: Build plugin and test binaries
        run: |
          cmake -S bytecaskdb-mariadb-plugin -B bytecaskdb-mariadb-plugin/build \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build bytecaskdb-mariadb-plugin/build --parallel

      - name: Run unit and proof tests
        run: |
          mkdir -p test-results
          cd bytecaskdb-mariadb-plugin/build
          ctest --output-on-failure \
            --output-junit "${GITHUB_WORKSPACE}/test-results/mariadb_plugin_ctest.xml"

      - name: Run functional tests against mariadbd
        run: |
          python3 -m pytest bytecaskdb-mariadb-plugin/tests/functional \
            -v -p no:cacheprovider \
            --junitxml=test-results/mariadb_plugin_functional.xml

      - name: Upload mariadbd log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: mariadb-plugin-server-log
          path: .mariadb_functional_test/error.log
          if-no-files-found: ignore

      - name: Publish test results in GitHub Checks
        if: ${{ always() && !cancelled() }}
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: test-results/mariadb_plugin_*.xml
          check_name: MariaDB Plugin Test Results
          comment_mode: off

      - name: Upload JUnit reports artifact
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-mariadb-plugin-results
          path: test-results/mariadb_plugin_*.xml

      - name: Upload test results to Codecov
        if: ${{ always() && !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          files: |
            ./test-results/mariadb_plugin_ctest.xml
            ./test-results/mariadb_plugin_functional.xml
          report_type: test_results
          flags: mariadb-plugin
          name: mariadb-plugin-tests
          slug: gustavoamigo/bytecaskdb
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          use_oidc: true

  # ---------------------------------------------------------------------------
  # Sanitizer checks, in sanitizers.yml. A PR and the push to main that merges
  # it get ASan, TSan and UBSan on the default key directory. Every sanitizer
  # on all three key directories runs on the nightly schedule in
  # sanitizers.yml itself, not on each merge.
  # ---------------------------------------------------------------------------
  sanitizers:
    uses: ./.github/workflows/sanitizers.yml
    with:
      keydirs: '["blind"]'
      sanitizers: '["address", "thread", "undefined"]'

  # ---------------------------------------------------------------------------
  # Node.js bindings (bytecaskdb-node): native (N-API) and WASM (Embind)
  # backends, both exercised by the shared Vitest suite.
  # ---------------------------------------------------------------------------
  node-tests:
    runs-on: ubuntu-latest
    container:
      image: fedora:43
    env:
      BYTECASK_MARCH: x86-64-v3
      XMAKE_ROOT: "y"
      EMSDK: /opt/emsdk
      EM_CONFIG: /opt/emsdk/.emscripten
      EMSDK_VERSION: "6.0.11"
    steps:
      - uses: actions/checkout@v4

      # python3/nanobind aren't used by anything in this job (no Python
      # target is built here) but are still required: `xmake f` evaluates
      # every target's on_load project-wide, including bytecaskdb_python's,
      # which hard-imports nanobind to resolve include paths regardless of
      # which target is actually being configured/built.
      - name: Install dependencies
        run: |
          dnf install -y \
            clang llvm llvm-devel lld \
            libcxx libcxx-devel libstdc++-static \
            xmake cmake \
            python3-pip python3-devel \
            git ninja-build
          pip3 install nanobind

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Cache the SDK itself (a full install is ~1 GB and several minutes).
      # The version is pinned and is the cache key, so a new Emscripten
      # arrives as a commit that changes EMSDK_VERSION, never through a cache
      # eviction (#259, #292).
      - name: Cache Emscripten SDK
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: /opt/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}

      - name: Install Emscripten SDK
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /opt/emsdk
          cd /opt/emsdk && ./emsdk install "$EMSDK_VERSION" && ./emsdk activate "$EMSDK_VERSION"

      # wasm_embind (and every other WASM xmake target) links a prebuilt
      # crc32c-wasm and zstd-wasm the xmake targets don't build themselves —
      # only wasm/build.sh does (cross-compiling crc32c, zstd, Google
      # Benchmark, and Catch2 for WASM, via emcmake/emmake). Cache it keyed on
      # the emsdk version and build.sh's own contents, so a new compiler or a
      # change to the cross-compile recipe invalidates the cache.
      #
      # emsdk_env.sh prepends emsdk's own clang to PATH — normally unsafe
      # here, since it's also named "clang" and would shadow the system
      # clang xmake's native "clang" toolchain expects (see 8bb3ed2, "Pin
      # devcontainer to system clang, fixing emsdk PATH shadowing"). Sourcing
      # it only inside this one step's `run:` block keeps that prepended
      # PATH scoped to this step's subshell — it never reaches the later
      # "Configure xmake" step, which starts fresh from the job's own env.
      - name: Cache WASM dependencies (crc32c, zstd, Google Benchmark, Catch2)
        id: wasm-deps-cache
        uses: actions/cache@v4
        with:
          path: bytecaskdb-node/wasm/build
          key: wasm-deps-${{ env.EMSDK_VERSION }}-${{ hashFiles('bytecaskdb-node/wasm/build.sh') }}

      - name: Build WASM dependencies
        if: steps.wasm-deps-cache.outputs.cache-hit != 'true'
        working-directory: bytecaskdb-node/wasm
        run: |
          source /opt/emsdk/emsdk_env.sh
          bash build.sh

      - name: Configure xmake (native toolchain pinned to system clang)
        run: |
          RESOURCE_DIR=$(/usr/bin/clang --print-resource-dir)
          xmake f --toolchain=clang --cc=/usr/bin/clang --cxx=/usr/bin/clang++ \
            --cxflags="-resource-dir=${RESOURCE_DIR}" -y

      - name: npm ci
        working-directory: bytecaskdb-node
        run: npm ci

      - name: Build native addon and WASM module
        run: |
          xmake build bytecaskdb_node
          xmake build wasm_embind

      - name: Smoke test native backend
        run: npm run --prefix bytecaskdb-node test:smoke:native

      - name: Smoke test WASM backend
        run: npm run --prefix bytecaskdb-node test:smoke

      - name: Run Vitest suite (WASM backend, default)
        working-directory: bytecaskdb-node
        run: npm test

      - name: Run Vitest suite (native backend)
        working-directory: bytecaskdb-node
        env:
          BC_TEST_BACKEND: native
        run: npm test

      # The engine's own Catch2 suite, compiled for WASM: a 32-bit size_t,
      # one thread, NODERAWFS. `xmake run` leaves out the [concurrency] and
      # [lock] cases one thread cannot run; everything else runs, so a 32-bit
      # break shows here (#373, #292).
      - name: Build engine test suite (WASM)
        run: xmake build wasm_tests

      - name: Run engine test suite (WASM)
        run: xmake run wasm_tests

  # ---------------------------------------------------------------------------
  # Coverage (LLVM/Clang)
  # ---------------------------------------------------------------------------
  coverage:
    runs-on: ubuntu-latest
    container:
      image: fedora:43
    permissions:
      contents: read
      id-token: write
    env:
      BYTECASK_MARCH: x86-64-v3
      XMAKE_ROOT: "y"
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y \
            clang llvm llvm-devel lld \
            libcxx libcxx-devel libstdc++-static \
            xmake \
            python3-pip python3-devel \
            git ninja-build
          pip3 install nanobind pytest hypothesis

      # Fails when MC/DC on the durability and recovery code drops below
      # 100% after exemptions (scripts/mcdc_report.py); the report is still
      # written, so the uploads below run either way.
      - name: Run coverage pipeline
        run: bash scripts/run_coverage.sh

      - name: Upload coverage HTML artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/html/

      - name: Upload lcov artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          files: ./lcov.info
          flags: cpp
          name: bytecask-cpp
          slug: gustavoamigo/bytecaskdb
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          use_oidc: true
