# SPDX-License-Identifier: MIT
# Nightly memory checks for the Node.js bindings (#292). ci.yml's node-tests
# job runs the Vitest suite on optimised builds of both backends; these jobs
# run it again on builds that turn a memory error into a failure:
#
#   native-asan  the N-API addon built with AddressSanitizer. Wrapper
#                finalizers run when V8 collects, in an order no test
#                controls; test/integration/finalizers.test.ts forces
#                collections (vitest.config.ts passes --expose-gc), so a
#                finalizer that reaches a freed DB is a reported
#                use-after-free rather than silent corruption.
#   wasm-checked the WASM module linked with SAFE_HEAP and ASSERTIONS=2
#                (`xmake f --wasm_checked=y`): each load and store is
#                checked, and Embind checks every call's arguments.
#
# Both are several times slower than the release builds, hence nightly, and
# on every update of a PR that changes this file.

name: Node bindings (nightly)

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/node-nightly.yml"

permissions:
  contents: read

jobs:
  native-asan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: fedora:43
    env:
      BYTECASK_MARCH: x86-64-v3
      XMAKE_ROOT: "y"
      CLANG_TARGET_TRIPLE: x86_64-redhat-linux-gnu
    steps:
      - uses: actions/checkout@v4

      # nanobind: xmake f loads every target, bytecaskdb_python's included.
      - name: Install dependencies
        run: |
          dnf install -y \
            clang llvm llvm-devel lld compiler-rt \
            libcxx libcxx-devel libstdc++-static \
            xmake cmake \
            python3-pip python3-devel \
            git ninja-build
          pip3 install nanobind

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Before xmake f: the addon's on_load resolves node-addon-api from
      # node_modules.
      - name: npm ci
        working-directory: bytecaskdb-node
        run: npm ci

      - name: Configure xmake
        run: |
          RESOURCE_DIR=$(clang --print-resource-dir)
          xmake f --toolchain=clang \
            --cxflags="-resource-dir=${RESOURCE_DIR}" \
            --sanitizer=address -m debug -y

      - name: Build native addon
        run: xmake build bytecaskdb_node

      # A shared library built with -fsanitize=address leaves the ASan
      # runtime to the executable, and node is not built with it, so the
      # runtime is preloaded. Leak detection is off: it would report V8's
      # own allocations still live at exit, not the addon's.
      - name: Run Vitest suite (native backend, ASan)
        working-directory: bytecaskdb-node
        env:
          BC_TEST_BACKEND: native
          ASAN_OPTIONS: detect_leaks=0
        run: |
          RT=$(find "$(clang --print-resource-dir)" -name 'libclang_rt.asan*.so' \
               ! -name '*preinit*' | head -n 1)
          test -n "$RT" || { echo "no ASan runtime found"; exit 1; }
          echo "ASan runtime: $RT"
          LD_PRELOAD="$RT" npx vitest run --testTimeout=120000

  wasm-checked:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: fedora:43
    env:
      BYTECASK_MARCH: x86-64-v3
      XMAKE_ROOT: "y"
      EMSDK: /opt/emsdk
      EM_CONFIG: /opt/emsdk/.emscripten
      EMSDK_VERSION: "6.0.11"
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y \
            clang llvm llvm-devel lld \
            libcxx libcxx-devel libstdc++-static \
            xmake cmake \
            python3-pip python3-devel \
            git ninja-build
          pip3 install nanobind

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The same SDK and WASM dependency caches as ci.yml's node-tests job;
      # see the comments there.
      - name: Cache Emscripten SDK
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: /opt/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}

      - name: Install Emscripten SDK
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /opt/emsdk
          cd /opt/emsdk && ./emsdk install "$EMSDK_VERSION" && ./emsdk activate "$EMSDK_VERSION"

      - name: Cache WASM dependencies (crc32c, zstd, Google Benchmark, Catch2)
        id: wasm-deps-cache
        uses: actions/cache@v4
        with:
          path: bytecaskdb-node/wasm/build
          key: wasm-deps-${{ env.EMSDK_VERSION }}-${{ hashFiles('bytecaskdb-node/wasm/build.sh') }}

      - name: Build WASM dependencies
        if: steps.wasm-deps-cache.outputs.cache-hit != 'true'
        working-directory: bytecaskdb-node/wasm
        run: |
          source /opt/emsdk/emsdk_env.sh
          bash build.sh

      - name: npm ci
        working-directory: bytecaskdb-node
        run: npm ci

      - name: Configure xmake (checked WASM build)
        run: |
          RESOURCE_DIR=$(/usr/bin/clang --print-resource-dir)
          xmake f --toolchain=clang --cc=/usr/bin/clang --cxx=/usr/bin/clang++ \
            --cxflags="-resource-dir=${RESOURCE_DIR}" --wasm_checked=y -y

      - name: Build checked WASM module and smoke test
        run: |
          xmake build wasm_embind
          xmake build wasm_smoke_test

      - name: Smoke test (checked WASM)
        run: node bytecaskdb-node/wasm/build/wasm_smoke_test.js

      - name: Run Vitest suite (checked WASM)
        working-directory: bytecaskdb-node
        run: npx vitest run --testTimeout=120000
