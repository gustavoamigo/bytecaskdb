# SPDX-License-Identifier: MIT
# Nightly fuzz run (libFuzzer + ASan), 30 minutes per target.
#
# The only place the fuzz targets are built: a harness that stops compiling
# fails here, the next night. Each target's corpus is cached between runs, so
# a night starts from what the last one found rather than from the seeds, and
# is minimised (-merge=1) before it is saved.

name: Fuzz (nightly)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    container:
      image: fedora:43
    env:
      BYTECASK_MARCH: x86-64-v3
      XMAKE_ROOT: "y"
      CLANG_TARGET_TRIPLE: x86_64-redhat-linux-gnu
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_data_entry, fuzz_hint_entry, fuzz_data_file_scan]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y \
            clang llvm llvm-devel lld \
            libcxx libcxx-devel \
            xmake \
            python3-pip python3-devel \
            git ninja-build
          pip3 install nanobind pytest hypothesis

      - name: Configure xmake
        run: |
          RESOURCE_DIR=$(clang --print-resource-dir)
          xmake f --toolchain=clang \
            --cxflags="-resource-dir=${RESOURCE_DIR}" \
            --sanitizer=fuzzer,address \
            -m debug -y

      - name: Generate seed corpus
        run: |
          xmake build gen_fuzz_corpus
          xmake run gen_fuzz_corpus

      - name: Build fuzz target
        run: xmake build ${{ matrix.target }}

      - name: Restore corpus
        uses: actions/cache/restore@v4
        with:
          path: tests/fuzz/corpus/
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Run ${{ matrix.target }} (30 min)
        run: |
          TARGET=${{ matrix.target }}
          NAME="${TARGET#fuzz_}"
          CORPUS="tests/fuzz/corpus/$NAME/"
          SEED="tests/fuzz/seed/$NAME/"
          mkdir -p "$CORPUS" tests/fuzz/findings
          BIN="build/linux/x86_64/debug/$TARGET"
          "$BIN" "$CORPUS" "$SEED" -max_total_time=1800 -max_len=65536 \
            -artifact_prefix=tests/fuzz/findings/

      # Keeps only inputs that add coverage, so the cache does not grow
      # night after night. Runs after a finding too: the corpus up to it is
      # still worth keeping.
      - name: Minimise corpus
        if: always()
        run: |
          TARGET=${{ matrix.target }}
          NAME="${TARGET#fuzz_}"
          CORPUS="tests/fuzz/corpus/$NAME"
          BIN="build/linux/x86_64/debug/$TARGET"
          [ -d "$CORPUS" ] && [ -x "$BIN" ] || exit 0
          mkdir -p "$CORPUS.min"
          "$BIN" -merge=1 "$CORPUS.min" "$CORPUS"
          rm -rf "$CORPUS"
          mv "$CORPUS.min" "$CORPUS"

      - name: Save corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tests/fuzz/corpus/
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: tests/fuzz/corpus/
          if-no-files-found: ignore

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: tests/fuzz/findings/
          if-no-files-found: ignore
