# SPDX-License-Identifier: MIT
# The SQL layer (bytecaskdb-sql-layer, #487): its tests, under the
# sanitizers too. Its own workflow, apart from the engine's: the engine's jobs
# do not build the layer. Its contract's vocabulary is checked in
# contract.yml, so a change to the layer's Markdown alone builds nothing.
#
# It runs on a pull request to any base, so a PR stacked on another layer PR
# gets CI, and on the push to main. It is path-filtered to the layer's code and
# to what the layer builds on: the engine, its public header and the build.
#
# Nothing here installs a MariaDB development package, and nothing under
# bytecaskdb-sql-layer/ may include a MariaDB header: building the layer here
# is what keeps that true (docs/project_organization.md).

name: SQL layer

on:
  push:
    branches: [main]
    paths:
      - "bytecaskdb-sql-layer/**"
      - "!bytecaskdb-sql-layer/**/*.md"
      - "bytecaskdb/**"
      - "include/**"
      - "xmake.lua"
      # Linked into sql_layer_tests: the counted allocation-failure seam.
      - "tests/alloc_faults.cpp"
      - "tests/alloc_faults.h"
      - ".github/workflows/sql-layer.yml"
      # Runs the sanitizer jobs.
      - ".github/workflows/sanitizers.yml"
      - "scripts/enrich_junit_sources.py"
  pull_request:
    # No branches filter: any base.
    paths:
      - "bytecaskdb-sql-layer/**"
      - "!bytecaskdb-sql-layer/**/*.md"
      - "bytecaskdb/**"
      - "include/**"
      - "xmake.lua"
      # Linked into sql_layer_tests: the counted allocation-failure seam.
      - "tests/alloc_faults.cpp"
      - "tests/alloc_faults.h"
      - ".github/workflows/sql-layer.yml"
      # Runs the sanitizer jobs.
      - ".github/workflows/sanitizers.yml"
      - "scripts/enrich_junit_sources.py"
  # The sanitizers' nightly run, as sanitizers.yml has for the engine.
  schedule:
    - cron: "50 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Only a pull request's runs cancel each other. The nightly, a dispatch and
# the push to main all run on refs/heads/main: sharing a cancelling group,
# one would cancel another and leave a commit with no result for the layer.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ci.yml runs this check too, but ignores a change confined to the layer:
  # without it here, an untagged thread_local in the layer would merge green
  # (CLAUDE.md, Thread-local state).
  thread-local-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every thread_local is tagged
        run: python3 scripts/check_thread_local.py

  sql-layer-tests:
    runs-on: ubuntu-latest
    # A deadlocked concurrency test would otherwise hold the runner for
    # GitHub's six-hour default; sanitizers.yml's bound.
    timeout-minutes: 60
    container:
      image: fedora:43
    # The proof tests' oracle (tests/proof/, #515), reached as host "postgres".
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    permissions:
      contents: read
      checks: write
      id-token: write
    env:
      BYTECASK_MARCH: x86-64-v3
      XMAKE_ROOT: "y"
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # make and which: the libpg_query and TinyCC builds. nanobind:
          # xmake f loads every target, bytecaskdb_python's included.
          dnf install -y \
            clang llvm llvm-devel lld \
            libcxx libcxx-devel libstdc++-static \
            xmake make which \
            python3-pip python3-devel \
            git ninja-build
          pip3 install nanobind

      # The HammerDB driver sends only statements the proof suite checks
      # against PostgreSQL (docs/server_design.md, *The HammerDB driver*).
      - name: The driver's statements are the proved ones
        run: python3 bytecaskdb-sql-layer/scripts/check_driver_statements.py

      # libpg_query and TinyCC are cloned and built from source by xmake;
      # the key carries every pinned version, kept apart from the engine's.
      - name: Cache xmake packages
        uses: actions/cache@v4
        with:
          path: ~/.xmake/packages
          key: xmake-packages-sql-layer-fedora43-${{ hashFiles('xmake.lua', 'bytecaskdb-sql-layer/xmake.lua') }}

      - name: Configure xmake
        run: |
          RESOURCE_DIR=$(clang --print-resource-dir)
          xmake f --toolchain=clang \
            --cxflags="-resource-dir=${RESOURCE_DIR}" \
            --sql_layer=y -y

      - name: Build and run sql_layer_tests
        run: |
          mkdir -p test-results
          xmake build -y sql_layer_tests
          build/linux/x86_64/release/sql_layer_tests --reporter junit --out test-results/sql_layer_tests.xml

      # The layer against PostgreSQL 17 (docs/testing_design.md): a fixed
      # seed and a bounded budget, the ci profile of tests/proof/conftest.py.
      # With sql_layer_server built, the proof machine also runs its wire
      # target, and tests/server runs the server's protocol tests
      # (docs/server_design.md, *Tests*).
      - name: Build bytecask_sql and sql_layer_server, and run the proof and wire tests
        env:
          BYTECASK_SQL_ORACLE: host=postgres user=postgres password=postgres dbname=postgres
          BYTECASK_SQL_SERVER: build/linux/x86_64/release/sql_layer_server
          HYPOTHESIS_PROFILE: ci
          PYTHONPATH: bytecaskdb-sql-layer/python
        run: |
          xmake build -y bytecask_sql
          xmake build -y sql_layer_server
          pip3 install -r bytecaskdb-sql-layer/tests/proof/requirements.txt
          python3 -m pytest bytecaskdb-sql-layer/tests/proof bytecaskdb-sql-layer/tests/server -v -p no:cacheprovider \
            --junitxml=test-results/sql_layer_proof.xml

      - name: Enrich JUnit report with source metadata
        if: ${{ always() && !cancelled() }}
        run: |
          /usr/bin/python scripts/enrich_junit_sources.py \
            --pair build/linux/x86_64/release/sql_layer_tests:test-results/sql_layer_tests.xml

      - name: Publish SQL layer test results in GitHub Checks
        if: ${{ always() && !cancelled() }}
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: test-results/*.xml
          check_name: SQL Layer Test Results
          comment_mode: off

      - name: Upload JUnit report artifact
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: sql-layer-junit-test-results
          path: test-results/*.xml

      - name: Upload test results to Codecov
        if: ${{ always() && !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          files: ./test-results/sql_layer_tests.xml,./test-results/sql_layer_proof.xml
          report_type: test_results
          flags: sql-layer
          name: sql-layer-tests
          slug: gustavoamigo/bytecaskdb
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          use_oidc: true

  # ASan, TSan and UBSan, debug builds, through the engine's sanitizers.yml.
  # Not under MSan: libpg_query and TinyCC are built uninstrumented by their
  # package rules, and MSan reports their stores as uninitialized reads. The
  # catalog does not depend on BYTECASK_KEYDIR, so the default key directory
  # runs it.
  sql-layer-sanitizers:
    uses: ./.github/workflows/sanitizers.yml
    with:
      target: sql_layer_tests
      sql_layer: true
      keydirs: '["blind"]'
      sanitizers: '["address", "thread", "undefined"]'
