# SPDX-License-Identifier: MIT
# Nightly isolation check: tests/elle/isolation_history.cpp records concurrent
# list-append transaction histories, and scripts/run_isolation_check.py checks
# them with Elle (elle-cli) and a direct commit-sequence cross-check. See
# docs/isolation_checking_design.md.
#
# ci.yml only compiles the generator on every push/PR. The timed run lives
# here, on a schedule plus manual dispatch, and on every update of a PR that
# changes the harness itself. The run's seed is printed first; rerun with
# --seed to replay the same workloads (thread interleaving still varies).

name: Isolation check (nightly)

on:
  schedule:
    - cron: "10 4 * * *"
  workflow_dispatch:
    inputs:
      rounds:
        description: "Rounds per job (three histories each)"
        default: "4"
      cluster_rounds:
        description: "Cluster rounds per job (three histories each)"
        default: "8"
      topology_rounds:
        description: "Topology rounds per job (two histories each)"
        default: "6"
      kill_rounds:
        description: "Kill rounds per job (two histories each)"
        default: "4"
      chaos_minutes:
        description: "Minutes per configuration of the chaos check"
        default: "10"
      seed:
        description: "Seed to replay (empty = random)"
        default: ""
  pull_request:
    branches: [main]
    paths:
      - "tests/elle/**"
      - "scripts/run_isolation_check.py"
      - "tests/chaos/run_chaos.py"
      - "tests/chaos/chaosfs.py"
      - ".github/workflows/isolation-nightly.yml"

permissions:
  contents: read

env:
  # elle-cli publishes no releases; the jar is built from this commit and
  # cached on it.
  ELLE_CLI_REF: 9c2a18b3719f573dab06ae05c955c9c9d5225673

jobs:
  isolation:
    runs-on: ubuntu-latest
    container:
      image: fedora:43
      # FUSE inside the container, for the chaos check's chaosfs.
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined
    env:
      BYTECASK_MARCH: x86-64-v3
      XMAKE_ROOT: "y"
      CLANG_TARGET_TRIPLE: x86_64-redhat-linux-gnu
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            mode: releasedbg
            sanitizer: ""
            txns: 50000
          - name: asan
            mode: debug
            sanitizer: address
            # ASan runs the engine several times slower; a smaller history
            # keeps the job inside the same budget.
            txns: 20000
    name: isolation (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4

      # PROBE for #447, not for merging: does a chaos failure directory reach
      # the uploaded artifact? Two failures are made, then uploaded with the
      # same paths the real workflow uses.
      - name: Install dependencies
        run: |
          dnf install -y python3-pip fuse3 fuse3-libs
          pip3 install mfusepy

      - name: Probe
        run: |
          # A stub: a known file where the rig keeps the unguarded failure.
          mkdir -p "$RUNNER_TEMP/isolation/round-0" \
                   "$RUNNER_TEMP/isolation-chaos-unguarded/failure"
          echo isolation > "$RUNNER_TEMP/isolation/round-0/marker.txt"
          echo stub > "$RUNNER_TEMP/isolation-chaos-unguarded/failure/marker.txt"
          # The real rig, failing at once: a worker that exits 1.
          printf '#!/bin/sh\necho "probe worker exits 1"\nexit 1\n' > "$RUNNER_TEMP/fake_worker.sh"
          chmod +x "$RUNNER_TEMP/fake_worker.sh"
          python3 tests/chaos/run_chaos.py --workload elle --config guarded \
            --worker "$RUNNER_TEMP/fake_worker.sh" --minutes 0.2 --seed 1 --lives 1 \
            --work "$RUNNER_TEMP/isolation-chaos-guarded" || true
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          find "$RUNNER_TEMP" -maxdepth 3 -not -path "*/mnt/*" | sort
          false

      - name: Upload histories and Elle output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: isolation-failure-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/isolation
            ${{ runner.temp }}/isolation-cluster
            ${{ runner.temp }}/isolation-topology
            ${{ runner.temp }}/isolation-kill
            ${{ runner.temp }}/isolation-chaos-guarded/failure
            ${{ runner.temp }}/isolation-chaos-unguarded/failure
          if-no-files-found: ignore
