# SPDX-License-Identifier: MIT
# Build Python wheels for bytecaskdb on Linux (manylinux_2_28) and macOS.
#
# Wheels are uploaded as GitHub Actions artifacts and published to
# GitHub Pages at:
#   https://<user>.github.io/bytecaskdb/python/latest/
#
# Install with:
#   pip install --index-url https://<user>.github.io/bytecaskdb/python/latest/ bytecaskdb
#
# Linux builds run inside the manylinux container with LLVM 20.
# macOS builds use Homebrew LLVM (latest, currently 20) on Apple Silicon
# (`macos-14`). GitHub no longer provides x86_64 macOS hosted runners.

name: Build Python wheels

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Required for GitHub Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Linux x86_64 — manylinux_2_28
  # ---------------------------------------------------------------------------
  linux:
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    env:
      BYTECASK_MARCH: x86-64-v3
    strategy:
      matrix:
        python: ["cp312-cp312", "cp313-cp313", "cp313-cp313t", "cp314-cp314", "cp314-cp314t"]
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM toolchain
        run: |
          dnf module enable -y llvm-toolset:rhel8
          dnf install -y \
            clang clang-tools-extra llvm llvm-devel lld \
            make ninja-build git cmake zip

      - name: Install xmake
        run: |
          curl -fsSL https://xmake.io/shget.text | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Set up Python ${{ matrix.python }}
        run: |
          export PATH=/opt/python/${{ matrix.python }}/bin:$PATH
          echo "/opt/python/${{ matrix.python }}/bin" >> $GITHUB_PATH
          pip install nanobind pytest auditwheel

      - name: Configure xmake
        run: |
          export XMAKE_ROOT=y
          export RESOURCE_DIR=$(clang --print-resource-dir)
          source ~/.xmake/profile
          xmake f --toolchain=llvm \
            --sdk=/usr/lib64/llvm20 \
            --cxflags="-resource-dir=${RESOURCE_DIR}" \
            -y -v

      - name: Build and test C++ engine
        run: |
          export XMAKE_ROOT=y
          source ~/.xmake/profile
          xmake build bytecask_tests
          xmake run bytecask_tests

      - name: Build Python extension
        run: |
          export XMAKE_ROOT=y
          source ~/.xmake/profile
          xmake build bytecaskdb_python

      - name: Run Python tests
        run: |
          PYTHONPATH=bytecask-python python3 -m pytest bytecask-python/tests/ -v

      - name: Build wheel
        run: |
          export XMAKE_ROOT=y
          bash scripts/build_wheel.sh dist/raw

      - name: Repair wheel (auditwheel)
        run: |
          mkdir -p dist/final
          auditwheel repair dist/raw/*.whl -w dist/final --plat manylinux_2_28_x86_64

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-${{ matrix.python }}
          path: dist/final/*.whl

  # ---------------------------------------------------------------------------
  # macOS arm64 (Apple Silicon)
  #
  # GitHub no longer provides x86_64 macOS hosted runners (the `macos-13`
  # image was retired); jobs requesting the `macos-13` label sit in the queue
  # forever. Apple Silicon (`macos-14`) is the only supported macOS runner.
  # If x86_64 wheels become necessary again, build them via cross-compilation
  # from arm64, or via cibuildwheel using a self-hosted Intel Mac.
  # ---------------------------------------------------------------------------
  macos-arm64:
    runs-on: macos-14
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.13t", "3.14", "3.14t"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install LLVM and xmake
        run: |
          brew install llvm xmake

      - name: Install Python dependencies
        run: pip install nanobind pytest delocate

      - name: Configure xmake
        run: |
          LLVM_PREFIX=$(brew --prefix llvm)
          xmake f --toolchain=llvm --sdk="$LLVM_PREFIX" -y -v

      - name: Build and test C++ engine
        run: |
          xmake build bytecask_tests
          xmake run bytecask_tests

      - name: Build Python extension
        run: xmake build bytecaskdb_python

      - name: Run Python tests
        run: |
          PYTHONPATH=bytecask-python python3 -m pytest bytecask-python/tests/ -v

      - name: Build wheel
        run: bash scripts/build_wheel.sh dist/raw

      - name: Repair wheel (delocate)
        run: |
          mkdir -p dist/final
          delocate-wheel -w dist/final dist/raw/*.whl

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-arm64-${{ matrix.python-version }}
          path: dist/final/*.whl

  # ---------------------------------------------------------------------------
  # Publish wheels to GitHub Pages (PEP 503 simple repository)
  # ---------------------------------------------------------------------------
  publish:
    needs: [linux, macos-arm64]
    runs-on: ubuntu-latest
    # Only deploy from pushes to main; PR runs build wheels for verification only.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: wheels
          pattern: wheel-*
          merge-multiple: true

      - name: Build PEP 503 index
        run: |
          mkdir -p site/python/latest/bytecaskdb
          cp wheels/*.whl site/python/latest/bytecaskdb/

          # Generate package index page
          cd site/python/latest/bytecaskdb
          {
            echo '<!DOCTYPE html><html><body>'
            for whl in *.whl; do
              echo "<a href=\"${whl}\">${whl}</a><br>"
            done
            echo '</body></html>'
          } > index.html

          # Generate root index pointing to the package
          cd ..
          echo '<!DOCTYPE html><html><body><a href="bytecaskdb/">bytecaskdb</a></body></html>' > index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
