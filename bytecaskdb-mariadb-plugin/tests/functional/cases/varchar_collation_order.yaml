- name: latin1_nopad_bin primary key
  setup:
    - DROP DATABASE IF EXISTS vco5
    - CREATE DATABASE vco5
    - CREATE TABLE vco5.t (v VARCHAR(8) CHARACTER SET latin1 COLLATE latin1_nopad_bin NOT NULL, PRIMARY KEY (v)) ENGINE=bytecaskdb
    - INSERT INTO vco5.t (v) VALUES ('a'), (CONCAT('a', CHAR(0))), (CONCAT('a', CHAR(0), 'b')), (CONCAT('a', CHAR(1))), (''), (CHAR(1)), ('ab'), ('b')
  steps:
