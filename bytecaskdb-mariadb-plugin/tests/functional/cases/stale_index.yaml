# stale_index.yaml — Stale secondary index entries after UPDATE/REPLACE
#
# These tests verify that old secondary index entries are properly cleaned up
# when a row's indexed column value changes via UPDATE or REPLACE.

- name: UPDATE indexed column cleans up old secondary index entry
  setup:
    - DROP DATABASE IF EXISTS si1
    - CREATE DATABASE si1
    - >
      CREATE TABLE si1.t (id INT PRIMARY KEY, v INT, INDEX idx_v(v))
      ENGINE=bytecaskdb
    - INSERT INTO si1.t VALUES (1, 100), (2, 200), (3, 300)
  steps:
    - sql: UPDATE si1.t SET v = 999 WHERE id = 2
    - sql: SELECT id FROM si1.t WHERE v = 200
      expected: []
    - sql: SELECT id FROM si1.t WHERE v = 999
      expected: [['2']]
  teardown:
    - DROP DATABASE IF EXISTS si1

- name: UPDATE VARCHAR indexed column cleans up old entry
  setup:
    - DROP DATABASE IF EXISTS si2
    - CREATE DATABASE si2
    - >
      CREATE TABLE si2.t (id INT PRIMARY KEY, name VARCHAR(64), INDEX idx_name(name))
      ENGINE=bytecaskdb
    - INSERT INTO si2.t VALUES (1, 'alice'), (2, 'bob'), (3, 'carol')
  steps:
    - sql: UPDATE si2.t SET name = 'dave' WHERE id = 2
    - sql: SELECT id FROM si2.t WHERE name = 'bob'
      expected: []
    - sql: SELECT id FROM si2.t WHERE name = 'dave'
      expected: [['2']]
  teardown:
    - DROP DATABASE IF EXISTS si2

- name: UPDATE multiple rows cleans up all old index entries
  setup:
    - DROP DATABASE IF EXISTS si3
    - CREATE DATABASE si3
    - >
      CREATE TABLE si3.t (id INT PRIMARY KEY, v INT, INDEX idx_v(v))
      ENGINE=bytecaskdb
    - INSERT INTO si3.t VALUES (1, 10), (2, 10), (3, 10)
  steps:
    - sql: UPDATE si3.t SET v = 99
    - sql: SELECT id FROM si3.t WHERE v = 10
      expected: []
    - sql: SELECT COUNT(*) FROM si3.t WHERE v = 99
      expected: [['3']]
  teardown:
    - DROP DATABASE IF EXISTS si3

- name: REPLACE on PK conflict cleans up old secondary index entries
  setup:
    - DROP DATABASE IF EXISTS si4
    - CREATE DATABASE si4
    - >
      CREATE TABLE si4.t (a INT PRIMARY KEY, b INT, c INT,
        INDEX idx_b(b), INDEX idx_c(c)) ENGINE=bytecaskdb
    - INSERT INTO si4.t VALUES (1, 10, 100), (2, 20, 200), (3, 30, 300)
  steps:
    - sql: REPLACE INTO si4.t VALUES (2, 77, 777)
    - sql: SELECT a FROM si4.t WHERE b = 20
      expected: []
    - sql: SELECT a FROM si4.t WHERE c = 200
      expected: []
    - sql: SELECT a FROM si4.t WHERE b = 77
      expected: [['2']]
    - sql: SELECT a FROM si4.t WHERE c = 777
      expected: [['2']]
  teardown:
    - DROP DATABASE IF EXISTS si4

- name: REPLACE on UNIQUE key conflict cleans up old secondary index entries
  setup:
    - DROP DATABASE IF EXISTS si5
    - CREATE DATABASE si5
    - >
      CREATE TABLE si5.t (id INT AUTO_INCREMENT PRIMARY KEY,
        email VARCHAR(64) NOT NULL, score INT,
        UNIQUE INDEX idx_email(email), INDEX idx_score(score))
      ENGINE=bytecaskdb
    - INSERT INTO si5.t (email, score) VALUES ('a@x.com', 50), ('b@x.com', 75)
  steps:
    - sql: REPLACE INTO si5.t (email, score) VALUES ('a@x.com', 99)
    - sql: SELECT id, score FROM si5.t WHERE email = 'a@x.com'
      expected: [['3', '99']]
    - sql: SELECT id FROM si5.t WHERE score = 50
      expected: []
    - sql: SELECT id FROM si5.t WHERE score = 99
      expected: [['3']]
  teardown:
    - DROP DATABASE IF EXISTS si5

- name: UPDATE with multiple indexes cleans up all affected indexes
  setup:
    - DROP DATABASE IF EXISTS si6
    - CREATE DATABASE si6
    - >
      CREATE TABLE si6.t (id INT PRIMARY KEY, a INT, b VARCHAR(32),
        INDEX idx_a(a), INDEX idx_b(b)) ENGINE=bytecaskdb
    - INSERT INTO si6.t VALUES (1, 10, 'hello'), (2, 20, 'world')
  steps:
    - sql: UPDATE si6.t SET a = 99, b = 'changed' WHERE id = 1
    - sql: SELECT id FROM si6.t WHERE a = 10
      expected: []
    - sql: SELECT id FROM si6.t WHERE b = 'hello'
      expected: []
    - sql: SELECT id FROM si6.t WHERE a = 99
      expected: [['1']]
    - sql: SELECT id FROM si6.t WHERE b = 'changed'
      expected: [['1']]
  teardown:
    - DROP DATABASE IF EXISTS si6
