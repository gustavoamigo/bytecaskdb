# check_table.yaml — CHECK TABLE behavior
#
# ByteCaskDB implements ha_check() which walks all rows and verifies that
# every secondary index entry exists. Returns OK for consistent tables.

- name: CHECK TABLE returns OK for consistent table
  setup:
    - DROP DATABASE IF EXISTS ck1
    - CREATE DATABASE ck1
    - CREATE TABLE ck1.t (a INT PRIMARY KEY, b CHAR(8)) ENGINE=bytecaskdb
    - INSERT INTO ck1.t VALUES (1, 'a'), (2, 'b'), (3, 'c')
  query: CHECK TABLE ck1.t
  expected:
    - ['ck1.t', 'check', 'status', 'OK']
  teardown:
    - DROP DATABASE IF EXISTS ck1

- name: CHECK TABLE FOR UPGRADE passes (frm-level check only)
  setup:
    - DROP DATABASE IF EXISTS ck3
    - CREATE DATABASE ck3
    - CREATE TABLE ck3.t (a INT PRIMARY KEY, b CHAR(8)) ENGINE=bytecaskdb
    - INSERT INTO ck3.t VALUES (1, 'x')
  query: CHECK TABLE ck3.t FOR UPGRADE
  expected:
    - ['ck3.t', 'check', 'status', 'OK']
  teardown:
    - DROP DATABASE IF EXISTS ck3

- name: CHECK TABLE multiple tables
  setup:
    - DROP DATABASE IF EXISTS ck8
    - CREATE DATABASE ck8
    - CREATE TABLE ck8.t1 (a INT PRIMARY KEY) ENGINE=bytecaskdb
    - CREATE TABLE ck8.t2 (a INT PRIMARY KEY) ENGINE=bytecaskdb
    - INSERT INTO ck8.t1 VALUES (1)
    - INSERT INTO ck8.t2 VALUES (2)
  query: CHECK TABLE ck8.t1, ck8.t2
  expected:
    - ['ck8.t1', 'check', 'status', 'OK']
    - ['ck8.t2', 'check', 'status', 'OK']
  teardown:
    - DROP DATABASE IF EXISTS ck8

- name: CHECK TABLE with secondary index
  setup:
    - DROP DATABASE IF EXISTS ck9
    - CREATE DATABASE ck9
    - >
      CREATE TABLE ck9.t (a INT PRIMARY KEY, b INT, c VARCHAR(32),
        INDEX idx_b(b), INDEX idx_c(c)) ENGINE=bytecaskdb
    - >
      INSERT INTO ck9.t VALUES (1, 10, 'hello'), (2, 20, 'world'),
      (3, 30, 'foo')
  query: CHECK TABLE ck9.t
  expected:
    - ['ck9.t', 'check', 'status', 'OK']
  teardown:
    - DROP DATABASE IF EXISTS ck9
