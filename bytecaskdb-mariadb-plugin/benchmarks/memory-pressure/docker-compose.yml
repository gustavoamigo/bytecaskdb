services:
  innodb:
    security_opt:
      - seccomp:unconfined
    image: docker.io/library/mariadb:10.11
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 8
    volumes:
      - ./innodb.cnf:/etc/mysql/mariadb.conf.d/90-benchmark.cnf:ro,Z
      - innodb-data:/var/lib/mysql
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 1
      MARIADB_DATABASE: sbtest
    healthcheck:
      test: ["CMD", "mariadb", "-u", "root", "-e", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  bytecaskdb:
    security_opt:
      - seccomp:unconfined  
    build:
      context: ../../..
      dockerfile: bytecaskdb-mariadb-plugin/Dockerfile
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 8
    restart: on-failure:3
    volumes:
      - ./bytecaskdb.cnf:/etc/mysql/mariadb.conf.d/90-benchmark.cnf:ro,Z
      - bytecaskdb-data:/var/lib/mysql
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 1
      MARIADB_DATABASE: sbtest
    healthcheck:
      test: ["CMD", "mariadb", "-u", "root", "-e", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  sysbench:
    build:
      context: .
      dockerfile: Dockerfile.sysbench
    privileged: true
    pid: host
    cpus: 4
    security_opt:
      - label:disable
    depends_on:
      innodb:
        condition: service_healthy
      bytecaskdb:
        condition: service_healthy
    volumes:
      - ./run-benchmark.sh:/benchmark/run-benchmark.sh:ro,Z
      - ./results:/results:Z

volumes:
  innodb-data:
  bytecaskdb-data:
