- name: SUM, AVG, MIN and MAX of a DOUBLE column, ALL or DISTINCT
  features: [E091-01, E091-03, E091-04, E091-05, E091-06, E091-07]
  setup:
    - CREATE TABLE d (id INTEGER PRIMARY KEY, k INTEGER, f DOUBLE PRECISION)
  steps:
    - sql: INSERT INTO d VALUES ($1, $2, $3)
      params: [1, 1, 1.5]
      rowcount: 1
    - sql: INSERT INTO d VALUES ($1, $2, $3)
      params: [2, 1, 1.5]
      rowcount: 1
    - sql: INSERT INTO d VALUES ($1, $2, $3)
      params: [3, 1, 2.5]
      rowcount: 1
    - sql: INSERT INTO d VALUES ($1, $2, $3)
      params: [4, 2, null]
      rowcount: 1
    - sql: INSERT INTO d VALUES ($1, $2, $3)
      params: [5, 2, 4.0]
      rowcount: 1
    - sql: INSERT INTO d VALUES ($1, $2, $3)
      params: [6, null, 4.0]
      rowcount: 1
    - sql: SELECT SUM(f), AVG(f), MIN(f), MAX(f) FROM d WHERE id >= $1
      params: [0]
      expected: [[13.5, 2.7, 1.5, 4]]
    - sql: SELECT SUM(ALL f), AVG(ALL f), MIN(ALL f), MAX(ALL f) FROM d WHERE id >= $1
      params: [0]
      expected: [[13.5, 2.7, 1.5, 4]]
    - sql: SELECT SUM(DISTINCT f), AVG(DISTINCT f), MIN(DISTINCT f), MAX(DISTINCT f), COUNT(DISTINCT f) FROM d WHERE id >= $1
      params: [0]
      expected: [[8, 2.6666666666666665, 1.5, 4, 3]]
    - sql: SELECT SUM(f), SUM(DISTINCT f), COUNT(f), COUNT(DISTINCT f) FROM d WHERE id >= $1
      params: [0]
      expected: [[13.5, 8, 5, 3]]
  teardown:
    - DROP TABLE d

