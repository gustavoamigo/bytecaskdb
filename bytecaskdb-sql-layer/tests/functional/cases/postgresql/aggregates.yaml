- name: SUM, AVG, MIN and MAX of a DOUBLE column per group
  features: [E091-01, E091-03, E091-04, E091-05, E091-06]
  setup:
    - CREATE TABLE d (id INTEGER PRIMARY KEY, k INTEGER, f DOUBLE PRECISION)
  steps:
    - sql: INSERT INTO d VALUES ($1, $2, $3)
      params: [1, 1, 1.5]
      rowcount: 1
    - sql: INSERT INTO d VALUES ($1, $2, $3)
      params: [2, 1, 1.5]
      rowcount: 1
    - sql: INSERT INTO d VALUES ($1, $2, $3)
      params: [3, 1, 2.5]
      rowcount: 1
    - sql: INSERT INTO d VALUES ($1, $2, $3)
      params: [4, 2, null]
      rowcount: 1
    - sql: INSERT INTO d VALUES ($1, $2, $3)
      params: [5, 2, 4.0]
      rowcount: 1
    - sql: INSERT INTO d VALUES ($1, $2, $3)
      params: [6, null, 4.0]
      rowcount: 1
    - sql: SELECT k, SUM(f), AVG(f), MIN(f), MAX(f) FROM d WHERE id >= $1 GROUP BY k ORDER BY k
