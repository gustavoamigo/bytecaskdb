- name: MIN and MAX of a CHAR(n) column are printed padded to n
  features: [E091-03, E091-04]
  setup:
    - CREATE TABLE mc (id INTEGER PRIMARY KEY, g INTEGER, ch CHAR(4))
    - INSERT INTO mc VALUES (1, 1, 'b'), (2, 1, 'a '), (3, 2, NULL), (4, 2, 'ab')
  steps:
    - sql: SELECT max(ch), min(ch) FROM mc
      expected: [["b   ", "a   "]]
    - sql: SELECT g, max(ch) FROM mc GROUP BY g ORDER BY g
      expected: [[1, "b   "], [2, "ab  "]]
    - sql: SELECT max(ch) FROM mc WHERE id = $1
      params: [1]
      expected: [["b   "]]
    - sql: SELECT id FROM mc WHERE ch = (SELECT max(ch) FROM mc)
      expected: [[1]]
  teardown:
    - DROP TABLE mc

- name: HAVING on MIN or MAX of a CHAR(n) compares as the CHAR beside an untyped or varchar constant
  features: [E091-03, E091-04]
  setup:
    - CREATE TABLE mch (id INTEGER PRIMARY KEY, g INTEGER, c CHAR(4))
    - INSERT INTO mch VALUES (1, 1, 'a'), (2, 1, 'ab'), (3, 2, NULL), (4, 2, '  '), (5, 3, '')
  steps:
    - sql: SELECT g FROM mch GROUP BY g HAVING max(c) = ' ' ORDER BY g
      expected: [[2], [3]]
    - sql: SELECT g FROM mch GROUP BY g HAVING max(c) = 'ab '::varchar ORDER BY g
      expected: [[1]]
  teardown:
    - DROP TABLE mch

- name: HAVING on MIN or MAX of a CHAR(n) beside a text constant compares as text
  features: [E091-03, E091-04]
  # PostgreSQL casts the CHAR to text, so trailing spaces count; the layer
  # refuses it (0A000) rather than compare as the CHAR
  unimplemented: true
  setup:
    - CREATE TABLE mch (id INTEGER PRIMARY KEY, g INTEGER, c CHAR(4))
    - INSERT INTO mch VALUES (1, 1, 'a'), (2, 1, 'ab'), (3, 2, NULL), (4, 2, '  '), (5, 3, '')
  steps:
    - sql: SELECT g FROM mch GROUP BY g HAVING max(c) = ' '::text ORDER BY g
      expected: []
    - sql: SELECT g FROM mch GROUP BY g HAVING min(c) < 'a '::text ORDER BY g
      expected: [[1], [2], [3]]
    - sql: SELECT g FROM mch GROUP BY g HAVING max(c) = 'ab '::text ORDER BY g
      expected: []
    - sql: SELECT g FROM mch GROUP BY c, g HAVING c = ' '::text ORDER BY g
      expected: []
  teardown:
    - DROP TABLE mch

- name: MIN and MAX of a jsonb field's text
  features: [E091-03, E091-04]
  setup:
    - CREATE TABLE mj (id INTEGER PRIMARY KEY, g INTEGER, props JSONB)
    - "INSERT INTO mj VALUES (1, 1, '{\"k\": \"x\"}'), (2, 1, '{\"k\": \"é\"}'), (3, 2, '{}'), (4, 2, '{\"k\": \"Z\"}')"
  steps:
    - sql: SELECT max(props->>'k'), min(props->>'k') FROM mj
