# GROUP BY, HAVING and the aggregates, and the query forms around them that the
# layer refuses.

- name: GROUP BY sums each group, and NULL is a group
  features: [E051-02, E091-05]
  setup:
    - CREATE TABLE g (id INTEGER PRIMARY KEY, k INTEGER, v INTEGER)
  steps:
    - sql: INSERT INTO g VALUES ($1, $2, $3)
      params: [1, 1, 10]
      rowcount: 1
    - sql: INSERT INTO g VALUES ($1, $2, $3)
      params: [2, 1, 20]
      rowcount: 1
    - sql: INSERT INTO g VALUES ($1, $2, $3)
      params: [3, 2, 30]
      rowcount: 1
    - sql: INSERT INTO g VALUES ($1, $2, $3)
      params: [4, 2, null]
      rowcount: 1
    - sql: INSERT INTO g VALUES ($1, $2, $3)
      params: [5, null, 50]
      rowcount: 1
    - sql: SELECT k, SUM(v) FROM g WHERE id >= $1 GROUP BY k
      params: [0]
      expected: [[null, 50], [1, 30], [2, 30]]
  teardown:
    - DROP TABLE g

