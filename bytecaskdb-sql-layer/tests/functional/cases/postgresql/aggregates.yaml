- name: a DOUBLE aggregate over an indexed table, streamed by the index or held
  features: [E091-03, E091-05, E091-07]
  setup:
    - CREATE TABLE d (id INTEGER PRIMARY KEY, k INTEGER, f DOUBLE PRECISION)
    - CREATE INDEX d_kf ON d (k, f)
  steps:
    - sql: INSERT INTO d VALUES ($1, $2, $3)
      params: [1, 1, 1.5]
      rowcount: 1
    - sql: INSERT INTO d VALUES ($1, $2, $3)
      params: [2, 1, 1.5]
      rowcount: 1
    - sql: INSERT INTO d VALUES ($1, $2, $3)
      params: [3, 1, 2.5]
      rowcount: 1
    - sql: INSERT INTO d VALUES ($1, $2, $3)
      params: [4, 2, null]
      rowcount: 1
    - sql: INSERT INTO d VALUES ($1, $2, $3)
      params: [5, 2, 4.0]
      rowcount: 1
    - sql: INSERT INTO d VALUES ($1, $2, $3)
      params: [6, null, 4.0]
      rowcount: 1
    - sql: SELECT k, SUM(f), MIN(f), MAX(f), AVG(f) FROM d WHERE k >= $1 GROUP BY k ORDER BY k
      params: [0]
      expected: [[1, 5.5, 1.5, 2.5, 1.8333333333333333], [2, 4, 4, 4, 4]]
    - sql: SELECT SUM(f), MIN(f), MAX(f) FROM d WHERE k = $1
      params: [1]
      expected: [[5.5, 1.5, 2.5]]
    - sql: SELECT SUM(DISTINCT f), MAX(f) FROM d WHERE k >= $1
      params: [1]
      expected: [[8, 4]]
    - sql: SELECT k, SUM(DISTINCT f) FROM d WHERE k >= $1 GROUP BY k ORDER BY k
      params: [1]
      expected: [[1, 4], [2, 4]]
  teardown:
    - DROP TABLE d
