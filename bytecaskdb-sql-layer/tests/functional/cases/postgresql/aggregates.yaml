    - CREATE TABLE gw (id INTEGER PRIMARY KEY, c INTEGER)
    - INSERT INTO gu VALUES (1, 1, 'x'), (2, 1, 'y'), (3, 2, 'x')
    - INSERT INTO gw VALUES (1, 1), (2, 9), (4, 2)
  steps:
    - sql: SELECT count(*) FROM gu GROUP BY count
      error: "42803"
    - sql: SELECT max(a) FROM gu GROUP BY max
      error: "42803"
    - sql: SELECT gu.id AS z, id AS z, count(*) FROM gu JOIN gw USING (id) GROUP BY z ORDER BY 1
      expected: [[1, 1, 1], [2, 2, 1]]
    - sql: SELECT gw.id AS z, id AS z FROM gu JOIN gw USING (id) GROUP BY z
      error: "42702"
    - sql: SELECT gw.id AS z, id AS z FROM gu LEFT JOIN gw USING (id) GROUP BY z
      error: "42702"
    - sql: SELECT gu.id AS z, id AS z FROM gu RIGHT JOIN gw USING (id) ORDER BY z
      error: "42702"
    - sql: SELECT gw.id AS z, id AS z FROM gu RIGHT JOIN gw USING (id) ORDER BY z
      expected: [[1, 1], [2, 2], [4, 4]]
    - sql: SELECT id FROM gw WHERE c IN (SELECT a AS c FROM gu GROUP BY c) ORDER BY 1
