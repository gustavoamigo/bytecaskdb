- name: SUM and AVG of DISTINCT integers, beside COUNT(DISTINCT) of the same column
  features: [E091-05, E091-07]
  setup:
    - CREATE TABLE g (id INTEGER PRIMARY KEY, k INTEGER, v INTEGER)
  steps:
    - sql: INSERT INTO g VALUES ($1, $2, $3)
      params: [1, 1, 10]
      rowcount: 1
    - sql: INSERT INTO g VALUES ($1, $2, $3)
      params: [2, 1, 10]
      rowcount: 1
    - sql: INSERT INTO g VALUES ($1, $2, $3)
      params: [3, 2, 20]
      rowcount: 1
    - sql: INSERT INTO g VALUES ($1, $2, $3)
      params: [4, 2, null]
      rowcount: 1
    - sql: INSERT INTO g VALUES ($1, $2, $3)
      params: [5, 2, 20]
      rowcount: 1
    - sql: SELECT SUM(DISTINCT v), COUNT(DISTINCT v), MIN(DISTINCT v), MAX(DISTINCT v), SUM(v) FROM g WHERE id >= $1
      params: [0]
      expected: [[30, 2, 10, 20, 60]]
    - sql: SELECT k, SUM(DISTINCT v), COUNT(DISTINCT v), SUM(v) FROM g WHERE id >= $1 GROUP BY k ORDER BY k
      params: [0]
      expected: [[1, 10, 1, 20], [2, 20, 1, 40]]
