- name: MIN and MAX of text, varchar and name compare bytewise and are text
  features: [E091-03, E091-04]
  setup:
    - CREATE TABLE mt (id INTEGER PRIMARY KEY, g INTEGER, t TEXT, v VARCHAR(10), n NAME)
    - INSERT INTO mt VALUES (1, 1, 'a', 'a', 'a'), (2, 1, 'B', 'é', 'z'), (3, 2, NULL, NULL, NULL), (4, 2, 'z', 'Z', 'Z')
  steps:
    - sql: SELECT max(t), min(t), max(v), min(v), max(n), min(n) FROM mt
      expected: [[z, B, é, Z, z, Z]]
    - sql: SELECT g, max(t), min(v), count(*) FROM mt GROUP BY g ORDER BY g
      expected: [[1, a, a, 2], [2, z, Z, 2]]
    - sql: SELECT max(DISTINCT t), min(ALL n) FROM mt WHERE id >= $1
      params: [2]
      expected: [[z, Z]]
    - sql: SELECT g FROM mt GROUP BY g HAVING max(t) > $1 ORDER BY g
      params: [b]
      expected: [[2]]
    - sql: SELECT g FROM mt GROUP BY g HAVING min(v) = 'Z'
      expected: [[2]]
  teardown:
    - DROP TABLE mt

- name: MIN and MAX of text over no rows, or only NULLs, are NULL
  features: [E091-03, E091-04]
  setup:
    - CREATE TABLE mt (id INTEGER PRIMARY KEY, g INTEGER, t TEXT)
    - INSERT INTO mt VALUES (1, 1, NULL), (2, 1, NULL)
  steps:
    - sql: SELECT max(t), min(t), count(*) FROM mt
      expected: [[null, null, 2]]
    - sql: SELECT max(t), min(t), count(*) FROM mt WHERE id > $1
      params: [5]
      expected: [[null, null, 0]]
    - sql: SELECT g, max(t) FROM mt GROUP BY g
      expected: [[1, null]]
    - sql: SELECT g, max(t) FROM mt WHERE id > $1 GROUP BY g
      params: [5]
      expected: []
