- name: multiplication and division of constants, the integer quotient truncated
  features: [E011-04]
  steps:
    - sql: SELECT 6 * 7, 7 / 2, -7 / 2, 2 + 3 * 4, 8 / 2 / 2, 1.5 * 1.5
      expected: [[42, 3, -3, 14, 2, "2.25"]]
    - sql: SELECT 2147483647 * 2
      error: "22003"
    - sql: SELECT NULL * 2, NULL / 0
      expected: [[null, null]]
    - sql: SELECT 1 / 0
      error: "22012"
    - sql: SELECT 1.5 / 0
      error: "22012"

