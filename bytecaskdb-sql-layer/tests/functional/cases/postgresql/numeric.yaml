- name: "%, unary minus and abs keep their operand's type and range"
  features: [E011-04]
  setup:
    - CREATE TABLE sg (id INTEGER PRIMARY KEY, s SMALLINT, i INTEGER, b BIGINT, f DOUBLE PRECISION, d DECIMAL(6,2))
    - INSERT INTO sg VALUES (1, -32768, -2147483648, -9223372036854775807, -1.5, -7.25)
    - INSERT INTO sg VALUES (2, 7, 7, 7, '-0', 2.10)
    - INSERT INTO sg VALUES (3, NULL, NULL, NULL, NULL, NULL)
  steps:
    # % truncates toward zero, of the dividend's sign; a numeric at the finer scale.
    - sql: SELECT id, i % 3, s % 2, b % -1, d % 2.1, i % b FROM sg
      expected:
        - [1, -2, 0, 0, "-0.95", -2147483648]
        - [2, 1, 1, 0, "0.00", 0]
        - [3, null, null, null, null, null]
    - sql: SELECT id, -s, -i, -b, -d, -f, abs(s), abs(i), abs(d), abs(f) FROM sg WHERE id <> 1
      expected:
    # The negation of a type's least value is outside it.
        - [2, -7, -7, -7, "-2.10", 0, 7, 7, "2.10", 0]
        - [3, null, null, null, null, null, null, null, null, null]
    - sql: SELECT -s FROM sg WHERE id = 1
      error: "22003"
    - sql: SELECT abs(i) FROM sg WHERE id = 1
      error: "22003"
    - sql: SELECT i % 0 FROM sg WHERE id = 2
      error: "22012"
    - sql: SELECT d % 0 FROM sg WHERE id = 2
      error: "22012"
    - sql: SELECT f % 2 FROM sg
      error: "42883"
    - sql: SELECT abs(b), -b FROM sg WHERE id = 1
      expected: [["9223372036854775807", "9223372036854775807"]]
    - sql: SELECT 7 % 3, -7 % 3, 7.5 % 2, -7.25 % 2.1, '7' % 2, abs(-2.50), abs('-1.5'), -(-5)
      expected: [[1, -1, "1.5", "-0.95", 1, "2.50", "1.5", 5]]
    - sql: SELECT -((-32768)::smallint)
      error: "22003"
    - sql: SELECT abs(true)
      error: "42883"
  teardown:
    - DROP TABLE sg

- name: a NUMERIC column without a precision keeps every digit and the scale
  features: [E011-03]
  setup:
    - CREATE TABLE nn (id INTEGER PRIMARY KEY, v NUMERIC, w DECIMAL DEFAULT 1.50, x DEC)
  steps:
    - sql: INSERT INTO nn VALUES (1, 123456789012345678901234567890.10, '  2e3 ', -0.00)
      rowcount: 1
    - sql: INSERT INTO nn (id, v) VALUES ($1, $2)
      params: [2, "1.50e1"]
      rowcount: 1
    - sql: INSERT INTO nn (id, v, x) SELECT 3, v, w FROM nn WHERE id = 1
      rowcount: 1
    - sql: UPDATE nn SET x = 'NaN' WHERE id = 2 RETURNING x
      expected: [["NaN"]]
    - sql: SELECT id, v, w, x FROM nn WHERE v IS NOT NULL ORDER BY id
      expected:
        - [1, "123456789012345678901234567890.10", "2000", "0.00"]
        - [2, "15.0", "1.50", "NaN"]
        - [3, "123456789012345678901234567890.10", "1.50", "2000"]
    - sql: INSERT INTO nn (id, v) VALUES (4, 'abc')
      error: "22P02"
    - sql: INSERT INTO nn (id, v) VALUES (4, '1e200000')
      error: "22003"
  teardown:
    - DROP TABLE nn

- name: a NUMERIC column without a precision compared and ordered
  features: [E011-03]
  # stored as its text, a NUMERIC is not compared, ordered or computed yet (0A000)
  unimplemented: true
  setup:
    - CREATE TABLE nc (id INTEGER PRIMARY KEY, v NUMERIC)
  steps:
    - sql: INSERT INTO nc VALUES (1, 1.50), (2, 1.5), (3, 10)
      rowcount: 3
    - sql: SELECT id FROM nc WHERE v = 1.5 ORDER BY id
      expected: [[1], [2]]
    - sql: SELECT v + 1 FROM nc ORDER BY v DESC
      expected: [["11"], ["2.50"], ["2.5"]]
  teardown:
    - DROP TABLE nc
