- name: DECIMAL plus DECIMAL of the same scale
  features: [E011-04, E011-03]
  ordered: true
  setup:
    - CREATE TABLE n (id INTEGER PRIMARY KEY, i INTEGER, f DOUBLE PRECISION, d DECIMAL(6,2))
  steps:
    - sql: INSERT INTO n VALUES ($1, $2, $3, $4)
      params: [1, 1, 1.5, "2.50"]
      rowcount: 1
    - sql: INSERT INTO n VALUES ($1, $2, $3, $4)
      params: [2, 2, 2.5, "2.50"]
      rowcount: 1
    - sql: INSERT INTO n VALUES ($1, $2, $3, $4)
      params: [3, 3, 0.5, "10.00"]
      rowcount: 1
    - sql: SELECT id, d + d FROM n WHERE id >= $1 ORDER BY id
      params: [0]
      expected: [[1, "5.00"], [2, "5.00"], [3, "20.00"]]
  teardown:
    - DROP TABLE n

