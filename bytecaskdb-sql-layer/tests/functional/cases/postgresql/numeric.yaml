# Numeric comparison and arithmetic across the numeric types.

- name: an integer column compared with a DECIMAL parameter
  features: [E011-05, E011-06]
  setup:
    - CREATE TABLE n (id INTEGER PRIMARY KEY, i INTEGER, f DOUBLE PRECISION, d DECIMAL(6,2))
  steps:
    - sql: INSERT INTO n VALUES ($1, $2, $3, $4)
      params: [1, 1, 1.5, "2.50"]
      rowcount: 1
    - sql: INSERT INTO n VALUES ($1, $2, $3, $4)
      params: [2, 2, 2.5, "2.50"]
      rowcount: 1
    - sql: INSERT INTO n VALUES ($1, $2, $3, $4)
      params: [3, 3, 0.5, "10.00"]
      rowcount: 1
    - sql: SELECT id FROM n WHERE i < $1 AND id >= $2
      params: ["2.5", 0]
      error: "22P02"
  teardown:
    - DROP TABLE n

- name: a DECIMAL column compared with an integer parameter
  features: [E011-05, E011-06]
  setup:
    - CREATE TABLE n (id INTEGER PRIMARY KEY, i INTEGER, f DOUBLE PRECISION, d DECIMAL(6,2))
  steps:
    - sql: INSERT INTO n VALUES ($1, $2, $3, $4)
      params: [1, 1, 1.5, "2.50"]
      rowcount: 1
    - sql: INSERT INTO n VALUES ($1, $2, $3, $4)
      params: [2, 2, 2.5, "2.50"]
      rowcount: 1
    - sql: INSERT INTO n VALUES ($1, $2, $3, $4)
      params: [3, 3, 0.5, "10.00"]
      rowcount: 1
    - sql: SELECT id FROM n WHERE d > $1 AND id >= $2
      params: [3, 0]
      expected: [[3]]
  teardown:
    - DROP TABLE n

