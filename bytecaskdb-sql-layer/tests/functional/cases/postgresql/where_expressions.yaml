# Expressions in WHERE and ON (docs/frontend_design.md, *Expressions in WHERE,
# ON and HAVING (stage P)*): any value expression the select list takes, as an
# operand of a comparison, IS NULL, LIKE, IN and BETWEEN, or a BOOLEAN standing
# alone, evaluated on each row the plan reads, in written order (stage P1a).

- name: a comparison of expressions keeps the rows it is true for
  features: [E061-01, E021-07, E021-08, F261-02, F261-04]
  setup:
    - CREATE TABLE wt (id INTEGER PRIMARY KEY, a INTEGER, b INTEGER, s TEXT)
    - INSERT INTO wt VALUES (1, 0, 1, 'Alice'), (2, 1, NULL, 'bob'), (3, 2, 3, NULL), (4, NULL, 4, 'ALICE'), (5, -1, 0, 'Y')
  steps:
    - sql: SELECT id FROM wt WHERE a + 1 > 1 ORDER BY id
      expected: [[2], [3]]
    - sql: SELECT id FROM wt WHERE a * 2 < b + 1 ORDER BY id
      expected: [[1], [5]]
    - sql: SELECT id FROM wt WHERE abs(a) = 1 ORDER BY id
      expected: [[2], [5]]
    - sql: SELECT id FROM wt WHERE lower(s) = 'alice' ORDER BY id
      expected: [[1], [4]]
    - sql: SELECT id FROM wt WHERE s || 'x' = 'Alicex'
      expected: [[1]]
    - sql: SELECT id FROM wt WHERE coalesce(a, 0) = 0 ORDER BY id
      expected: [[1], [4]]
    - sql: SELECT id FROM wt WHERE CASE WHEN a > 0 THEN a ELSE b END = 1 ORDER BY id
      expected: [[1], [2]]
    - sql: SELECT id FROM wt WHERE a + 1 > 1.5 ORDER BY id
      expected: [[2], [3]]
    - sql: SELECT id FROM wt WHERE upper(s) <> 'ALICE' ORDER BY id
      expected: [[2], [5]]
    - sql: SELECT id FROM wt WHERE a + 0 = b - 1 ORDER BY id
      expected: [[1], [3], [5]]
  teardown:
    - DROP TABLE wt

- name: a key and an expression on one column, the key's rows filtered
  features: [E061-01]
  setup:
    - CREATE TABLE wk (id INTEGER PRIMARY KEY, a INTEGER)
    - INSERT INTO wk VALUES (1, 10), (2, 20), (3, 30)
  steps:
    - sql: SELECT id FROM wk WHERE id = 2 AND id * 2 = 4
      expected: [[2]]
    - sql: SELECT id FROM wk WHERE id > 1 AND a + 1 > 25 ORDER BY id
      expected: [[3]]
    - sql: SELECT id FROM wk WHERE id + 0 = 3
      expected: [[3]]
    - sql: SELECT id FROM wk WHERE -id = -1
      expected: [[1]]
    - sql: SELECT id FROM wk WHERE a + 1 > 0 ORDER BY id LIMIT 2
      expected: [[1], [2]]
  teardown:
    - DROP TABLE wk

- name: IS NULL, LIKE, IN and BETWEEN of an expression
  features: [E061-02, E061-03, E061-04, E061-05, E061-06]
  setup:
    - CREATE TABLE wt (id INTEGER PRIMARY KEY, a INTEGER, b INTEGER, s TEXT)
    - INSERT INTO wt VALUES (1, 0, 1, 'Alice'), (2, 1, NULL, 'bob'), (3, 2, 3, NULL), (4, NULL, 4, 'ALICE'), (5, -1, 0, 'a_b')
  steps:
    - sql: SELECT id FROM wt WHERE a + 1 IS NULL
      expected: [[4]]
    - sql: SELECT id FROM wt WHERE a + b IS NOT NULL ORDER BY id
      expected: [[1], [3], [5]]
    - sql: SELECT id FROM wt WHERE lower(s) LIKE 'a%' ORDER BY id
      expected: [[1], [4], [5]]
    - sql: SELECT id FROM wt WHERE lower(s) NOT LIKE 'a%' ORDER BY id
      expected: [[2]]
    - sql: SELECT id FROM wt WHERE upper(s) ILIKE 'b%'
      expected: [[2]]
    - sql: SELECT id FROM wt WHERE lower(s) LIKE 'a!_%' ESCAPE '!'
      expected: [[5]]
    - sql: SELECT id FROM wt WHERE s LIKE lower(s) ORDER BY id
      expected: [[2], [5]]
    - sql: SELECT id FROM wt WHERE lower(s) LIKE lower($1) ORDER BY id
      params: ["%LI%"]
      expected: [[1], [4]]
    - sql: SELECT id FROM wt WHERE a + 0 IN (1, 5) ORDER BY id
      expected: [[2]]
    - sql: SELECT id FROM wt WHERE a + 0 NOT IN (1, 5) ORDER BY id
      expected: [[1], [3], [5]]
    - sql: SELECT id FROM wt WHERE a + 1 IN (b, 3) ORDER BY id
      expected: [[1], [3], [5]]
    - sql: SELECT id FROM wt WHERE a + 1 BETWEEN 1 AND 2 ORDER BY id
      expected: [[1], [2]]
    - sql: SELECT id FROM wt WHERE a * 2 NOT BETWEEN 0 AND 2 ORDER BY id
      expected: [[3], [5]]
    - sql: SELECT id FROM wt WHERE a + 1 BETWEEN SYMMETRIC 3 AND 1 ORDER BY id
      expected: [[1], [2], [3]]
  teardown:
    - DROP TABLE wt

- name: an expression of a NULL is NULL, and a filter keeps only what is true
  features: [E061-01, E061-06]
  setup:
    - CREATE TABLE wt (id INTEGER PRIMARY KEY, a INTEGER, b INTEGER)
    - INSERT INTO wt VALUES (1, 0, 1), (2, 1, NULL), (3, 2, 3), (4, NULL, 4), (5, -1, 0)
  steps:
    - sql: SELECT id FROM wt WHERE a + NULL = 1
      expected: []
    - sql: SELECT id FROM wt WHERE a + b = a + b ORDER BY id
      expected: [[1], [3], [5]]
    - sql: SELECT id FROM wt WHERE (a + b > 2) IS NULL ORDER BY id
      expected: [[2], [4]]
    - sql: SELECT id FROM wt WHERE NOT (a + b > 2) ORDER BY id
      expected: [[1], [5]]
    - sql: SELECT id FROM wt WHERE NOT (b > 2 AND a = 1) ORDER BY id
      expected: [[1], [3], [5]]
    - sql: SELECT id FROM wt WHERE 1 / NULL::int = 1
      expected: []
    - sql: SELECT id FROM wt WHERE a + 1 = 1 OR b * 2 = 8 ORDER BY id
      expected: [[1], [4]]
  teardown:
    - DROP TABLE wt

- name: a parameter beside an expression takes its type
  features: [E061-01, E061-03]
  setup:
    - CREATE TABLE wt (id INTEGER PRIMARY KEY, a INTEGER, s TEXT, c BIGINT)
    - INSERT INTO wt VALUES (1, 0, 'Alice', 1700000000000), (2, 1, 'bob', 5), (3, 2, NULL, NULL)
  steps:
    - sql: SELECT id FROM wt WHERE lower(s) = $1
      params: ["alice"]
      expected: [[1]]
    - sql: SELECT id FROM wt WHERE a + 1 = $1
      params: [2]
      expected: [[2]]
    - sql: SELECT id FROM wt WHERE a + 1 = $1
      params: ["1.5"]
      error: "22P02"
    - sql: SELECT id FROM wt WHERE a + $1 = 2
      params: [1]
      expected: [[2]]
    - sql: SELECT id FROM wt WHERE s || $1 = 'bobx'
      params: ["x"]
      expected: [[2]]
    - sql: SELECT id FROM wt WHERE a + 1 IN ($1, $2) ORDER BY id
      params: [1, 3]
      expected: [[1], [3]]
    - sql: SELECT id FROM wt WHERE a + 1 BETWEEN $1 AND $2 ORDER BY id
      params: [2, 3]
      expected: [[2], [3]]
    - sql: SELECT id FROM wt WHERE c > $1 - 100
      params: [1000]
      expected: [[1]]
    - sql: SELECT id FROM wt WHERE c > $1::bigint - 100
      params: [1700000000000]
      expected: [[1]]
    - sql: SELECT id FROM wt WHERE a = $1 - 1 OR a = 2 ORDER BY id
      params: [1]
      expected: [[1], [3]]
    - sql: SELECT id FROM wt WHERE $1 = $2 ORDER BY id
      params: ["a", "a"]
      expected: [[1], [2], [3]]
    - sql: SELECT id FROM wt WHERE $1 = $2
      params: ["a", "b"]
      expected: []
    - sql: SELECT id FROM wt WHERE 1 = $1 ORDER BY id
      params: [1]
      expected: [[1], [2], [3]]
    - sql: SELECT id FROM wt WHERE $1 + $2 = a
      params: [1, 2]
      error: "42725"
    - sql: SELECT id FROM wt WHERE $1 IS NULL
      params: [1]
      error: "42P18"
  teardown:
    - DROP TABLE wt

- name: a cast parameter beside a column of another type is compared as the select list compares it
  features: [E061-01, F201]
  setup:
    - CREATE TABLE wd (id INTEGER PRIMARY KEY, d DECIMAL(10, 2))
    - CREATE INDEX wd_d ON wd (d)
    - INSERT INTO wd VALUES (1, 5.00), (2, 0.05), (3, NULL), (4, 500.00)
  steps:
    - sql: SELECT id FROM wd WHERE d > $1::int ORDER BY id
      params: [5]
      expected: [[4]]
    - sql: SELECT id FROM wd WHERE d = $1::int
      params: [500]
      expected: [[4]]
    - sql: SELECT id FROM wd WHERE d * 2 > 0.1 ORDER BY id
      expected: [[1], [4]]
  teardown:
    - DROP TABLE wd

- name: a BOOLEAN expression standing alone is a conjunct
  features: [E061-14, F261-02]
  setup:
    - CREATE TABLE wb (id INTEGER PRIMARY KEY, f BOOLEAN, a INTEGER)
    - INSERT INTO wb VALUES (1, true, 1), (2, false, 2), (3, NULL, 3), (4, true, 4)
  steps:
    - sql: SELECT id FROM wb WHERE f ORDER BY id
      expected: [[1], [4]]
    - sql: SELECT id FROM wb WHERE NOT f ORDER BY id
      expected: [[2]]
    - sql: SELECT id FROM wb WHERE f AND a > 1 ORDER BY id
      expected: [[4]]
    - sql: SELECT id FROM wb WHERE f OR a = 3 ORDER BY id
      expected: [[1], [3], [4]]
    - sql: SELECT id FROM wb WHERE (a > 1) = f ORDER BY id
      expected: [[4]]
    - sql: SELECT id FROM wb WHERE CASE WHEN a > 2 THEN f ELSE NOT f END ORDER BY id
      expected: [[2], [4]]
    - sql: SELECT id FROM wb WHERE coalesce(f, true) ORDER BY id
      expected: [[1], [3], [4]]
    - sql: SELECT id FROM wb WHERE 'true' ORDER BY id
      expected: [[1], [2], [3], [4]]
    - sql: SELECT id FROM wb WHERE (SELECT true) ORDER BY id
      expected: [[1], [2], [3], [4]]
    - sql: SELECT id FROM wb WHERE $1 ORDER BY id
      params: [true]
      expected: [[1], [2], [3], [4]]
    - sql: SELECT id FROM wb WHERE NOT $1
      params: [true]
      expected: []
    - sql: SELECT id FROM wb WHERE 'abc'
      error: "22P02"
  teardown:
    - DROP TABLE wb

- name: inside AND, OR and CASE an operand is evaluated only while the result is unsettled
  features: [E061-01, F261-02]
  setup:
    - CREATE TABLE wt (id INTEGER PRIMARY KEY, a INTEGER, b INTEGER)
    - INSERT INTO wt VALUES (1, 0, 1), (2, 1, NULL), (3, 2, 3), (4, NULL, 4), (5, -1, 0)
  steps:
    - sql: SELECT id FROM wt WHERE a = 0 OR 1 / a > 0 ORDER BY id
      expected: [[1], [2]]
    - sql: SELECT id FROM wt WHERE 1 / a > 0 OR a = 0
      error: "22012"
    - sql: SELECT id FROM wt WHERE CASE WHEN a <> 0 THEN 1 / a > 0 ELSE false END ORDER BY id
      expected: [[2]]
    - sql: SELECT id FROM wt WHERE a <> 0 AND 1 / a > 0 ORDER BY id
      expected: [[2]]
    - sql: SELECT id FROM wt WHERE a = 1 OR (a + 1 > 0 AND b = 3) ORDER BY id
      expected: [[2], [3]]
    - sql: SELECT id FROM wt WHERE a * 2147483647 > 0
      error: "22003"
    - sql: SELECT count(a) FROM wt WHERE id = 99 AND 10 / a > 0
      expected: [[0]]
    - sql: SELECT count(a) FROM wt WHERE id = 1 AND 10 / a > 0
      error: "22012"
    - sql: SELECT count(*) FROM wt WHERE id = 2 AND 10 / a > 0
      expected: [[1]]
  teardown:
    - DROP TABLE wt

- name: a constant in a filter is folded before any row is read
  features: [E061-01, F261-02, F261-04]
  setup:
    - CREATE TABLE we (id INTEGER PRIMARY KEY, a INTEGER)
  steps:
    - sql: SELECT id FROM we WHERE a <> 0 AND 1 / 0 > 0
      error: "22012"
    - sql: SELECT id FROM we WHERE CASE WHEN a > 0 THEN 1 / 0 > 0 ELSE true END
      error: "22012"
    - sql: SELECT id FROM we WHERE coalesce(a, 1 / 0) > 0
      error: "22012"
    - sql: SELECT id FROM we WHERE 1 = 1
      expected: []
  teardown:
    - DROP TABLE we

- name: a strict operator with a NULL constant operand is NULL, its other operand never evaluated
  features: [E061-01, E061-06]
  setup:
    - CREATE TABLE wn (id INTEGER PRIMARY KEY, a INTEGER)
    - INSERT INTO wn VALUES (1, 0), (2, 1), (3, 2)
  steps:
    - sql: SELECT id FROM wn WHERE 10 / a > NULL
      expected: []
    - sql: SELECT id FROM wn WHERE 10 / a > NULL OR a = 0
      expected: [[1]]
    - sql: SELECT id FROM wn WHERE (10 / a + NULL) IS NULL ORDER BY id
      expected: [[1], [2], [3]]
    - sql: SELECT id FROM wn WHERE (10 / a || NULL) IS NULL ORDER BY id
      expected: [[1], [2], [3]]
    - sql: SELECT 10 / a > NULL FROM wn WHERE id = 1
      expected: [[null]]
  teardown:
    - DROP TABLE wn

- name: a strict operator with a NULL parameter operand
  features: [E061-01]
  # PostgreSQL 17's custom plan folds a NULL $1 as it folds a NULL constant;
  # the layer binds no parameter's value and evaluates 10 / a: a difference of stage P
  unimplemented: true
  setup:
    - CREATE TABLE wn (id INTEGER PRIMARY KEY, a INTEGER)
    - INSERT INTO wn VALUES (1, 0), (2, 1), (3, 2)
  steps:
    - sql: SELECT id FROM wn WHERE 10 / a > $1 OR a = 0
      params: [null]
      expected: [[1]]
  teardown:
    - DROP TABLE wn

- name: a CHAR(n) column compared with a TEXT expression compares as text
  features: [E021-01, E021-07]
  setup:
    - CREATE TABLE wc (id INTEGER PRIMARY KEY, ch CHAR(3))
    - INSERT INTO wc VALUES (1, 'ab'), (3, 'xy')
  steps:
    - sql: SELECT id FROM wc WHERE ch = 'ab ' || ''
      expected: []
    - sql: SELECT id FROM wc WHERE ch = lower('AB ')
      expected: []
    - sql: SELECT id FROM wc WHERE NOT (ch = 'ab ' || '') ORDER BY id
      expected: [[1], [3]]
    - sql: SELECT id FROM wc WHERE ch = 'ab '
      expected: [[1]]
    - sql: SELECT id FROM wc WHERE ch = 'ab '::varchar
      expected: [[1]]
    - sql: SELECT id FROM wc WHERE ch > 'ab ' || '' ORDER BY id
      expected: [[3]]
  teardown:
    - DROP TABLE wc

- name: a conjunct testing a correlated subquery keeps its written place
  features: [E061-08, E061-01]
  setup:
    - CREATE TABLE wr (id INTEGER PRIMARY KEY, a INTEGER)
    - INSERT INTO wr VALUES (1, 0), (2, 1)
    - CREATE TABLE ws (id INTEGER PRIMARY KEY, x INTEGER)
    - INSERT INTO ws VALUES (1, 2), (2, 2)
  steps:
    - sql: SELECT id FROM wr WHERE EXISTS (SELECT 1 FROM ws WHERE ws.id = wr.id AND ws.x = wr.id) AND 10 / a > 0
      expected: [[2]]
  teardown:
    - DROP TABLE ws
    - DROP TABLE wr

- name: a CASE or COALESCE arm PostgreSQL drops without folding
  features: [F261-02, F261-04]
  # the layer folds every arm, and refuses one whose fold raises (42601): a difference of stage P
  unimplemented: true
  setup:
    - CREATE TABLE we (id INTEGER PRIMARY KEY, a INTEGER)
    - INSERT INTO we VALUES (1, 1)
  steps:
    - sql: SELECT id FROM we WHERE CASE WHEN false THEN 1 / 0 > 0 ELSE true END
      expected: [[1]]
    - sql: SELECT id FROM we WHERE coalesce(1, 1 / 0) > 0
      expected: [[1]]
  teardown:
    - DROP TABLE we

- name: a guard written after the expression it guards
  features: [E061-01]
  # top-level conjuncts are tried in written order, so 1 / a > 0 raises 22012
  # before a <> 0 rejects the row; PostgreSQL's cost order is stage P1b
  unimplemented: true
  setup:
    - CREATE TABLE wt (id INTEGER PRIMARY KEY, a INTEGER)
    - INSERT INTO wt VALUES (1, 0), (2, 1), (3, 2)
  steps:
    - sql: SELECT id FROM wt WHERE 1 / a > 0 AND a <> 0 ORDER BY id
      expected: [[2]]
  teardown:
    - DROP TABLE wt

- name: UPDATE and DELETE with an expression WHERE, an error leaving the table as it was
  features: [E101-03, E101-04]
  setup:
    - CREATE TABLE wt (id INTEGER PRIMARY KEY, a INTEGER, s TEXT)
    - INSERT INTO wt VALUES (1, 0, 'Alice'), (2, 1, 'bob'), (3, 2, NULL)
  steps:
    - sql: UPDATE wt SET a = a + 10 WHERE lower(s) = 'bob'
      rowcount: 1
    - sql: DELETE FROM wt WHERE a + 1 > 2 AND s IS NULL
      rowcount: 1
    - sql: SELECT id, a FROM wt ORDER BY id
      expected: [[1, 0], [2, 11]]
    - sql: DELETE FROM wt WHERE 10 / a > 0
      error: "22012"
    - sql: UPDATE wt SET a = 0 WHERE 10 / (a - 11) > 0
      error: "22012"
    - sql: SELECT id, a FROM wt ORDER BY id
      expected: [[1, 0], [2, 11]]
  teardown:
    - DROP TABLE wt

- name: an expression ON of an inner and an outer join
  features: [F041-01, F041-03, F401-02]
  setup:
    - CREATE TABLE wt (id INTEGER PRIMARY KEY, a INTEGER, b INTEGER)
    - INSERT INTO wt VALUES (1, 0, 1), (2, 1, NULL), (3, 2, 3), (4, NULL, 4), (5, -1, 0)
    - CREATE TABLE wu (x INTEGER PRIMARY KEY, y INTEGER)
    - INSERT INTO wu VALUES (1, 10), (2, 0), (3, 5), (5, 1)
  steps:
    - sql: SELECT wt.a, wu.x FROM wt JOIN wu ON wt.a + 1 = wu.x ORDER BY wt.id
      expected: [[0, 1], [1, 2], [2, 3]]
    - sql: SELECT wt.a, wu.x FROM wt LEFT JOIN wu ON wt.a + 1 = wu.x ORDER BY wt.id
      expected: [[null, null], [-1, null], [0, 1], [1, 2], [2, 3]]
    - sql: SELECT wt.a, wu.x FROM wt LEFT JOIN wu ON wt.a > 0 AND wu.x = wt.a ORDER BY wt.id
      expected: [[null, null], [-1, null], [0, null], [1, 1], [2, 2]]
    - sql: SELECT wt.id FROM wt LEFT JOIN wu ON wu.x = wt.b AND 10 / wu.y > 0 ORDER BY wt.id
      expected: [[1], [2], [3], [4], [5]]
    - sql: SELECT wt.id FROM wt LEFT JOIN wu ON wt.a = wu.x WHERE wu.y * 2 IS NULL ORDER BY wt.id
      expected: [[1], [4], [5]]
    - sql: SELECT wt.id FROM wt LEFT JOIN wu ON wt.a = wu.x WHERE 10 / wu.y > 0 OR wu.y IS NULL ORDER BY wt.id
      error: "22012"
    - sql: SELECT wt.a, wu.x FROM wt JOIN wu ON lower(wt.a || 'x') = wu.x || 'x' ORDER BY wt.id
      expected: [[1, 1], [2, 2]]
    - sql: SELECT wt.a, wu.x FROM wt FULL JOIN wu ON wt.a + 1 = wu.x AND wt.a > 0 ORDER BY 1, 2
      expected:
        - [null, null]
        - [null, 1]
        - [null, 5]
        - [-1, null]
        - [0, null]
        - [1, 2]
        - [2, 3]
    - sql: SELECT wt.a, wu.x FROM wt FULL JOIN wu ON wt.a + 1 = wu.x AND wt.a < wu.y ORDER BY 1, 2
      expected:
        - [null, null]
        - [null, 2]
        - [null, 5]
        - [-1, null]
        - [0, 1]
        - [1, null]
        - [2, 3]
    - sql: SELECT wt.a, wu.x FROM wt FULL JOIN wu ON wt.a + wu.x = 3
      error: "0A000"
    - sql: SELECT wt.id FROM wt JOIN wu ON wt.a = wu.x WHERE $1 = $2 ORDER BY wt.id
      params: ["a", "a"]
      expected: [[2], [3]]
  teardown:
    - DROP TABLE wt
    - DROP TABLE wu

- name: what a filter refuses, with PostgreSQL's SQLSTATE for its clause
  features: [E061-01]
  setup:
    - CREATE TABLE wt (id INTEGER PRIMARY KEY, a INTEGER, s TEXT)
    - CREATE TABLE wu (x INTEGER PRIMARY KEY, y INTEGER)
  steps:
    - sql: SELECT id FROM wt WHERE s + 1 > 0
      error: "42883"
    - sql: SELECT id FROM wt WHERE lower(a) = 'x'
      error: "42883"
    - sql: SELECT id FROM wt WHERE a + 1 LIKE 'x'
      error: "42883"
    - sql: SELECT id FROM wt WHERE s LIKE a
      error: "42883"
    - sql: SELECT id FROM wt WHERE a + 1 = '1.5'
      error: "22P02"
    - sql: SELECT id FROM wt WHERE a + 1
      error: "42804"
    - sql: SELECT id FROM wt WHERE a + 1 AND s IS NULL
      error: "42804"
    - sql: SELECT id FROM wt WHERE NOT a
      error: "42804"
    - sql: SELECT id FROM wt JOIN wu ON wt.a
      error: "42804"
    - sql: SELECT id FROM wt WHERE (SELECT 1)
      error: "42804"
    - sql: SELECT id FROM wt WHERE a + count(*) > 1
      error: "42803"
    - sql: SELECT id FROM wt JOIN wu ON wt.a + count(*) > 1
      error: "42803"
    - sql: UPDATE wt SET a = 1 WHERE count(*) > 1
      error: "42803"
  teardown:
    - DROP TABLE wt
    - DROP TABLE wu
