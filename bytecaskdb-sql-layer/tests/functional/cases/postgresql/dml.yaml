- name: ON CONFLICT DO UPDATE SET of any value expression over the row that holds the key
  features: [E101-03]
  setup:
    - CREATE TABLE sc (id INTEGER PRIMARY KEY, n INTEGER, t TEXT)
    - INSERT INTO sc VALUES (1, 5, 'x')
  steps:
    - sql: INSERT INTO sc VALUES (1, 0, 'y') ON CONFLICT (id) DO UPDATE SET n = sc.n * 2 + 1, t = upper(sc.t) || sc.n RETURNING n, t
      expected: [[11, X5]]
    - sql: INSERT INTO sc VALUES (2, 0, 'y') ON CONFLICT (id) DO UPDATE SET n = sc.n * 2 RETURNING n, t
      expected: [[0, y]]
    - sql: SELECT id, n, t FROM sc ORDER BY id
      expected: [[1, 11, X5], [2, 0, y]]
  teardown:
    - DROP TABLE sc

- name: UPDATE … SET of a constant, a column twice and a parameter typed two ways, as PostgreSQL
  features: [E101-03]
  setup:
    - CREATE TABLE sk (id INTEGER PRIMARY KEY, a SMALLINT, n INTEGER, d NUMERIC(5, 2), r REAL, nm NAME, t TEXT, dt DATE)
    - INSERT INTO sk VALUES (1, 1, 1, 1.00, 1, 'x', 'x', '2024-01-01')
  steps:
    - sql: UPDATE sk SET nm = true RETURNING nm
      expected: [[t]]
    - sql: UPDATE sk SET t = true RETURNING t
      expected: [["true"]]
    - sql: INSERT INTO sk (id, nm) SELECT 2, false RETURNING nm
      expected: [[f]]
    - sql: INSERT INTO sk (id, nm) VALUES (3, true) RETURNING nm
      expected: [[t]]
    - sql: UPDATE sk SET n = 2.5::float8, d = 2.5::float8, r = 2.5::float8, a = 3.5::real WHERE id = 1 RETURNING a, n, d, r
      expected: [[4, 2, "2.50", 2.5]]
    - sql: UPDATE sk SET dt = '2024-02-03 10:00'::timestamp WHERE id = 1 RETURNING dt
      expected: [["2024-02-03"]]
    - sql: UPDATE sk SET n = '1e30'::float8 WHERE false
      error: "22003"
    - sql: UPDATE sk SET n = 1, n = 2
      error: "42601"
    - sql: UPDATE sk SET n = 1/0, n = 2
      error: "42601"
    - sql: UPDATE sk SET a = $1, n = $1 + 1
      params: [5]
      error: "42P08"
    - sql: INSERT INTO sk (id, a, n) VALUES (9, $1, $1)
      params: [5]
      error: "42P08"
    - sql: SELECT id, a, n, d, r, nm, dt FROM sk ORDER BY id
      expected: [[1, 4, 2, "2.50", 2.5, t, "2024-02-03"], [2, null, null, null, null, f, null], [3, null, null, null, null, t, null]]
  teardown:
    - DROP TABLE sk
