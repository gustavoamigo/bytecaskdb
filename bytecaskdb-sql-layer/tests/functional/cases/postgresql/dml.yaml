# INSERT, UPDATE and DELETE: what each reports and leaves, and transactions
# around them.

- name: INSERT reports one row, and a column list fills the rest with NULL
  features: [E101-01]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER, w INTEGER)
  steps:
    - sql: INSERT INTO t (id, v) VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: SELECT id, v, w FROM t WHERE id = $1
      params: [1]
      expected: [[1, 10, null]]
  teardown:
    - DROP TABLE t

- name: an INSERT with the columns in another order
  features: [E101-01]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER, w INTEGER)
  steps:
    - sql: INSERT INTO t (w, id, v) VALUES ($1, $2, $3)
      params: [3, 1, 2]
      rowcount: 1
    - sql: SELECT id, v, w FROM t WHERE id = $1
      params: [1]
      expected: [[1, 2, 3]]
  teardown:
    - DROP TABLE t

- name: an UPDATE of several rows reports how many
  features: [E101-03]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, 20]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [3, 30]
      rowcount: 1
    - sql: UPDATE t SET v = v + $1 WHERE id >= $2
      params: [1, 2]
      rowcount: 2
    - sql: SELECT id, v FROM t WHERE id >= $1
      params: [0]
      expected: [[1, 10], [2, 21], [3, 31]]
  teardown:
    - DROP TABLE t

- name: an UPDATE that matches no row
  features: [E101-03]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, 20]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [3, 30]
      rowcount: 1
    - sql: UPDATE t SET v = $1 WHERE id = $2
      params: [0, 99]
      rowcount: 0
    - sql: SELECT id, v FROM t WHERE id >= $1
      params: [0]
      expected: [[1, 10], [2, 20], [3, 30]]
  teardown:
    - DROP TABLE t

- name: an UPDATE reads the old value of every column in its SET list
  features: [E101-03]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, a INTEGER, b INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2, $3)
      params: [1, 1, 2]
      rowcount: 1
    - sql: UPDATE t SET a = b, b = a WHERE id = $1
      params: [1]
      rowcount: 1
    - sql: SELECT a, b FROM t WHERE id = $1
      params: [1]
      expected: [[2, 1]]
  teardown:
    - DROP TABLE t

- name: an UPDATE to NULL
  features: [E101-03, E131]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, 20]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [3, 30]
      rowcount: 1
    - sql: UPDATE t SET v = $1 WHERE id = $2
      params: [null, 1]
      rowcount: 1
    - sql: SELECT id, v FROM t WHERE id >= $1
      params: [0]
      expected: [[1, null], [2, 20], [3, 30]]
  teardown:
    - DROP TABLE t

- name: a DELETE of several rows reports how many
  features: [E101-04]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, 20]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [3, 30]
      rowcount: 1
    - sql: DELETE FROM t WHERE id >= $1
      params: [2]
      rowcount: 2
    - sql: SELECT id, v FROM t WHERE id >= $1
      params: [0]
      expected: [[1, 10]]
  teardown:
    - DROP TABLE t

- name: a DELETE with no condition on a key
  features: [E101-04]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, 20]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [3, 30]
      rowcount: 1
    - sql: DELETE FROM t WHERE v > $1
      params: [10]
      rowcount: 2
    - sql: SELECT id FROM t WHERE id >= $1
      params: [0]
      expected: [[1]]
  teardown:
    - DROP TABLE t

- name: a row deleted can be inserted again
  features: [E101-01, E101-04]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: DELETE FROM t WHERE id = $1
      params: [1]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 11]
      rowcount: 1
    - sql: SELECT id, v FROM t WHERE id = $1
      params: [1]
      expected: [[1, 11]]
  teardown:
    - DROP TABLE t

- name: an INSERT of a duplicate key fails and changes nothing
  features: [E141-03]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 11]
      error: "23505"
    - sql: SELECT id, v FROM t WHERE id = $1
      params: [1]
      expected: [[1, 10]]
  teardown:
    - DROP TABLE t

- name: a composite primary key
  features: [E141-03]
  setup:
    - CREATE TABLE p (a INTEGER, b INTEGER, v INTEGER, PRIMARY KEY (a, b))
  steps:
    - sql: INSERT INTO p VALUES ($1, $2, $3)
      params: [1, 1, 1]
      rowcount: 1
    - sql: INSERT INTO p VALUES ($1, $2, $3)
      params: [1, 2, 2]
      rowcount: 1
    - sql: INSERT INTO p VALUES ($1, $2, $3)
      params: [1, 1, 3]
      error: "23505"
    - sql: SELECT a, b, v FROM p WHERE a = $1
      params: [1]
      expected: [[1, 1, 1], [1, 2, 2]]
  teardown:
    - DROP TABLE p

- name: an UPDATE of a primary key column
  features: [E101-03, E141-03]
  # updating a primary key column is not supported
  unimplemented: true
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, 20]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [3, 30]
      rowcount: 1
    - sql: UPDATE t SET id = $1 WHERE id = $2
      params: [10, 1]
      rowcount: 1
    - sql: UPDATE t SET id = $1 WHERE id = $2
      params: [2, 3]
      error: "23505"
    - sql: SELECT id, v FROM t WHERE id >= $1
      params: [0]
      expected: [[10, 10], [2, 20], [3, 30]]
  teardown:
    - DROP TABLE t

- name: a statement in a transaction sees the transaction's own writes
  features: [E151-01, E151-02]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: BEGIN
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: UPDATE t SET v = $1 WHERE id = $2
      params: [11, 1]
      rowcount: 1
    - sql: SELECT id, v FROM t WHERE id = $1
      params: [1]
      expected: [[1, 11]]
    - sql: COMMIT
    - sql: SELECT id, v FROM t WHERE id = $1
      params: [1]
      expected: [[1, 11]]
  teardown:
    - ROLLBACK
    - DROP TABLE t

- name: ROLLBACK undoes inserts, updates and deletes
  features: [E151-02]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, 20]
      rowcount: 1
    - sql: BEGIN
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [3, 30]
      rowcount: 1
    - sql: UPDATE t SET v = $1 WHERE id = $2
      params: [99, 1]
      rowcount: 1
    - sql: DELETE FROM t WHERE id = $1
      params: [2]
      rowcount: 1
    - sql: ROLLBACK
    - sql: SELECT id, v FROM t WHERE id >= $1
      params: [0]
      expected: [[1, 10], [2, 20]]
  teardown:
    - ROLLBACK
    - DROP TABLE t

- name: a failed statement aborts the transaction until ROLLBACK
  features: [E151-02]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: BEGIN
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 11]
      error: "23505"
    - sql: SELECT id FROM t WHERE id = $1
      params: [1]
      error: "25P02"
    - sql: ROLLBACK
    - sql: SELECT id, v FROM t WHERE id = $1
      params: [1]
      expected: [[1, 10]]
  teardown:
    - ROLLBACK
    - DROP TABLE t

- name: a multi-row VALUES
  features: [E101-01]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2), ($3, $4)
      params: [1, 10, 2, 20]
      rowcount: 2
    - sql: SELECT id, v FROM t WHERE id >= $1
      params: [0]
      expected: [[1, 10], [2, 20]]
  teardown:
    - DROP TABLE t

- name: an INSERT of a literal
  features: [E101-01]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES (1, 10)
      rowcount: 1
    - sql: SELECT id, v FROM t WHERE id >= $1
      params: [0]
      expected: [[1, 10]]
  teardown:
    - DROP TABLE t

- name: DEFAULT in an INSERT and an UPDATE takes the column's default, NULL without one
  features: [F221]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, a INTEGER DEFAULT 123, b INTEGER)
  steps:
    - sql: INSERT INTO t (id, a, b) VALUES (1, DEFAULT, DEFAULT)
      rowcount: 1
    - sql: INSERT INTO t VALUES (2, 5, 6)
      rowcount: 1
    - sql: SELECT id, a, b FROM t ORDER BY id
      expected: [[1, 123, null], [2, 5, 6]]
      ordered: true
    - sql: UPDATE t SET a = DEFAULT, b = DEFAULT WHERE id = 2
      rowcount: 1
    - sql: SELECT id, a, b FROM t ORDER BY id
      expected: [[1, 123, null], [2, 123, null]]
      ordered: true
  teardown:
    - DROP TABLE t

- name: DEFAULT for a NOT NULL column without a default is a not-null violation
  features: [F221]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, a INTEGER NOT NULL)
  steps:
    - sql: INSERT INTO t VALUES (1, DEFAULT)
      error: "23502"
  teardown:
    - DROP TABLE t

- name: a multi-row INSERT is one statement
  features: [E101-01]
  setup:
    - CREATE TABLE mr (id INTEGER PRIMARY KEY, v INTEGER DEFAULT 7 CHECK (v > 0), u INTEGER UNIQUE)
  steps:
    - sql: INSERT INTO mr VALUES (1, 10, 1), (2, 20, 2)
      rowcount: 2
    # A row that fails writes none of the statement's rows: a key twice in
    # the statement, a key already there, a CHECK, a UNIQUE.
    - sql: INSERT INTO mr VALUES (3, 30, 3), (3, 31, 4)
      error: "23505"
    - sql: INSERT INTO mr VALUES (4, 40, 4), (1, 1, 9)
      error: "23505"
    - sql: INSERT INTO mr VALUES (5, 50, 5), (6, -1, 6)
      error: "23514"
    - sql: INSERT INTO mr VALUES (7, 1, 7), (8, 1, 7)
      error: "23505"
    - sql: INSERT INTO mr (id) VALUES (10), (11)
      rowcount: 2
    - sql: INSERT INTO mr VALUES (12, DEFAULT, NULL), (13, 3, NULL)
      rowcount: 2
    - sql: INSERT INTO mr VALUES (14, 1), (15)
      error: "42601"
    - sql: SELECT id, v, u FROM mr
      expected:
        - [1, 10, 1]
        - [10, 7, null]
        - [11, 7, null]
        - [12, 7, null]
        - [13, 3, null]
        - [2, 20, 2]
  teardown:
    - DROP TABLE mr

- name: a multi-row INSERT into a table without a primary key keeps duplicates
  features: [E101-01]
  setup:
    - CREATE TABLE mrn (a INTEGER, b TEXT)
  steps:
    - sql: INSERT INTO mrn VALUES ($1, $2), ($3, $4), (NULL, NULL)
      params: [1, a, 1, a]
      rowcount: 3
    - sql: SELECT a, b FROM mrn
      expected: [[null, null], [1, a], [1, a]]
  teardown:
    - DROP TABLE mrn

- name: a multi-row INSERT in a transaction is undone with it
  features: [E101-01]
  setup:
    - CREATE TABLE mrt (id INTEGER PRIMARY KEY)
  steps:
    - sql: BEGIN
    - sql: INSERT INTO mrt VALUES (1), (2), (3)
      rowcount: 3
    - sql: SELECT id FROM mrt
      expected: [[1], [2], [3]]
    - sql: ROLLBACK
    - sql: SELECT id FROM mrt
      expected: []
  teardown:
    - ROLLBACK
    - DROP TABLE mrt
