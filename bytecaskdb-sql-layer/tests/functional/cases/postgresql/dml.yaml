# INSERT, UPDATE and DELETE: what each reports and leaves, and transactions
# around them.

- name: INSERT reports one row, and a column list fills the rest with NULL
  features: [E101-01]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER, w INTEGER)
  steps:
    - sql: INSERT INTO t (id, v) VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: SELECT id, v, w FROM t WHERE id = $1
      params: [1]
      expected: [[1, 10, null]]
  teardown:
    - DROP TABLE t

- name: an INSERT with the columns in another order
  features: [E101-01]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER, w INTEGER)
  steps:
    - sql: INSERT INTO t (w, id, v) VALUES ($1, $2, $3)
      params: [3, 1, 2]
      rowcount: 1
    - sql: SELECT id, v, w FROM t WHERE id = $1
      params: [1]
      expected: [[1, 2, 3]]
  teardown:
    - DROP TABLE t

- name: an UPDATE of several rows reports how many
  features: [E101-03]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, 20]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [3, 30]
      rowcount: 1
    - sql: UPDATE t SET v = v + $1 WHERE id >= $2
      params: [1, 2]
      rowcount: 2
    - sql: SELECT id, v FROM t WHERE id >= $1
      params: [0]
      expected: [[1, 10], [2, 21], [3, 31]]
  teardown:
    - DROP TABLE t

- name: an UPDATE that matches no row
  features: [E101-03]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, 20]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [3, 30]
      rowcount: 1
    - sql: UPDATE t SET v = $1 WHERE id = $2
      params: [0, 99]
      rowcount: 0
    - sql: SELECT id, v FROM t WHERE id >= $1
      params: [0]
      expected: [[1, 10], [2, 20], [3, 30]]
  teardown:
    - DROP TABLE t

- name: an UPDATE reads the old value of every column in its SET list
  features: [E101-03]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, a INTEGER, b INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2, $3)
      params: [1, 1, 2]
      rowcount: 1
    - sql: UPDATE t SET a = b, b = a WHERE id = $1
      params: [1]
      rowcount: 1
    - sql: SELECT a, b FROM t WHERE id = $1
      params: [1]
      expected: [[2, 1]]
  teardown:
    - DROP TABLE t

- name: an UPDATE to NULL
  features: [E101-03, E131]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, 20]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [3, 30]
      rowcount: 1
    - sql: UPDATE t SET v = $1 WHERE id = $2
      params: [null, 1]
      rowcount: 1
    - sql: SELECT id, v FROM t WHERE id >= $1
      params: [0]
      expected: [[1, null], [2, 20], [3, 30]]
  teardown:
    - DROP TABLE t

- name: a DELETE of several rows reports how many
  features: [E101-04]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, 20]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [3, 30]
      rowcount: 1
    - sql: DELETE FROM t WHERE id >= $1
      params: [2]
      rowcount: 2
    - sql: SELECT id, v FROM t WHERE id >= $1
      params: [0]
      expected: [[1, 10]]
  teardown:
    - DROP TABLE t

- name: a DELETE with no condition on a key
  features: [E101-04]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, 20]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [3, 30]
      rowcount: 1
    - sql: DELETE FROM t WHERE v > $1
      params: [10]
      rowcount: 2
    - sql: SELECT id FROM t WHERE id >= $1
      params: [0]
      expected: [[1]]
  teardown:
    - DROP TABLE t

- name: a row deleted can be inserted again
  features: [E101-01, E101-04]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: DELETE FROM t WHERE id = $1
      params: [1]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 11]
      rowcount: 1
    - sql: SELECT id, v FROM t WHERE id = $1
      params: [1]
      expected: [[1, 11]]
  teardown:
    - DROP TABLE t

- name: an INSERT of a duplicate key fails and changes nothing
  features: [E141-03]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 11]
      error: "23505"
    - sql: SELECT id, v FROM t WHERE id = $1
      params: [1]
      expected: [[1, 10]]
  teardown:
    - DROP TABLE t

- name: a composite primary key
  features: [E141-03]
  setup:
    - CREATE TABLE p (a INTEGER, b INTEGER, v INTEGER, PRIMARY KEY (a, b))
  steps:
    - sql: INSERT INTO p VALUES ($1, $2, $3)
      params: [1, 1, 1]
      rowcount: 1
    - sql: INSERT INTO p VALUES ($1, $2, $3)
      params: [1, 2, 2]
      rowcount: 1
    - sql: INSERT INTO p VALUES ($1, $2, $3)
      params: [1, 1, 3]
      error: "23505"
    - sql: SELECT a, b, v FROM p WHERE a = $1
      params: [1]
      expected: [[1, 1, 1], [1, 2, 2]]
  teardown:
    - DROP TABLE p

- name: an UPDATE of a primary key column
  features: [E101-03, E141-03]
  # updating a primary key column is not supported
  unimplemented: true
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, 20]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [3, 30]
      rowcount: 1
    - sql: UPDATE t SET id = $1 WHERE id = $2
      params: [10, 1]
      rowcount: 1
    - sql: UPDATE t SET id = $1 WHERE id = $2
      params: [2, 3]
      error: "23505"
    - sql: SELECT id, v FROM t WHERE id >= $1
      params: [0]
      expected: [[10, 10], [2, 20], [3, 30]]
  teardown:
    - DROP TABLE t

- name: a statement in a transaction sees the transaction's own writes
  features: [E151-01, E151-02]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: BEGIN
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: UPDATE t SET v = $1 WHERE id = $2
      params: [11, 1]
      rowcount: 1
    - sql: SELECT id, v FROM t WHERE id = $1
      params: [1]
      expected: [[1, 11]]
    - sql: COMMIT
    - sql: SELECT id, v FROM t WHERE id = $1
      params: [1]
      expected: [[1, 11]]
  teardown:
    - ROLLBACK
    - DROP TABLE t

- name: ROLLBACK undoes inserts, updates and deletes
  features: [E151-02]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, 20]
      rowcount: 1
    - sql: BEGIN
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [3, 30]
      rowcount: 1
    - sql: UPDATE t SET v = $1 WHERE id = $2
      params: [99, 1]
      rowcount: 1
    - sql: DELETE FROM t WHERE id = $1
      params: [2]
      rowcount: 1
    - sql: ROLLBACK
    - sql: SELECT id, v FROM t WHERE id >= $1
      params: [0]
      expected: [[1, 10], [2, 20]]
  teardown:
    - ROLLBACK
    - DROP TABLE t

- name: a failed statement aborts the transaction until ROLLBACK
  features: [E151-02]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: BEGIN
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 11]
      error: "23505"
    - sql: SELECT id FROM t WHERE id = $1
      params: [1]
      error: "25P02"
    - sql: ROLLBACK
    - sql: SELECT id, v FROM t WHERE id = $1
      params: [1]
      expected: [[1, 10]]
  teardown:
    - ROLLBACK
    - DROP TABLE t

- name: a multi-row VALUES
  features: [E101-01]
  # INSERT takes exactly one VALUES row
  unimplemented: true
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2), ($3, $4)
      params: [1, 10, 2, 20]
      rowcount: 2
    - sql: SELECT id, v FROM t WHERE id >= $1
      params: [0]
      expected: [[1, 10], [2, 20]]
  teardown:
    - DROP TABLE t

- name: an INSERT of a literal
  features: [E101-01]
  # literals other than in the supported forms are refused: use parameters
  unimplemented: true
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES (1, 10)
      rowcount: 1
    - sql: SELECT id, v FROM t WHERE id >= $1
      params: [0]
      expected: [[1, 10]]
  teardown:
    - DROP TABLE t
