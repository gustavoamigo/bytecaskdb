    - sql: UPDATE sr SET n = t
      error: "42804"
    - sql: UPDATE sr SET bo = n
      error: "42804"
    - sql: UPDATE sr SET n = j
      error: "42804"
    - sql: UPDATE sr SET tm = dt
      error: "42804"
    - sql: UPDATE sr SET n = sum(n)
      error: "42803"
