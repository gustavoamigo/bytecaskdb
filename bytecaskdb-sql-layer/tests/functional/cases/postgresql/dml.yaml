# INSERT, UPDATE and DELETE: what each reports and leaves, and transactions
# around them.

- name: INSERT reports one row, and a column list fills the rest with NULL
  features: [E101-01]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER, w INTEGER)
  steps:
    - sql: INSERT INTO t (id, v) VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: SELECT id, v, w FROM t WHERE id = $1
      params: [1]
      expected: [[1, 10, null]]
  teardown:
    - DROP TABLE t

- name: an INSERT with the columns in another order
  features: [E101-01]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER, w INTEGER)
  steps:
    - sql: INSERT INTO t (w, id, v) VALUES ($1, $2, $3)
      params: [3, 1, 2]
      rowcount: 1
    - sql: SELECT id, v, w FROM t WHERE id = $1
      params: [1]
      expected: [[1, 2, 3]]
  teardown:
    - DROP TABLE t

- name: an UPDATE of several rows reports how many
  features: [E101-03]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, 20]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [3, 30]
      rowcount: 1
    - sql: UPDATE t SET v = v + $1 WHERE id >= $2
      params: [1, 2]
      rowcount: 2
    - sql: SELECT id, v FROM t WHERE id >= $1
      params: [0]
      expected: [[1, 10], [2, 21], [3, 31]]
  teardown:
    - DROP TABLE t

- name: an UPDATE that matches no row
  features: [E101-03]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, 20]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [3, 30]
      rowcount: 1
    - sql: UPDATE t SET v = $1 WHERE id = $2
      params: [0, 99]
      rowcount: 0
    - sql: SELECT id, v FROM t WHERE id >= $1
      params: [0]
      expected: [[1, 10], [2, 20], [3, 30]]
  teardown:
    - DROP TABLE t

- name: an UPDATE reads the old value of every column in its SET list
  features: [E101-03]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, a INTEGER, b INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2, $3)
      params: [1, 1, 2]
      rowcount: 1
    - sql: UPDATE t SET a = b, b = a WHERE id = $1
      params: [1]
      rowcount: 1
    - sql: SELECT a, b FROM t WHERE id = $1
      params: [1]
      expected: [[2, 1]]
  teardown:
    - DROP TABLE t

- name: an UPDATE to NULL
  features: [E101-03, E131]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, 20]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [3, 30]
      rowcount: 1
    - sql: UPDATE t SET v = $1 WHERE id = $2
      params: [null, 1]
      rowcount: 1
    - sql: SELECT id, v FROM t WHERE id >= $1
      params: [0]
      expected: [[1, null], [2, 20], [3, 30]]
  teardown:
    - DROP TABLE t

- name: a DELETE of several rows reports how many
  features: [E101-04]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, 20]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [3, 30]
      rowcount: 1
    - sql: DELETE FROM t WHERE id >= $1
      params: [2]
      rowcount: 2
    - sql: SELECT id, v FROM t WHERE id >= $1
      params: [0]
      expected: [[1, 10]]
  teardown:
    - DROP TABLE t

- name: a DELETE with no condition on a key
  features: [E101-04]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, 20]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [3, 30]
      rowcount: 1
    - sql: DELETE FROM t WHERE v > $1
      params: [10]
      rowcount: 2
    - sql: SELECT id FROM t WHERE id >= $1
      params: [0]
      expected: [[1]]
  teardown:
    - DROP TABLE t

- name: a row deleted can be inserted again
  features: [E101-01, E101-04]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: DELETE FROM t WHERE id = $1
      params: [1]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 11]
      rowcount: 1
    - sql: SELECT id, v FROM t WHERE id = $1
      params: [1]
      expected: [[1, 11]]
  teardown:
    - DROP TABLE t

- name: an INSERT of a duplicate key fails and changes nothing
  features: [E141-03]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 11]
      error: "23505"
    - sql: SELECT id, v FROM t WHERE id = $1
      params: [1]
      expected: [[1, 10]]
  teardown:
    - DROP TABLE t

- name: a composite primary key
  features: [E141-03]
  setup:
    - CREATE TABLE p (a INTEGER, b INTEGER, v INTEGER, PRIMARY KEY (a, b))
  steps:
    - sql: INSERT INTO p VALUES ($1, $2, $3)
      params: [1, 1, 1]
      rowcount: 1
    - sql: INSERT INTO p VALUES ($1, $2, $3)
      params: [1, 2, 2]
      rowcount: 1
    - sql: INSERT INTO p VALUES ($1, $2, $3)
      params: [1, 1, 3]
      error: "23505"
    - sql: SELECT a, b, v FROM p WHERE a = $1
      params: [1]
      expected: [[1, 1, 1], [1, 2, 2]]
  teardown:
    - DROP TABLE p

- name: an UPDATE of a primary key column
  features: [E101-03, E141-03]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, 20]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [3, 30]
      rowcount: 1
    - sql: UPDATE t SET id = $1 WHERE id = $2
      params: [10, 1]
      rowcount: 1
    - sql: UPDATE t SET id = $1 WHERE id = $2
      params: [2, 3]
      error: "23505"
    - sql: SELECT id, v FROM t WHERE id >= $1
      params: [0]
      expected: [[10, 10], [2, 20], [3, 30]]
  teardown:
    - DROP TABLE t

- name: a statement in a transaction sees the transaction's own writes
  features: [E151-01, E151-02]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: BEGIN
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: UPDATE t SET v = $1 WHERE id = $2
      params: [11, 1]
      rowcount: 1
    - sql: SELECT id, v FROM t WHERE id = $1
      params: [1]
      expected: [[1, 11]]
    - sql: COMMIT
    - sql: SELECT id, v FROM t WHERE id = $1
      params: [1]
      expected: [[1, 11]]
  teardown:
    - ROLLBACK
    - DROP TABLE t

- name: ROLLBACK undoes inserts, updates and deletes
  features: [E151-02]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, 20]
      rowcount: 1
    - sql: BEGIN
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [3, 30]
      rowcount: 1
    - sql: UPDATE t SET v = $1 WHERE id = $2
      params: [99, 1]
      rowcount: 1
    - sql: DELETE FROM t WHERE id = $1
      params: [2]
      rowcount: 1
    - sql: ROLLBACK
    - sql: SELECT id, v FROM t WHERE id >= $1
      params: [0]
      expected: [[1, 10], [2, 20]]
  teardown:
    - ROLLBACK
    - DROP TABLE t

- name: a failed statement aborts the transaction until ROLLBACK
  features: [E151-02]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: BEGIN
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 11]
      error: "23505"
    - sql: SELECT id FROM t WHERE id = $1
      params: [1]
      error: "25P02"
    - sql: ROLLBACK
    - sql: SELECT id, v FROM t WHERE id = $1
      params: [1]
      expected: [[1, 10]]
  teardown:
    - ROLLBACK
    - DROP TABLE t

- name: a multi-row VALUES
  features: [E101-01]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2), ($3, $4)
      params: [1, 10, 2, 20]
      rowcount: 2
    - sql: SELECT id, v FROM t WHERE id >= $1
      params: [0]
      expected: [[1, 10], [2, 20]]
  teardown:
    - DROP TABLE t

- name: an INSERT of a literal
  features: [E101-01]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES (1, 10)
      rowcount: 1
    - sql: SELECT id, v FROM t WHERE id >= $1
      params: [0]
      expected: [[1, 10]]
  teardown:
    - DROP TABLE t

- name: DEFAULT in an INSERT and an UPDATE takes the column's default, NULL without one
  features: [F221]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, a INTEGER DEFAULT 123, b INTEGER)
  steps:
    - sql: INSERT INTO t (id, a, b) VALUES (1, DEFAULT, DEFAULT)
      rowcount: 1
    - sql: INSERT INTO t VALUES (2, 5, 6)
      rowcount: 1
    - sql: SELECT id, a, b FROM t ORDER BY id
      expected: [[1, 123, null], [2, 5, 6]]
      ordered: true
    - sql: UPDATE t SET a = DEFAULT, b = DEFAULT WHERE id = 2
      rowcount: 1
    - sql: SELECT id, a, b FROM t ORDER BY id
      expected: [[1, 123, null], [2, 123, null]]
      ordered: true
  teardown:
    - DROP TABLE t

- name: DEFAULT for a NOT NULL column without a default is a not-null violation
  features: [F221]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, a INTEGER NOT NULL)
  steps:
    - sql: INSERT INTO t VALUES (1, DEFAULT)
      error: "23502"
  teardown:
    - DROP TABLE t

- name: a multi-row INSERT is one statement
  features: [E101-01]
  setup:
    - CREATE TABLE mr (id INTEGER PRIMARY KEY, v INTEGER DEFAULT 7 CHECK (v > 0), u INTEGER UNIQUE)
  steps:
    - sql: INSERT INTO mr VALUES (1, 10, 1), (2, 20, 2)
      rowcount: 2
    # A row that fails writes none of the statement's rows: a key twice in
    # the statement, a key already there, a CHECK, a UNIQUE.
    - sql: INSERT INTO mr VALUES (3, 30, 3), (3, 31, 4)
      error: "23505"
    - sql: INSERT INTO mr VALUES (4, 40, 4), (1, 1, 9)
      error: "23505"
    - sql: INSERT INTO mr VALUES (5, 50, 5), (6, -1, 6)
      error: "23514"
    - sql: INSERT INTO mr VALUES (7, 1, 7), (8, 1, 7)
      error: "23505"
    - sql: INSERT INTO mr (id) VALUES (10), (11)
      rowcount: 2
    - sql: INSERT INTO mr VALUES (12, DEFAULT, NULL), (13, 3, NULL)
      rowcount: 2
    - sql: INSERT INTO mr VALUES (14, 1), (15)
      error: "42601"
    - sql: SELECT id, v, u FROM mr
      expected:
        - [1, 10, 1]
        - [10, 7, null]
        - [11, 7, null]
        - [12, 7, null]
        - [13, 3, null]
        - [2, 20, 2]
  teardown:
    - DROP TABLE mr

- name: a multi-row INSERT into a table without a primary key keeps duplicates
  features: [E101-01]
  setup:
    - CREATE TABLE mrn (a INTEGER, b TEXT)
  steps:
    - sql: INSERT INTO mrn VALUES ($1, $2), ($3, $4), (NULL, NULL)
      params: [1, a, 1, a]
      rowcount: 3
    - sql: SELECT a, b FROM mrn
      expected: [[null, null], [1, a], [1, a]]
  teardown:
    - DROP TABLE mrn

- name: a multi-row INSERT in a transaction is undone with it
  features: [E101-01]
  setup:
    - CREATE TABLE mrt (id INTEGER PRIMARY KEY)
  steps:
    - sql: BEGIN
    - sql: INSERT INTO mrt VALUES (1), (2), (3)
      rowcount: 3
    - sql: SELECT id FROM mrt
      expected: [[1], [2], [3]]
    - sql: ROLLBACK
    - sql: SELECT id FROM mrt
      expected: []
  teardown:
    - ROLLBACK
    - DROP TABLE mrt

- name: an UPDATE of a primary key checks each row's new key in turn
  features: [E101-03, E141-03]
  setup:
    - CREATE TABLE upk (id INTEGER PRIMARY KEY, v INTEGER, u INTEGER UNIQUE)
    - CREATE INDEX upk_v ON upk (v)
    - INSERT INTO upk VALUES (1, 10, 1)
    - INSERT INTO upk VALUES (2, 20, 2)
    - INSERT INTO upk VALUES (3, 30, 3)
    - CREATE TABLE upk2 (a INTEGER, b INTEGER, c TEXT, PRIMARY KEY (a, b))
    - INSERT INTO upk2 VALUES (1, 1, 'x')
    - INSERT INTO upk2 VALUES (1, 2, 'y')
  steps:
    # A row moves into the key the row before it left.
    - sql: UPDATE upk SET id = id - 1
      rowcount: 3
    - sql: SELECT id, v, u FROM upk
      expected: [[0, 10, 1], [1, 20, 2], [2, 30, 3]]
    # Into a key a row the statement has not moved yet holds: a duplicate.
    - sql: UPDATE upk SET id = id + 1
      error: "23505"
    - sql: SELECT id FROM upk
      expected: [[0], [1], [2]]
    # The indexes follow the row.
    - sql: SELECT id FROM upk WHERE v = 20
      expected: [[1]]
    - sql: SELECT id FROM upk WHERE u = 3
      expected: [[2]]
    - sql: UPDATE upk SET id = 9, u = 9 WHERE id = 0
      rowcount: 1
    - sql: SELECT id, v, u FROM upk
      expected: [[1, 20, 2], [2, 30, 3], [9, 10, 9]]
    - sql: UPDATE upk SET id = NULL WHERE id = 9
      error: "23502"
    - sql: UPDATE upk SET id = 5000000000 WHERE id = 9
      error: "22003"
    - sql: UPDATE upk2 SET b = b + 10 WHERE a = 1
      rowcount: 2
    - sql: SELECT a, b, c FROM upk2
      expected: [[1, 11, x], [1, 12, y]]
    - sql: UPDATE upk2 SET b = 11 WHERE b = 12
      error: "23505"
  teardown:
    - DROP TABLE upk
    - DROP TABLE upk2

- name: an UPDATE of a primary key in a transaction frees its old key
  features: [E101-03]
  setup:
    - CREATE TABLE upt (id INTEGER PRIMARY KEY, v INTEGER)
    - INSERT INTO upt VALUES (1, 1)
    - INSERT INTO upt VALUES (2, 2)
  steps:
    - sql: BEGIN
    - sql: UPDATE upt SET id = 3 WHERE id = 1
      rowcount: 1
    - sql: INSERT INTO upt VALUES (1, 100)
      rowcount: 1
    - sql: SELECT id, v FROM upt
      expected: [[1, 100], [2, 2], [3, 1]]
    - sql: ROLLBACK
    - sql: SELECT id, v FROM upt
      expected: [[1, 1], [2, 2]]
  teardown:
    - ROLLBACK
    - DROP TABLE upt

- name: INSERT … SELECT writes a query's rows into the leading columns or a column list
  features: [E101-01]
  setup:
    - CREATE TABLE src (a INTEGER PRIMARY KEY, b BIGINT, c VARCHAR(10))
    - INSERT INTO src VALUES (1, 10, 'one'), (2, NULL, 'two'), (3, 30, NULL)
    - CREATE TABLE dst (k INTEGER, v BIGINT DEFAULT 9, s TEXT, f DOUBLE PRECISION)
  steps:
    - sql: INSERT INTO dst SELECT a, b FROM src WHERE a <= $1
      params: [2]
      rowcount: 2
    # A column left out takes its default; a NULL given is NULL.
    - sql: INSERT INTO dst (s, k) SELECT c, a FROM src WHERE a = 3
      rowcount: 1
    # An integer into a DOUBLE PRECISION column is converted.
    - sql: INSERT INTO dst (k, f) SELECT a + 10, b FROM src ORDER BY a LIMIT 2
      rowcount: 2
    - sql: INSERT INTO dst (k) SELECT x.a FROM src x JOIN src y ON x.b = y.b
      rowcount: 2
    - sql: SELECT k, v, s, f FROM dst
      expected:
        - [1, 10, null, null]
        - [2, null, null, null]
        - [3, 9, null, null]
        - [11, 9, null, 10]
        - [12, 9, null, null]
        - [1, 9, null, null]
        - [3, 9, null, null]
    # No row, LIMIT 0 and a WHERE that is never true write nothing.
    - sql: INSERT INTO dst (k) SELECT a FROM src WHERE a > 100
      rowcount: 0
    - sql: INSERT INTO dst (k) SELECT a FROM src LIMIT 0
      rowcount: 0
    - sql: INSERT INTO dst (k) SELECT a FROM src WHERE FALSE
      rowcount: 0
    - sql: INSERT INTO dst (k) SELECT a FROM src WHERE a = 2 RETURNING k, v
      expected: [[2, 9]]
  teardown:
    - DROP TABLE dst
    - DROP TABLE src

- name: INSERT … SELECT from its own table reads the rows there when it began
  features: [E101-01]
  setup:
    - CREATE TABLE t (a INTEGER, b TEXT)
    - INSERT INTO t VALUES (1, 'x'), (2, 'y')
  steps:
    - sql: INSERT INTO t SELECT * FROM t
      rowcount: 2
    - sql: INSERT INTO t SELECT * FROM t
      rowcount: 4
    - sql: SELECT a, COUNT(*) FROM t GROUP BY a
      expected: [[1, 4], [2, 4]]
  teardown:
    - DROP TABLE t

- name: a literal of no type, NULL and a parameter in INSERT … SELECT take their column's type
  features: [E101-01]
  setup:
    - CREATE TABLE dst (k INTEGER DEFAULT 7, v BIGINT DEFAULT 9, s TEXT, n VARCHAR(3))
  steps:
    - sql: INSERT INTO dst (k, v, s, n) SELECT '5', NULL, $1, 'ab'
      params: ["p"]
      rowcount: 1
    - sql: SELECT k, v, s, n FROM dst
      expected: [[5, null, "p", "ab"]]
    - sql: INSERT INTO dst (k) SELECT 'x'
      error: "22P02"
    - sql: INSERT INTO dst (n) SELECT 'abcd'
      error: "22001"
  teardown:
    - DROP TABLE dst

- name: INSERT … SELECT is refused as PostgreSQL refuses it, and writes nothing
  features: [E101-01]
  setup:
    - CREATE TABLE src (a INTEGER PRIMARY KEY, b BIGINT, c VARCHAR(10))
    - INSERT INTO src VALUES (1, 10, 'one'), (2, 3000000000, 'two')
    - CREATE TABLE dst (k INTEGER PRIMARY KEY, n VARCHAR(3), d DATE)
    - INSERT INTO dst VALUES (2, NULL, NULL)
  steps:
    - sql: INSERT INTO dst (k) SELECT a, b FROM src
      error: "42601"
    - sql: INSERT INTO dst (k, n) SELECT a FROM src
      error: "42601"
    - sql: INSERT INTO dst (k, k) SELECT a, a FROM src
      error: "42701"
    - sql: INSERT INTO dst (zz) SELECT a FROM src
      error: "42703"
    - sql: INSERT INTO dst (k) SELECT c FROM src
      error: "42804"
    - sql: INSERT INTO dst (d) SELECT a FROM src
      error: "42804"
    - sql: INSERT INTO dst (k, n) SELECT a + 10, c || 'xx' FROM src
      error: "22001"
    - sql: INSERT INTO dst (k) SELECT b FROM src
      error: "22003"
    - sql: INSERT INTO dst (k) SELECT a FROM src
      error: "23505"
    - sql: SELECT k FROM dst
      expected: [[2]]
  teardown:
    - DROP TABLE dst
    - DROP TABLE src

- name: INSERT … SELECT of an aggregated, grouped, DISTINCT or set operation query
  features: [E101-01]
  # INSERT … SELECT of an aggregated, grouped or DISTINCT query is not supported yet (0A000, #682)
  unimplemented: true
  setup:
    - CREATE TABLE src (a INTEGER PRIMARY KEY, b INTEGER)
    - INSERT INTO src VALUES (1, 10), (2, 10), (3, 20)
    - CREATE TABLE dst (k BIGINT, v INTEGER)
  steps:
    - sql: INSERT INTO dst SELECT COUNT(*) FROM src
      rowcount: 1
    - sql: INSERT INTO dst SELECT COUNT(*), b FROM src GROUP BY b
      rowcount: 2
    - sql: INSERT INTO dst (v) SELECT DISTINCT b FROM src
      rowcount: 2
    - sql: INSERT INTO dst (v) SELECT a FROM src UNION SELECT b FROM src
      rowcount: 5
    - sql: SELECT COUNT(*) FROM dst
      expected: [[10]]
  teardown:
    - DROP TABLE dst
    - DROP TABLE src

- name: INSERT … SELECT with an assignment cast PostgreSQL makes
  features: [E101-01]
  setup:
    - CREATE TABLE src (a INTEGER PRIMARY KEY, d DOUBLE PRECISION)
    - INSERT INTO src VALUES (1, 2.5), (2, 3.5)
    - CREATE TABLE dst (s TEXT, k INTEGER, m NUMERIC(5, 2))
  steps:
    - sql: INSERT INTO dst (s, k, m) SELECT a, d, a FROM src
      rowcount: 2
    - sql: SELECT s, k, m FROM dst
      expected: [["1", 2, "1.00"], ["2", 4, "2.00"]]
  teardown:
    - DROP TABLE dst
    - DROP TABLE src

- name: UPDATE … SET of any value expression, every value from the row before the update
  features: [E101-03]
  setup:
    - CREATE TABLE se (id INTEGER PRIMARY KEY, n INTEGER, t TEXT, j JSONB, b BOOLEAN)
    - "INSERT INTO se VALUES (1, 5, 'x', '{\"n\": \"7\", \"s\": \"Str\"}', true), (2, NULL, NULL, NULL, NULL)"
  steps:
    - sql: UPDATE se SET n = n + 1, t = t || n WHERE id = 1 RETURNING n, t
      expected: [[6, x5]]
    - sql: UPDATE se SET n = (j->>'n')::int, t = j->>'s' RETURNING id, n, t
      expected: [[1, 7, Str], [2, null, null]]
    - sql: UPDATE se SET t = lower(t), b = n > 6 RETURNING id, t, b
      expected: [[1, str, t], [2, null, null]]
    - sql: UPDATE se SET t = CASE WHEN n > 5 THEN 'big' ELSE 'small' END, n = coalesce(n, 0) * 2 RETURNING id, n, t
      expected: [[1, 14, big], [2, 0, small]]
    - sql: SELECT id, n, t, b FROM se ORDER BY id
      expected: [[1, 14, big, t], [2, 0, small, null]]
  teardown:
    - DROP TABLE se

- name: UPDATE … SET assigns a value of another type by PostgreSQL's assignment cast
  features: [E101-03]
  setup:
    - CREATE TABLE sa (id INTEGER PRIMARY KEY, a SMALLINT, n INTEGER, d NUMERIC(5, 2), f DOUBLE PRECISION, t TEXT, v VARCHAR(3), ch CHAR(3), nm NAME, bo BOOLEAN, dt DATE, ts TIMESTAMP, j JSONB, by BYTEA)
    - "INSERT INTO sa VALUES (1, 5, 5, 2.50, 2.5, 'x', 'ab', 'ab', 'nm', true, '2024-03-01', '2024-03-01 10:00', '{\"o\": {\"z\": 1}}', '\\x6162')"
  steps:
    - sql: UPDATE sa SET t = bo RETURNING t
      expected: [["true"]]
    - sql: UPDATE sa SET nm = bo RETURNING nm
      expected: [[t]]
    - sql: UPDATE sa SET t = d RETURNING t
      expected: [["2.50"]]
    - sql: UPDATE sa SET t = j->'o' RETURNING t
      expected: [["{\"z\": 1}"]]
    - sql: UPDATE sa SET t = dt RETURNING t
      expected: [["2024-03-01"]]
    - sql: UPDATE sa SET t = by RETURNING t
      expected: [[\x6162]]
    - sql: UPDATE sa SET t = ch || '|' RETURNING t
      expected: [[ab|]]
    - sql: UPDATE sa SET n = f RETURNING n
      expected: [[2]]
    - sql: UPDATE sa SET n = d RETURNING n
      expected: [[3]]
    - sql: UPDATE sa SET d = n * 1.005 RETURNING d
      expected: [["3.02"]]
    - sql: UPDATE sa SET f = n RETURNING f
      expected: [[3]]
    - sql: UPDATE sa SET dt = ts, ts = dt RETURNING dt, ts
      expected: [["2024-03-01", "2024-03-01 00:00:00"]]
    - sql: UPDATE sa SET a = n + 1 RETURNING a
      expected: [[4]]
    - sql: SELECT a, n, d, t, nm, dt, ts FROM sa
      expected: [[4, 3, "3.02", ab|, t, "2024-03-01", "2024-03-01 00:00:00"]]
  teardown:
    - DROP TABLE sa

- name: UPDATE … SET refuses as PostgreSQL refuses, and writes nothing
  features: [E101-03]
  setup:
    - CREATE TABLE sr (id INTEGER PRIMARY KEY, a SMALLINT, n INTEGER, d NUMERIC(5, 2), t TEXT, v VARCHAR(3), ch CHAR(3), bo BOOLEAN, dt DATE, tm TIME, j JSONB)
