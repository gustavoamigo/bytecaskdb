- name: concatenation with ||
  features: [E021-07]
  # || of a column (#667)
  unimplemented: true
  ordered: true
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v VARCHAR(20))
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, "apple"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, "Apple"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [3, "banana"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [4, "a_b"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [5, null]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [6, "  pad  "]
      rowcount: 1
    - sql: SELECT id, v || $1 FROM t WHERE id >= $2 ORDER BY id
