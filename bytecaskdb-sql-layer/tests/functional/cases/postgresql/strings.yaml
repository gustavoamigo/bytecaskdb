# Strings: LIKE, concatenation and the string functions, and what the layer
# refuses.

- name: LIKE with % and _
  features: [E061-04]
  # WHERE must compare a column
  unimplemented: true
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v VARCHAR(20))
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, "apple"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, "Apple"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [3, "banana"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [4, "a_b"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [5, null]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [6, "  pad  "]
      rowcount: 1
    - sql: SELECT id FROM t WHERE v LIKE $1 AND id >= $2
      params: ["a%", 0]
      expected: [[1], [4]]
  teardown:
    - DROP TABLE t

