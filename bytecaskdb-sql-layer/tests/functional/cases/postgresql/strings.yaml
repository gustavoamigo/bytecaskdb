- name: a string compared with = and <
  features: [E021-12]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v VARCHAR(20))
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, "apple"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, "Apple"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [3, "banana"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [4, "a_b"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [5, null]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [6, "  pad  "]
      rowcount: 1
    - sql: SELECT id FROM t WHERE v < $1 AND id >= $2
      params: ["b", 0]
      # Written by hand: the layer compares text as bytes (types_design.md, Types), so
      # "  pad  " and "Apple" sort before "b"; PostgreSQL's locale does not put "  pad  " there.
      expected: [[1], [2], [4], [6]]
  teardown:
    - DROP TABLE t

- name: a string with an apostrophe and a backslash, by parameter
  features: [E021-03]
  ordered: true
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v VARCHAR(20))
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, "it's"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, "a\\b"]
      rowcount: 1
    - sql: SELECT id, v FROM t WHERE id >= $1 ORDER BY id
      params: [0]
      expected: [[1, it's], [2, a\b]]
  teardown:
    - DROP TABLE t

