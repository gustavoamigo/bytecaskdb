      params: [5, null]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [6, "  pad  "]
      rowcount: 1
    - sql: SELECT id, UPPER(v), LOWER(v) FROM t WHERE id >= $1 ORDER BY id
