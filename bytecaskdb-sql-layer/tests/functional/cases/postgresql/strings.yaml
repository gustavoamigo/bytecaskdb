- name: a CHAR(n) column pads to n
  features: [E021-01]
  # CHAR(n) is not supported; use VARCHAR(n)
  unimplemented: true
  ordered: true
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v CHAR(4))
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, "ab"]
      rowcount: 1
    - sql: SELECT id, v FROM t WHERE id >= $1 ORDER BY id
      params: [0]
      expected: [[1, "ab  "]]
  teardown:
    - DROP TABLE t

- name: an empty string is not NULL
  features: [E131, E021-02]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v VARCHAR(20))
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, ""]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, null]
      rowcount: 1
    - sql: SELECT id FROM t WHERE v = $1 AND id >= $2
      params: ["", 0]
      expected: [[1]]
  teardown:
    - DROP TABLE t
