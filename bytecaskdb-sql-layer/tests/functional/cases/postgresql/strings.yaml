- name: concatenation with ||
  features: [E021-07]
  # only + and - are supported here
  unimplemented: true
  ordered: true
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v VARCHAR(20))
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, "apple"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, "Apple"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [3, "banana"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [4, "a_b"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [5, null]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [6, "  pad  "]
      rowcount: 1
    - sql: SELECT id, v || $1 FROM t WHERE id >= $2 ORDER BY id
      params: ["!", 0]
      expected:
        - [1, apple!]
        - [2, Apple!]
        - [3, banana!]
        - [4, a_b!]
        - [5, null]
        - [6, "  pad  !"]
  teardown:
    - DROP TABLE t

- name: UPPER and LOWER
  features: [E021-08]
  # function upper is not supported
  unimplemented: true
  ordered: true
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v VARCHAR(20))
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, "apple"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, "Apple"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [3, "banana"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [4, "a_b"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [5, null]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [6, "  pad  "]
      rowcount: 1
    - sql: SELECT id, UPPER(v), LOWER(v) FROM t WHERE id >= $1 ORDER BY id
      params: [0]
      expected:
        - [1, APPLE, apple]
        - [2, APPLE, apple]
        - [3, BANANA, banana]
        - [4, A_B, a_b]
        - [5, null, null]
        - [6, "  PAD  ", "  pad  "]
  teardown:
    - DROP TABLE t

- name: CHARACTER_LENGTH and OCTET_LENGTH
