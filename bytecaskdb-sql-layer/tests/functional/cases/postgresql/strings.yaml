  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, "abc"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, "é"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [3, null]
      rowcount: 1
    - sql: SELECT id, CHARACTER_LENGTH(v), OCTET_LENGTH(v) FROM t WHERE id >= $1 ORDER BY id
      params: [0]
      expected: [[1, 3, 3], [2, 1, 2], [3, null, null]]
  teardown:
    - DROP TABLE t

