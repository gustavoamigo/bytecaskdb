- name: the difference of two DATEs
  features: [F051-01]
  # only columns, constants and aggregates can be selected
  unimplemented: true
  ordered: true
  setup:
    - CREATE TABLE dt (id INTEGER PRIMARY KEY, d DATE, ts TIMESTAMP)
  steps:
    - sql: INSERT INTO dt VALUES ($1, $2, $3)
      params: [1, "2026-10-25", "2026-10-25 12:00:00"]
      rowcount: 1
    - sql: INSERT INTO dt VALUES ($1, $2, $3)
      params: [2, "2026-02-28", "2026-02-28 23:59:59.999999"]
      rowcount: 1
    - sql: INSERT INTO dt VALUES ($1, $2, $3)
      params: [3, "1999-12-31", "1999-12-31 00:00:00"]
      rowcount: 1
    - sql: SELECT id, d - $1 FROM dt WHERE id >= $2 ORDER BY id
      params: ["2026-01-01", 0]
      expected: [[1, 297], [2, 58], [3, -9498]]
  teardown:
    - DROP TABLE dt

