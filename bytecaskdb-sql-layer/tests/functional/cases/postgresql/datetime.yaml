# DATE, TIME and TIMESTAMP: comparison, order, arithmetic and the forms the
# layer refuses. Values go in by parameter, as text.

- name: DATE compared with a parameter
  features: [F051-04]
  setup:
    - CREATE TABLE dt (id INTEGER PRIMARY KEY, d DATE, ts TIMESTAMP)
  steps:
    - sql: INSERT INTO dt VALUES ($1, $2, $3)
      params: [1, "2026-10-25", "2026-10-25 12:00:00"]
      rowcount: 1
    - sql: INSERT INTO dt VALUES ($1, $2, $3)
      params: [2, "2026-02-28", "2026-02-28 23:59:59.999999"]
      rowcount: 1
    - sql: INSERT INTO dt VALUES ($1, $2, $3)
      params: [3, "1999-12-31", "1999-12-31 00:00:00"]
      rowcount: 1
    - sql: SELECT id FROM dt WHERE d > $1 AND id >= $2
      params: ["2026-01-01", 0]
      expected: [[1], [2]]
  teardown:
    - DROP TABLE dt

- name: TIMESTAMP compared with a parameter
  features: [F051-04]
  setup:
    - CREATE TABLE dt (id INTEGER PRIMARY KEY, d DATE, ts TIMESTAMP)
  steps:
    - sql: INSERT INTO dt VALUES ($1, $2, $3)
      params: [1, "2026-10-25", "2026-10-25 12:00:00"]
      rowcount: 1
    - sql: INSERT INTO dt VALUES ($1, $2, $3)
      params: [2, "2026-02-28", "2026-02-28 23:59:59.999999"]
      rowcount: 1
    - sql: INSERT INTO dt VALUES ($1, $2, $3)
      params: [3, "1999-12-31", "1999-12-31 00:00:00"]
      rowcount: 1
    - sql: SELECT id FROM dt WHERE ts <= $1 AND id >= $2
      params: ["2026-02-28 23:59:59.999999", 0]
      expected: [[2], [3]]
  teardown:
    - DROP TABLE dt

- name: ORDER BY a DATE and a TIMESTAMP
