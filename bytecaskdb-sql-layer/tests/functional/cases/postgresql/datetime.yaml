    - sql: INSERT INTO dt VALUES ($1, $2, $3)
      params: [3, "1999-12-31", "1999-12-31 00:00:00"]
      rowcount: 1
    - sql: SELECT id FROM dt WHERE d < CURRENT_DATE AND id >= $1
      params: [0]
      expected: [[2], [3]]
