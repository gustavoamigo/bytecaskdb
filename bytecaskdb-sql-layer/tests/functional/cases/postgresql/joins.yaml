    - DROP TABLE b

- name: a CROSS JOIN pairs every row with every row
  features: [F041-01]
  setup:
    - CREATE TABLE a (id INTEGER PRIMARY KEY, k INTEGER, v VARCHAR(10))
    - CREATE TABLE b (id INTEGER PRIMARY KEY, a_id INTEGER, w INTEGER)
    - CREATE INDEX b_a ON b (a_id)
  steps:
    - sql: INSERT INTO a VALUES ($1, $2, $3)
      params: [1, 1, "x"]
      rowcount: 1
    - sql: INSERT INTO a VALUES ($1, $2, $3)
      params: [2, 2, "y"]
      rowcount: 1
    - sql: INSERT INTO a VALUES ($1, $2, $3)
      params: [3, 3, null]
      rowcount: 1
    - sql: INSERT INTO b VALUES ($1, $2, $3)
      params: [1, 1, 10]
      rowcount: 1
    - sql: INSERT INTO b VALUES ($1, $2, $3)
      params: [2, 1, 20]
      rowcount: 1
    - sql: INSERT INTO b VALUES ($1, $2, $3)
      params: [3, 2, 30]
      rowcount: 1
    - sql: INSERT INTO b VALUES ($1, $2, $3)
      params: [4, null, 40]
      rowcount: 1
    - sql: SELECT a.id, b.id FROM a CROSS JOIN b
      expected:
        - [1, 1]
        - [1, 2]
        - [1, 3]
        - [1, 4]
        - [2, 1]
        - [2, 2]
        - [2, 3]
        - [2, 4]
        - [3, 1]
        - [3, 2]
        - [3, 3]
        - [3, 4]
  teardown:
    - DROP TABLE a
    - DROP TABLE b

