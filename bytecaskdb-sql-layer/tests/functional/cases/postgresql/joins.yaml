# Joins: the pairs a join returns, with filters, aggregates, order and the forms
# the layer doesn't take yet.

- name: an inner join returns the matching pairs
  features: [F041-01]
  setup:
    - CREATE TABLE a (id INTEGER PRIMARY KEY, k INTEGER, v VARCHAR(10))
    - CREATE TABLE b (id INTEGER PRIMARY KEY, a_id INTEGER, w INTEGER)
    - CREATE INDEX b_a ON b (a_id)
  steps:
    - sql: INSERT INTO a VALUES ($1, $2, $3)
      params: [1, 1, "x"]
      rowcount: 1
    - sql: INSERT INTO a VALUES ($1, $2, $3)
      params: [2, 2, "y"]
      rowcount: 1
    - sql: INSERT INTO a VALUES ($1, $2, $3)
      params: [3, 3, null]
      rowcount: 1
    - sql: INSERT INTO b VALUES ($1, $2, $3)
      params: [1, 1, 10]
      rowcount: 1
    - sql: INSERT INTO b VALUES ($1, $2, $3)
      params: [2, 1, 20]
      rowcount: 1
    - sql: INSERT INTO b VALUES ($1, $2, $3)
      params: [3, 2, 30]
      rowcount: 1
    - sql: INSERT INTO b VALUES ($1, $2, $3)
      params: [4, null, 40]
      rowcount: 1
    - sql: SELECT a.id, b.w FROM a JOIN b ON a.id = b.a_id
      expected: [[1, 10], [1, 20], [2, 30]]
  teardown:
    - DROP TABLE a
    - DROP TABLE b

