      params: [1, 1, "x"]
      rowcount: 1
    - sql: INSERT INTO a VALUES ($1, $2, $3)
      params: [2, 2, "y"]
      rowcount: 1
    - sql: INSERT INTO a VALUES ($1, $2, $3)
      params: [3, 3, null]
      rowcount: 1
    - sql: INSERT INTO b VALUES ($1, $2, $3)
      params: [1, 1, 10]
      rowcount: 1
    - sql: INSERT INTO b VALUES ($1, $2, $3)
      params: [2, 1, 20]
      rowcount: 1
    - sql: INSERT INTO b VALUES ($1, $2, $3)
      params: [3, 2, 30]
      rowcount: 1
