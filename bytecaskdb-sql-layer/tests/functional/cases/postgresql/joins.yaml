- name: a join of three tables
  features: [F041-01]
  # three or more tables are refused
  unimplemented: true
  setup:
    - CREATE TABLE a (id INTEGER PRIMARY KEY, k INTEGER, v VARCHAR(10))
    - CREATE TABLE b (id INTEGER PRIMARY KEY, a_id INTEGER, w INTEGER)
    - CREATE INDEX b_a ON b (a_id)
    - CREATE TABLE c (id INTEGER PRIMARY KEY, b_id INTEGER)
  steps:
    - sql: INSERT INTO a VALUES ($1, $2, $3)
      params: [1, 1, "x"]
      rowcount: 1
    - sql: INSERT INTO a VALUES ($1, $2, $3)
      params: [2, 2, "y"]
      rowcount: 1
    - sql: INSERT INTO a VALUES ($1, $2, $3)
      params: [3, 3, null]
      rowcount: 1
    - sql: INSERT INTO b VALUES ($1, $2, $3)
      params: [1, 1, 10]
      rowcount: 1
    - sql: INSERT INTO b VALUES ($1, $2, $3)
      params: [2, 1, 20]
      rowcount: 1
    - sql: INSERT INTO b VALUES ($1, $2, $3)
      params: [3, 2, 30]
      rowcount: 1
    - sql: INSERT INTO b VALUES ($1, $2, $3)
      params: [4, null, 40]
      rowcount: 1
    - sql: INSERT INTO c VALUES ($1, $2)
      params: [1, 1]
      rowcount: 1
    - sql: INSERT INTO c VALUES ($1, $2)
      params: [2, 3]
      rowcount: 1
    - sql: SELECT a.id, b.w, c.id FROM a JOIN b ON a.id = b.a_id JOIN c ON b.id = c.b_id
      expected: [[1, 10, 1], [2, 30, 2]]
  teardown:
    - DROP TABLE a
    - DROP TABLE b
    - DROP TABLE c

- name: a table joined to itself
  features: [F041-01]
  # table aliases are refused
  unimplemented: true
  setup:
    - CREATE TABLE s (id INTEGER PRIMARY KEY, parent INTEGER)
  steps:
    - sql: INSERT INTO s VALUES ($1, $2)
      params: [1, null]
      rowcount: 1
    - sql: INSERT INTO s VALUES ($1, $2)
      params: [2, 1]
      rowcount: 1
    - sql: INSERT INTO s VALUES ($1, $2)
      params: [3, 1]
      rowcount: 1
    - sql: SELECT x.id, y.id FROM s x JOIN s y ON x.id = y.parent
      expected: [[1, 2], [1, 3]]
  teardown:
    - DROP TABLE s
