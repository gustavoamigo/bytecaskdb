        - [1, null, null]
        - [2, 2, null]
        - [2, 3, null]
        - [3, null, null]
        - [4, null, null]
    - sql: SELECT a.id, b.id, c.id FROM a LEFT JOIN b ON a.k = b.k LEFT JOIN c ON b.k = c.k WHERE c.id IS NULL
      expected: [[2, 2, null], [2, 3, null], [3, null, null], [4, null, null]]
    - sql: SELECT a.id, b.id, c.id FROM a LEFT JOIN b ON a.k = b.k LEFT JOIN c ON b.k = c.k WHERE b.id IS NULL
      expected: [[3, null, null], [4, null, null]]
    - sql: SELECT a.id, b.id, c.id FROM a LEFT JOIN b ON a.k = b.k LEFT JOIN c ON b.k < c.k
      expected:
