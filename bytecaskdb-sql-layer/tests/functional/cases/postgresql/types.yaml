- name: DECIMAL keeps its scale
  features: [E011-03]
  ordered: true
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v DECIMAL(5,2))
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, "1.5"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, "0.01"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [3, "-999.99"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [4, "100"]
      rowcount: 1
    - sql: SELECT id, v FROM t WHERE id >= $1 ORDER BY id
      params: [0]
      expected: [[1, "1.50"], [2, "0.01"], [3, "-999.99"], [4, "100.00"]]
  teardown:
    - DROP TABLE t

- name: DECIMAL rounds a longer fraction to its scale
  features: [E011-03]
  ordered: true
  setup:
