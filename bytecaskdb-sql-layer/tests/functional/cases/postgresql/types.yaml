- name: TEXT keeps any length and UTF-8
  features: [pg:text-type]
  ordered: true
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v TEXT)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, ""]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, "a longer string with spaces"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [3, "日本語"]
      rowcount: 1
    - sql: SELECT id, v FROM t WHERE id >= $1 ORDER BY id
      params: [0]
      expected: [[1, ""], [2, a longer string with spaces], [3, 日本語]]
  teardown:
    - DROP TABLE t

- name: text compares as bytes (C collation)
  features: [E021-12]
  ordered: true
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v VARCHAR(5))
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, "a"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, "B"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [3, "b"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [4, "A"]
      rowcount: 1
    - sql: SELECT id, v FROM t WHERE id >= $1 ORDER BY v, id
      params: [0]
      # Written by hand: PostgreSQL orders by the database's locale; the layer compares
      # text as bytes (types_design.md, Types), so capital letters come first.
      expected: [[4, A], [2, B], [1, a], [3, b]]
  teardown:
    - DROP TABLE t

- name: BOOLEAN reads back as t and f
  features: [T031]
  ordered: true
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v BOOLEAN)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, "true"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, "false"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [3, null]
      rowcount: 1
    - sql: SELECT id, v FROM t WHERE id >= $1 ORDER BY id
      params: [0]
      expected: [[1, t], [2, f], [3, null]]
  teardown:
    - DROP TABLE t

- name: DATE keeps a day and orders by it
  features: [F051-01]
  ordered: true
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v DATE)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, "2026-10-25"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, "0001-01-01"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [3, "2026-02-28"]
      rowcount: 1
    - sql: SELECT id, v FROM t WHERE id >= $1 ORDER BY v
      params: [0]
      expected: [[2, "0001-01-01"], [3, "2026-02-28"], [1, "2026-10-25"]]
  teardown:
    - DROP TABLE t

