# Types: what each column type keeps, rounds and refuses. Values go in by
# parameter as text, and come back in PostgreSQL's text form.

- name: SMALLINT, INTEGER and BIGINT keep their values
  features: [E011-01]
  ordered: true
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v BIGINT)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, "9223372036854775807"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, "-9223372036854775808"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [3, "0"]
      rowcount: 1
    - sql: SELECT id, v FROM t WHERE id >= $1 ORDER BY id
      params: [0]
      expected: [[1, "9223372036854775807"], [2, "-9223372036854775808"], [3, 0]]
  teardown:
    - DROP TABLE t

- name: an INTEGER column refuses a value past 2147483647
  features: [E011-01]
  ordered: true
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, "2147483647"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, "2147483648"]
      error: "22003"
    - sql: SELECT id, v FROM t WHERE id >= $1 ORDER BY id
      params: [0]
      expected: [[1, 2147483647]]
  teardown:
    - DROP TABLE t

