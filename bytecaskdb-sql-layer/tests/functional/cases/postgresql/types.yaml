      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, "2.994"]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [3, "-1.005"]
      rowcount: 1
    - sql: SELECT id, v FROM t WHERE id >= $1 ORDER BY id
      params: [0]
      expected: [[1, "1.01"], [2, "2.99"], [3, "-1.01"]]
