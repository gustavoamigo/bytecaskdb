# jsonb (docs/jsonb_design.md): stages 1 and 3 build the type, its accessors and casts out; the
# cases of stages 2, 4 and 5 are marked unimplemented until their stage lands. Results recorded from PostgreSQL 17.

- name: "a jsonb column takes any JSON value and returns jsonb_out's text"
  features: [pg:jsonb]
  setup:
    - "CREATE TABLE jb (id INTEGER PRIMARY KEY, j jsonb, s TEXT)"
  steps:
    - sql: "INSERT INTO jb VALUES (1, '{\"aaa\":1,\"b\":2,\"ab\":3,\"B\":4,\"é\":5,\"z\":6}', NULL), (2, '{\"a\":1, \"a\":{\"x\":1}, \"a\":[2]}', NULL), (3, '  [1 , 2,{ \"x\" : [ ] , \"y\":{}} ]  ', NULL), (4, '\"abc\"', NULL), (5, 'null', NULL), (6, 'true', NULL), (7, NULL, NULL)"
      rowcount: 7
    - sql: "SELECT id, j FROM jb ORDER BY id"
      expected:
        - [1, "{\"B\": 4, \"b\": 2, \"z\": 6, \"ab\": 3, \"é\": 5, \"aaa\": 1}"]
        - [2, "{\"a\": [2]}"]
        - [3, "[1, 2, {\"x\": [], \"y\": {}}]"]
        - [4, "\"abc\""]
        - [5, "null"]
        - [6, "true"]
        - [7, null]
      ordered: true
  teardown:
    - "DROP TABLE jb"

- name: "jsonb numbers keep their digits and scale as numeric_out writes them"
  features: [pg:jsonb]
  steps:
    - sql: "SELECT '1.0'::jsonb, '1e2'::jsonb, '1.000e2'::jsonb, '-0'::jsonb, '-0.0'::jsonb, '0.0e-3'::jsonb"
      expected: [["1.0", 100, "100.0", 0, "0.0", "0.0000"]]
    - sql: "SELECT '123456789012345678901234567890.123456789012345678901234567890'::jsonb"
      expected: [["123456789012345678901234567890.123456789012345678901234567890"]]
    - sql: "SELECT '[0.0015, 1E-2, -12.50, 0e131072]'::jsonb"
      expected: [["[0.0015, 0.01, -12.50, 0]"]]

- name: "jsonb strings are de-escaped and written back in jsonb_out's escaping"
  features: [pg:jsonb]
  steps:
    - sql: "SELECT '\"\\u00e9\\ud83d\\ude00 \\/ \\b\\f\\n\\r\\t \\u0001 \\u001f \\u007f \\\"\"'::jsonb"
      expected: [["\"é😀 / \\b\\f\\n\\r\\t \\u0001 \\u001f \x7F \\\"\""]]
    - sql: "SELECT '{\"\\u0062\":1, \"a\":2}'::jsonb"
      expected: [["{\"a\": 2, \"b\": 1}"]]

- name: "jsonb text that is no JSON is 22P02"
  features: [pg:jsonb]
  steps:
    - sql: "SELECT ''::jsonb"
      error: "22P02"
    - sql: "SELECT '[1,2'::jsonb"
      error: "22P02"
    - sql: "SELECT '[1,]'::jsonb"
      error: "22P02"
    - sql: "SELECT '{\"a\":1,}'::jsonb"
      error: "22P02"
    - sql: "SELECT '{1:2}'::jsonb"
      error: "22P02"
    - sql: "SELECT '{\"a\" 1}'::jsonb"
      error: "22P02"
    - sql: "SELECT '{\"a\":1 \"b\":2}'::jsonb"
      error: "22P02"
    - sql: "SELECT '[1 2]'::jsonb"
      error: "22P02"
    - sql: "SELECT '1 2'::jsonb"
      error: "22P02"
    - sql: "SELECT '{a:1}'::jsonb"
      error: "22P02"
    - sql: "SELECT '01'::jsonb"
      error: "22P02"
    - sql: "SELECT '.5'::jsonb"
      error: "22P02"
    - sql: "SELECT '+1'::jsonb"
      error: "22P02"
    - sql: "SELECT 'True'::jsonb"
      error: "22P02"
    - sql: "SELECT 'NaN'::jsonb"
      error: "22P02"
    - sql: "SELECT '\"abc'::jsonb"
      error: "22P02"
    - sql: "SELECT E'\"a\\tb\"'::jsonb"
      error: "22P02"
    - sql: "SELECT '\"\\x\"'::jsonb"
      error: "22P02"
    - sql: "SELECT '\"\\u00zz\"'::jsonb"
      error: "22P02"
    - sql: "SELECT '\"\\ud83d\"'::jsonb"
      error: "22P02"
    - sql: "SELECT '\"\\ude00\"'::jsonb"
      error: "22P02"
    - sql: "SELECT '\"\\ud83d\\ud83d\"'::jsonb"
      error: "22P02"

- name: "jsonb refuses \\u0000 (22P05) and numbers past numeric's range (22003)"
  features: [pg:jsonb]
  steps:
    - sql: "SELECT '\"\\u0000\"'::jsonb"
      error: "22P05"
    - sql: "SELECT '1e131072'::jsonb"
      error: "22003"
    - sql: "SELECT '1e-16384'::jsonb"
      error: "22003"
    - sql: "SELECT char_length('1e131071'::jsonb::text)"
      expected: [[131072]]

- name: "a jsonb parameter is read as jsonb_in reads it"
  features: [pg:jsonb, pg:parameters]
  setup:
    - "CREATE TABLE jb (id INTEGER PRIMARY KEY, j jsonb, s TEXT)"
  steps:
    - sql: "INSERT INTO jb (id, j) VALUES ($1, $2)"
      params: [1, "{\"b\": [1, 2.50], \"a\": null}"]
      rowcount: 1
    - sql: "INSERT INTO jb (id, j) VALUES ($1, $2)"
      params: [2, null]
      rowcount: 1
    - sql: "INSERT INTO jb (id, j) VALUES ($1, $2)"
      params: [3, "[1,"]
      error: "22P02"
    - sql: "UPDATE jb SET j = $1 WHERE id = $2"
      params: ["\"x\"", 2]
      rowcount: 1
    - sql: "SELECT id, j FROM jb ORDER BY id"
      expected: [[1, "{\"a\": null, \"b\": [1, 2.50]}"], [2, "\"x\""]]
      ordered: true
  teardown:
    - "DROP TABLE jb"

- name: "a jsonb DEFAULT and ADD COLUMN ... DEFAULT"
  features: [pg:jsonb]
  steps:
    - sql: "CREATE TABLE jbd (id INTEGER PRIMARY KEY, j jsonb DEFAULT '{\"d\": [1.0]}'::jsonb, k jsonb DEFAULT '[]')"
    - sql: "INSERT INTO jbd (id) VALUES (1)"
      rowcount: 1
    - sql: "INSERT INTO jbd VALUES (2, DEFAULT, 'null')"
      rowcount: 1
    - sql: "ALTER TABLE jbd ADD COLUMN m jsonb NOT NULL DEFAULT '{\"z\":1,\"a\":2}'"
    - sql: "SELECT id, j, k, m FROM jbd ORDER BY id"
      expected:
        - [1, "{\"d\": [1.0]}", "[]", "{\"a\": 2, \"z\": 1}"]
        - [2, "{\"d\": [1.0]}", "null", "{\"a\": 2, \"z\": 1}"]
      ordered: true
    - sql: "CREATE TABLE jbd2 (j jsonb DEFAULT 1)"
      error: "42804"
  teardown:
    - "DROP TABLE jbd"

- name: "jsonb casts with text, and the casts PostgreSQL has not"
  features: [pg:jsonb]
  setup:
    - "CREATE TABLE jb (id INTEGER PRIMARY KEY, j jsonb, s TEXT)"
  steps:
    - sql: "INSERT INTO jb VALUES (1, '{\"b\":1,\"a\":2}', '[1,  \"x\"]'), (2, NULL, 'x')"
      rowcount: 2
    - sql: "SELECT j::text, s::jsonb FROM jb WHERE id = 1"
      expected: [["{\"a\": 2, \"b\": 1}", "[1, \"x\"]"]]
    - sql: "SELECT '{\"b\":1,\"a\":2}'::jsonb::text, '[1, 2]'::text::jsonb"
      expected: [["{\"a\": 2, \"b\": 1}", "[1, 2]"]]
    - sql: "SELECT s::jsonb FROM jb ORDER BY id"
      error: "22P02"
    - sql: "SELECT 1::jsonb"
      error: "42846"
    - sql: "SELECT '1'::jsonb::bytea"
      error: "42846"
    - sql: "SELECT CAST(j AS varchar) FROM jb WHERE id = 1"
      expected: [["{\"a\": 2, \"b\": 1}"]]
  teardown:
    - "DROP TABLE jb"

- name: "a text value assigned to a jsonb column is 42804"
  features: [pg:jsonb]
  setup:
    - "CREATE TABLE jb (id INTEGER PRIMARY KEY, j jsonb, s TEXT)"
  steps:
    - sql: "INSERT INTO jb VALUES (1, NULL, '{}')"
      rowcount: 1
    - sql: "UPDATE jb SET j = s"
      error: "42804"
    - sql: "INSERT INTO jb (id, j) SELECT 2, s FROM jb"
      error: "42804"
    - sql: "INSERT INTO jb (id, j) VALUES (3, 'x'::text)"
      error: "42804"
  teardown:
    - "DROP TABLE jb"

- name: "JSON null is a value, SQL NULL is not; IS NULL, COUNT, CASE and COALESCE"
  features: [pg:jsonb]
  setup:
    - "CREATE TABLE jb (id INTEGER PRIMARY KEY, j jsonb, s TEXT)"
  steps:
    - sql: "INSERT INTO jb VALUES (1, 'null', NULL), (2, NULL, NULL), (3, '[1]', NULL)"
      rowcount: 3
    - sql: "SELECT id, j IS NULL, j IS NOT NULL FROM jb ORDER BY id"
      expected: [[1, f, t], [2, t, f], [3, f, t]]
      ordered: true
    - sql: "SELECT count(j), count(*) FROM jb"
      expected: [[2, 3]]
    - sql: "SELECT COALESCE(j, '{}') FROM jb ORDER BY id"
      expected: [["null"], ["{}"], ["[1]"]]
      ordered: true
    - sql: "SELECT CASE WHEN id = 3 THEN j ELSE '\"other\"'::jsonb END FROM jb ORDER BY id"
      expected: [["\"other\""], ["\"other\""], ["[1]"]]
      ordered: true
    - sql: "SELECT 'null'::jsonb IS NULL"
      expected: [[f]]
  teardown:
    - "DROP TABLE jb"

- name: "a view, CREATE TABLE AS and UNION ALL carry a jsonb column"
  features: [pg:jsonb]
  setup:
    - "CREATE TABLE jb (id INTEGER PRIMARY KEY, j jsonb, s TEXT)"
  steps:
    - sql: "INSERT INTO jb VALUES (1, '{\"a\": 1}', NULL), (2, '[true]', NULL)"
      rowcount: 2
    - sql: "CREATE VIEW jbv AS SELECT id, j FROM jb"
    - sql: "SELECT j FROM jbv WHERE id = 2"
      expected: [["[true]"]]
    - sql: "CREATE TABLE jbc AS SELECT id, j FROM jb"
      rowcount: 2
    - sql: "SELECT id, j FROM jbc ORDER BY id"
      expected: [[1, "{\"a\": 1}"], [2, "[true]"]]
      ordered: true
    - sql: "SELECT j FROM jb WHERE id = 1 UNION ALL SELECT j FROM jb WHERE id = 2"
      expected: [["[true]"], ["{\"a\": 1}"]]
  teardown:
    - "DROP VIEW jbv"
    - "DROP TABLE jbc"
    - "DROP TABLE jb"

- name: "jsonb has no arithmetic, MIN, MAX or SUM (42883)"
  features: [pg:jsonb]
  setup:
    - "CREATE TABLE jb (id INTEGER PRIMARY KEY, j jsonb, s TEXT)"
  steps:
    - sql: "INSERT INTO jb VALUES (1, '1', NULL)"
      rowcount: 1
    - sql: "SELECT j + 1 FROM jb"
      error: "42883"
    - sql: "SELECT max(j) FROM jb"
      error: "42883"
    - sql: "SELECT sum(j) FROM jb"
      error: "42883"
    - sql: "SELECT id FROM jb WHERE j = 1"
      error: "42883"
  teardown:
    - "DROP TABLE jb"

- name: "jsonb equality is structural, with numeric equality"
  features: [pg:jsonb]
  # jsonb does not compare, order or group yet (stage 2 of docs/jsonb_design.md, 0A000)
  unimplemented: true
  steps:
    - sql: "SELECT '1.0'::jsonb = '1', '-0'::jsonb = '0', '{\"a\":1,\"b\":2}'::jsonb = '{\"b\":2,\"a\":1}', '[1,2]'::jsonb = '[2,1]'"
      expected: [[t, t, t, f]]
    - sql: "SELECT '[]'::jsonb < 'null', '[]'::jsonb < '{}', '\"z\"'::jsonb < '[]', '[9]'::jsonb < '[1,1]'"
      expected: [[t, t, f, t]]

- name: "jsonb orders as PostgreSQL's jsonb_ops in a C database"
  features: [pg:jsonb]
  # jsonb does not compare, order or group yet (stage 2 of docs/jsonb_design.md, 0A000)
  unimplemented: true
  setup:
    - "CREATE TABLE jb (id INTEGER PRIMARY KEY, j jsonb, s TEXT)"
  steps:
    - sql: "INSERT INTO jb (id, j) VALUES (1, '{\"b\": 1, \"c\": 1}'), (2, '[]'), (3, 'true'), (4, '\"a\"'), (5, '1.00'), (6, 'null'), (7, '[1, 2]'), (8, '{}'), (9, '-1'), (10, '[null]')"
      rowcount: 10
    - sql: "SELECT j FROM jb ORDER BY j, id"
      expected:
        - ["[]"]
        - ["null"]
        - ["\"a\""]
        - [-1]
        - ["1.00"]
        - ["true"]
        - ["[null]"]
        - ["[1, 2]"]
        - ["{}"]
        - ["{\"b\": 1, \"c\": 1}"]
      ordered: true
    - sql: "SELECT id FROM jb WHERE j = '1' ORDER BY id"
      expected: [[5]]
      ordered: true
  teardown:
    - "DROP TABLE jb"

- name: "GROUP BY and DISTINCT merge equal jsonb values"
  features: [pg:jsonb]
  # jsonb does not compare, order or group yet (stage 2 of docs/jsonb_design.md, 0A000)
  unimplemented: true
  setup:
    - "CREATE TABLE jb (id INTEGER PRIMARY KEY, j jsonb, s TEXT)"
  steps:
    - sql: "INSERT INTO jb (id, j) VALUES (1, '1'), (2, '1.0'), (3, '\"x\"')"
      rowcount: 3
    - sql: "SELECT count(*) FROM jb GROUP BY j ORDER BY 1"
      expected: [[1], [2]]
      ordered: true
    - sql: "SELECT count(DISTINCT j) FROM jb"
      expected: [[2]]
  teardown:
    - "DROP TABLE jb"

- name: "a jsonb primary key"
  features: [pg:jsonb]
  # a jsonb key, unique or index column is the next phase of docs/jsonb_design.md (0A000)
  unimplemented: true
  steps:
    - sql: "CREATE TABLE jbk (j jsonb PRIMARY KEY)"
    - sql: "INSERT INTO jbk VALUES ('1')"
      rowcount: 1
    - sql: "INSERT INTO jbk VALUES ('1.0')"
      error: "23505"
  teardown:
    - "DROP TABLE IF EXISTS jbk"

- name: "-> and ->> by key and by index, on objects, arrays and scalars"
  features: [pg:jsonb]
  steps:
    - sql: "SELECT '{\"a\": {\"b\": [1, \"x\"]}}'::jsonb -> 'a', '{\"a\": {\"b\": [1, \"x\"]}}'::jsonb -> 'a' -> 'b' ->> 1"
      expected: [["{\"b\": [1, \"x\"]}", x]]
    - sql: "SELECT '[1,2,3]'::jsonb -> -1, '[1,2,3]'::jsonb -> 3, '1'::jsonb -> 0, '\"abc\"'::jsonb ->> 0, '{\"a\":null}'::jsonb ->> 'a'"
      expected: [[3, null, 1, abc, null]]
    - sql: "SELECT ('{\"a\":1}'::jsonb -> 'a') -> 0, '[1,2]'::jsonb -> 1::smallint"
      expected: [[1, 2]]

- name: "#> and #>> with a text[] path"
  features: [pg:jsonb]
  steps:
    - sql: "SELECT '{\"a\":{\"b\":[1,2]}}'::jsonb #> '{a,b,1}', '{\"a\":{\"b\":[1,2]}}'::jsonb #>> '{a,b}', '\"x\"'::jsonb #>> '{}', '1'::jsonb #> '{0}'"
      expected: [[2, "[1, 2]", x, null]]

- name: "jsonb_typeof, jsonb_array_length and the casts to boolean and numbers"
  features: [pg:jsonb]
  steps:
    - sql: "SELECT jsonb_typeof('[]'), jsonb_typeof('1.5'), jsonb_typeof('null'), jsonb_array_length('[1,[2],3]')"
      expected: [[array, number, "null", 3]]
    - sql: "SELECT jsonb_array_length('{}')"
      error: "22023"
    - sql: "SELECT '1.5'::jsonb::integer, '-2.5'::jsonb::bigint, 'true'::jsonb::boolean, '1.50'::jsonb::numeric, '1e2'::jsonb::float8"
      expected: [[2, -3, t, "1.50", 100]]
    - sql: "SELECT '\"x\"'::jsonb::integer"
      error: "22023"

- name: "@>, <@, ?, ?| and ?&"
  features: [pg:jsonb]
  # jsonb's containment, existence, modification and constructors are stage 4 of docs/jsonb_design.md (0A000)
  unimplemented: true
  steps:
    - sql: "SELECT '{\"a\":[1,2],\"b\":1}'::jsonb @> '{\"a\":[2]}', '[1,2]'::jsonb <@ '[1,2,3]', '[1]'::jsonb @> '1'"
      expected: [[t, t, t]]
    - sql: "SELECT '{\"a\":1}'::jsonb ? 'a', '[\"a\"]'::jsonb ? 'a', '{\"a\":1}'::jsonb ?| '{a,b}', '{\"a\":1}'::jsonb ?& '{a,b}'"
      expected: [[t, t, t, f]]

- name: "||, - and #- modify a value"
  features: [pg:jsonb]
  # jsonb's containment, existence, modification and constructors are stage 4 of docs/jsonb_design.md (0A000)
  unimplemented: true
  steps:
    - sql: "SELECT '{\"a\":1}'::jsonb || '{\"b\":2}', '[1]'::jsonb || '2', '{\"a\":1,\"b\":2}'::jsonb - 'a', '[1,2,3]'::jsonb - 1, '{\"a\":{\"b\":1}}'::jsonb #- '{a,b}'"
      expected: [["{\"a\": 1, \"b\": 2}", "[1, 2]", "{\"b\": 2}", "[1, 3]", "{\"a\": {}}"]]
    - sql: "SELECT '1'::jsonb - 'a'"
      error: "22023"

- name: "|| of a jsonb and a typed text is text concatenation"
  features: [pg:jsonb]
  steps:
    - sql: "SELECT '{\"a\":1}'::jsonb || 'x'::text, 'x'::text || '[1, 2]'::jsonb"
      expected: [["{\"a\": 1}x", "x[1, 2]"]]

- name: "jsonb_set, jsonb_insert and the builders"
  features: [pg:jsonb]
  # jsonb's containment, existence, modification and constructors are stage 4 of docs/jsonb_design.md (0A000)
  unimplemented: true
  steps:
    - sql: "SELECT jsonb_set('{\"a\":[1,2]}', '{a,0}', '9'), jsonb_insert('[1,2]', '{0}', '0'), jsonb_set('{}', '{a}', NULL)"
      expected: [["{\"a\": [9, 2]}", "[0, 1, 2]", null]]
    - sql: "SELECT jsonb_build_object('a', 1, 'b', 'x'), jsonb_build_array(1, 'x', NULL), to_jsonb(1.50::numeric), to_jsonb('NaN'::float8)"
      expected: [["{\"a\": 1, \"b\": \"x\"}", "[1, \"x\", null]", "1.50", "\"NaN\""]]
    - sql: "SELECT jsonb_build_array(1.5::numeric(10,2), 2::numeric(5,0)), jsonb_strip_nulls('{\"a\":null,\"b\":1}')"
      expected: [["[1.50, 2]", "{\"b\": 1}"]]

- name: "jsonb_agg and jsonb_object_agg"
  features: [pg:jsonb]
  # the jsonb aggregates are stage 5 of docs/jsonb_design.md (0A000)
  unimplemented: true
  setup:
    - "CREATE TABLE jb (id INTEGER PRIMARY KEY, j jsonb, s TEXT)"
  steps:
    - sql: "INSERT INTO jb VALUES (1, '1', 'a'), (2, NULL, 'b'), (3, '[2]', 'a')"
      rowcount: 3
    - sql: "SELECT jsonb_agg(j ORDER BY id) FROM jb"
      expected: [["[1, null, [2]]"]]
    - sql: "SELECT jsonb_object_agg(s, j ORDER BY id) FROM jb"
      expected: [["{\"a\": [2], \"b\": null}"]]
    - sql: "SELECT COALESCE(jsonb_agg(j) FILTER (WHERE j IS NOT NULL AND id > 9), '[]') FROM jb"
      expected: [["[]"]]
  teardown:
    - "DROP TABLE jb"

- name: "the accessors resolve their right operand as PostgreSQL 17"
  features: [pg:jsonb]
  steps:
    - sql: "SELECT '{\"a\":1}'::jsonb -> 'a'::varchar, '{\"1\":5}'::jsonb -> '1', '[1,2]'::jsonb -> NULL"
      expected: [[1, 5, null]]
    - sql: "SELECT '[1,2]'::jsonb -> 1::bigint"
      error: "42883"
    - sql: "SELECT '[1,2]'::jsonb -> 1.5"
      error: "42883"
    - sql: "SELECT '{}' -> 'a'"
      error: "42725"
    - sql: "SELECT '{\"a\":1}'::jsonb -> 'a' - 'b'"
      error: "42725"
    - sql: "SELECT '{\"a\":1}'::jsonb ->> 'a'::int"
      error: "22P02"
    - sql: "SELECT 'x'::text -> 'a'"
      error: "42883"

- name: "a path is read as array_in reads a text[]"
  features: [pg:jsonb]
  steps:
    - sql: "SELECT '{\"a\":{\"b\":1}}'::jsonb #> '{{a},{b}}', '{\"a b\":1}'::jsonb #> '{ a b }', '{\"a\":{\"b\":[1,2]}}'::jsonb #> '[1:2]={a,b}', '{\"a\":1}'::jsonb #> ARRAY['a'], '{\"a\":1}'::jsonb #> ARRAY['a', NULL]"
      expected: [[1, 1, "[1, 2]", 1, null]]
    - sql: "SELECT '[1]'::jsonb #> 'a'"
      error: "22P02"
    - sql: "SELECT '[1]'::jsonb #> '{{a,b},{c}}'"
      error: "22P02"
    - sql: "SELECT '[1]'::jsonb #> '{{{{{{{a}}}}}}}'"
      error: "54000"
    - sql: "SELECT '[1]'::jsonb #> '[3:1]={a,b}'"
      error: "2202E"
    - sql: "SELECT '[1]'::jsonb #> ARRAY[1]"
      error: "42883"

- name: "the accessors over columns, in the select list, WHERE, ORDER BY and aggregates"
  features: [pg:jsonb]
  setup:
    - "CREATE TABLE jb (id INTEGER PRIMARY KEY, j jsonb, s TEXT)"
  steps:
    - sql: "INSERT INTO jb VALUES (1, '{\"k\": \"v\", \"n\": [1, 2.5]}', 'k'), (2, '[3, 4]', 'n'), (3, NULL, 'k'), (4, '{\"k\": \"w\", \"n\": []}', 'n')"
      rowcount: 4
    - sql: "SELECT id, j ->> s, j #> '{n,1}', jsonb_typeof(j) FROM jb ORDER BY id"
      expected: [[1, v, 2.5, object], [2, null, null, array], [3, null, null, null], [4, "[]", null, object]]
      ordered: true
    - sql: "SELECT id FROM jb WHERE j ->> 'k' = 'w'"
      expected: [[4]]
    - sql: "SELECT id FROM jb ORDER BY j ->> 'k' DESC, id"
      expected: [[2], [3], [4], [1]]
      ordered: true
    - sql: "SELECT sum((j -> 0)::integer), count(j -> 'k') FROM jb"
      expected: [[3, 2]]
    - sql: "SELECT (j -> 'n' -> 1)::numeric, (j -> 'n' -> 1)::float8, (j -> 'n' -> 1)::integer FROM jb WHERE id = 1"
      expected: [["2.5", 2.5, 3]]
    - sql: "SELECT jsonb_array_length(j) FROM jb"
      error: "22023"
  teardown:
    - "DROP TABLE jb"
