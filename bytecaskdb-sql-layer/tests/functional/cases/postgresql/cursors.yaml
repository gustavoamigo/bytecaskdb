    - INSERT INTO t VALUES (4, 40)
  steps:
    - sql: BEGIN
    - sql: DECLARE c CURSOR FOR SELECT id FROM t ORDER BY id
    - sql: MOVE 2 IN c
      rowcount: 2
    - sql: FETCH c
      expected: [[3]]
      ordered: true
    - sql: MOVE FORWARD ALL IN c
      rowcount: 1
    - sql: MOVE c
      rowcount: 0
    - sql: FETCH c
      expected: []
    - sql: COMMIT
  teardown:
    - ROLLBACK
    - DROP TABLE t

- name: two cursors are read in turn
  features: [E121-01, pg:fetch-move]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
    - INSERT INTO t VALUES (1, 10)
    - INSERT INTO t VALUES (2, 20)
    - INSERT INTO t VALUES (3, 30)
  steps:
    - sql: BEGIN
    - sql: DECLARE a CURSOR FOR SELECT id FROM t ORDER BY id
    - sql: DECLARE b CURSOR FOR SELECT v FROM t ORDER BY id DESC
    - sql: FETCH a
      expected: [[1]]
      ordered: true
    - sql: FETCH b
      expected: [[30]]
      ordered: true
    - sql: FETCH 2 a
      expected: [[2], [3]]
      ordered: true
    - sql: FETCH a
      expected: []
    - sql: FETCH ALL b
      expected: [[20], [10]]
      ordered: true
    - sql: COMMIT
  teardown:
    - ROLLBACK
    - DROP TABLE t

- name: a cursor does not see writes made after DECLARE
  features: [E121-01, pg:cursor-lifetime]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
    - INSERT INTO t VALUES (1, 10)
    - INSERT INTO t VALUES (2, 20)
    - INSERT INTO t VALUES (3, 30)
  steps:
    - sql: BEGIN
    - sql: INSERT INTO t VALUES (0, 5)
      rowcount: 1
    - sql: DECLARE c CURSOR FOR SELECT id, v FROM t ORDER BY id
    - sql: UPDATE t SET v = 99 WHERE id = 1
      rowcount: 1
    - sql: DELETE FROM t WHERE id = 2
      rowcount: 1
    - sql: INSERT INTO t VALUES (4, 40)
      rowcount: 1
    - sql: FETCH 2 FROM c
      expected: [[0, 5], [1, 10]]
      ordered: true
    - sql: DELETE FROM t
      rowcount: 4
    - sql: FETCH ALL FROM c
      expected: [[2, 20], [3, 30]]
      ordered: true
    - sql: SELECT id FROM t
      expected: []
    - sql: COMMIT
  teardown:
    - ROLLBACK
    - DROP TABLE t

- name: a cursor is closed by COMMIT
  features: [pg:cursor-lifetime]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
    - INSERT INTO t VALUES (1, 10)
  steps:
    - sql: BEGIN
    - sql: DECLARE c CURSOR FOR SELECT id FROM t
    - sql: COMMIT
    - sql: FETCH c
      error: "34000"
    - sql: BEGIN
    - sql: DECLARE c CURSOR FOR SELECT id FROM t
    - sql: FETCH c
      expected: [[1]]
    - sql: COMMIT
  teardown:
    - ROLLBACK
    - DROP TABLE t

- name: a cursor is closed by ROLLBACK
