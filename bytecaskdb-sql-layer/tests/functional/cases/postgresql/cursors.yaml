      expected: [[3]]
      ordered: true
    - sql: FETCH BACKWARD 0 FROM c
      expected: [[3]]
      ordered: true
    - sql: FETCH FIRST FROM c
      expected: [[1]]
      ordered: true
    - sql: FETCH 0 FROM c
      expected: [[1]]
      ordered: true
    - sql: FETCH BACKWARD 0 FROM c
      expected: [[1]]
      ordered: true
