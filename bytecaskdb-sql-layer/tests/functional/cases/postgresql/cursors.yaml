    - sql: DECLARE c NO SCROLL CURSOR FOR SELECT id FROM t ORDER BY id
    - sql: FETCH 2 FROM c
      expected: [[1], [2]]
      ordered: true
    - sql: FETCH PRIOR FROM c
      error: "55000"
    - sql: ROLLBACK
  teardown:
    - ROLLBACK
    - DROP TABLE t

