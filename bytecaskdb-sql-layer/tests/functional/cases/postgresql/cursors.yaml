    - ROLLBACK
    - DROP TABLE t

- name: CLOSE a cursor, CLOSE ALL, and an unknown name
  features: [E121-08, pg:cursor-lifetime]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
    - INSERT INTO t VALUES (1, 10)
  steps:
    - sql: BEGIN
    - sql: DECLARE a CURSOR FOR SELECT id FROM t
    - sql: DECLARE b CURSOR FOR SELECT id FROM t
    - sql: CLOSE a
    - sql: DECLARE a CURSOR FOR SELECT v FROM t
    - sql: FETCH a
      expected: [[10]]
    - sql: CLOSE ALL
    - sql: CLOSE ALL
    - sql: CLOSE b
      error: "34000"
    - sql: ROLLBACK
  teardown:
    - ROLLBACK
    - DROP TABLE t

- name: a name in use is 42P03, and the transaction is then aborted
  features: [pg:cursor-lifetime]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
    - INSERT INTO t VALUES (1, 10)
  steps:
    - sql: BEGIN
    - sql: DECLARE c CURSOR FOR SELECT id FROM t
    - sql: DECLARE c CURSOR FOR SELECT v FROM t
      error: "42P03"
    - sql: FETCH c
      error: "25P02"
    - sql: DECLARE d CURSOR FOR SELECT id FROM t
      error: "25P02"
    - sql: CLOSE c
      error: "25P02"
    - sql: ROLLBACK
  teardown:
    - ROLLBACK
    - DROP TABLE t

# Known difference from PostgreSQL (owner decision 2026-10-28, #720;
# docs/cursor_design.md, *Known differences from PostgreSQL*): PostgreSQL
# says 25P01 to a DECLARE outside a transaction block. The layer accepts it as
# a WITH HOLD cursor, taken on the snapshot of that moment, so this case's
# expected values are the layer's and were not recorded from PostgreSQL.

- name: DECLARE outside a transaction block is a hold cursor (known difference, PostgreSQL says 25P01)
  features: [E121-01, E121-17, pg:cursor-lifetime]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
    - INSERT INTO t VALUES (1, 10)
    - INSERT INTO t VALUES (2, 20)
  steps:
    - sql: DECLARE c CURSOR FOR SELECT id FROM t ORDER BY id
    - sql: FETCH c
      expected: [[1]]
      ordered: true
    - sql: INSERT INTO t VALUES (3, 30)
      rowcount: 1
    - sql: FETCH ALL c
      expected: [[2]]
      ordered: true
    - sql: CLOSE c
    - sql: FETCH c
      error: "34000"
    - sql: DECLARE d CURSOR WITHOUT HOLD FOR SELECT id FROM t ORDER BY id FOR UPDATE
    - sql: FETCH d
      expected: [[1]]
      ordered: true
    - sql: CLOSE d
  teardown:
    - ROLLBACK
    - DROP TABLE t

- name: a failed FETCH or DECLARE aborts the block
  features: [pg:cursor-lifetime]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: BEGIN
    - sql: FETCH nothing
      error: "34000"
    - sql: SELECT id FROM t
      error: "25P02"
    - sql: ROLLBACK
    - sql: BEGIN
    - sql: DECLARE c CURSOR FOR SELECT id FROM nope
      error: "42P01"
    - sql: FETCH c
      error: "25P02"
    - sql: ROLLBACK
  teardown:
    - ROLLBACK
    - DROP TABLE t

- name: FOR READ ONLY, FOR UPDATE and SCROLL options
