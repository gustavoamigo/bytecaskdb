    - sql: DECLARE b NO SCROLL CURSOR FOR SELECT id FROM t ORDER BY id FOR UPDATE
    - sql: DECLARE c CURSOR FOR SELECT id FROM t ORDER BY id FOR UPDATE OF t
    - sql: FETCH a
      expected: [[1]]
    - sql: FETCH b
      expected: [[1]]
    - sql: FETCH c
      expected: [[1]]
