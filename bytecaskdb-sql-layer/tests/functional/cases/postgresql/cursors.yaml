# Cursors inside a transaction block (docs/cursor_design.md): DECLARE, FETCH,
# MOVE and CLOSE, every FETCH direction, SCROLL and NO SCROLL, WITH HOLD, and
# UPDATE and DELETE ... WHERE CURRENT OF. Recorded from PostgreSQL 16 (the only
# server at hand); the arithmetic and the errors they pin are the same in 17.
# The WHERE CURRENT OF cursors order by the primary key: PostgreSQL updates a
# cursor through an index scan, and refuses one that sorts (the layer allows it).

- name: DECLARE, FETCH forward and CLOSE
  features: [E121-01, E121-08, pg:fetch-move]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
    - INSERT INTO t VALUES (1, 10)
    - INSERT INTO t VALUES (2, 20)
    - INSERT INTO t VALUES (3, 30)
    - INSERT INTO t VALUES (4, 40)
    - INSERT INTO t VALUES (5, 50)
  steps:
    - sql: BEGIN
    - sql: DECLARE c CURSOR FOR SELECT id, v FROM t ORDER BY id
    - sql: FETCH c
      expected: [[1, 10]]
      ordered: true
    - sql: FETCH NEXT FROM c
      expected: [[2, 20]]
      ordered: true
    - sql: FETCH 2 IN c
      expected: [[3, 30], [4, 40]]
      ordered: true
    - sql: FETCH FORWARD 1 c
      expected: [[5, 50]]
      ordered: true
    - sql: FETCH c
      expected: []
      ordered: true
    - sql: FETCH ALL FROM c
      expected: []
      ordered: true
    - sql: CLOSE c
    - sql: COMMIT
  teardown:
    - ROLLBACK
    - DROP TABLE t

- name: FETCH ALL, and a FETCH past the end returns no row
  features: [E121-01, pg:fetch-move]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
    - INSERT INTO t VALUES (1, 10)
    - INSERT INTO t VALUES (2, 20)
    - INSERT INTO t VALUES (3, 30)
  steps:
    - sql: BEGIN
    - sql: DECLARE c CURSOR FOR SELECT id FROM t ORDER BY id
    - sql: FETCH 2 FROM c
      expected: [[1], [2]]
      ordered: true
    - sql: FETCH FORWARD ALL FROM c
      expected: [[3]]
      ordered: true
    - sql: FETCH 5 FROM c
      expected: []
    - sql: FETCH c
      expected: []
    - sql: FETCH ALL c
      expected: []
    - sql: COMMIT
  teardown:
    - ROLLBACK
    - DROP TABLE t

- name: MOVE skips rows and reports how many
  features: [pg:fetch-move]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
    - INSERT INTO t VALUES (1, 10)
    - INSERT INTO t VALUES (2, 20)
