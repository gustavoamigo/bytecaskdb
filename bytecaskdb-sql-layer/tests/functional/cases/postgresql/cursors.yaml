    - sql: FETCH 3 FROM c
      expected: [[1], [2], [3]]
      ordered: true
    - sql: FETCH FORWARD -1 FROM c
      expected: [[2]]
      ordered: true
    - sql: FETCH BACKWARD -2 FROM c
      expected: [[3], [4]]
      ordered: true
    - sql: FETCH -1 FROM c
      expected: [[3]]
      ordered: true
    - sql: FETCH 0 FROM c
      expected: [[3]]
