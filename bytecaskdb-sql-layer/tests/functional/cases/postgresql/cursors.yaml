- name: WHERE CURRENT OF names the cursor's own table, and a simple scan of it
  features: [E121-06, E121-07, pg:where-current-of]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
    - CREATE TABLE u (id INTEGER PRIMARY KEY, v INTEGER)
    - INSERT INTO t VALUES (1, 10)
    - INSERT INTO t VALUES (2, 10)
    - INSERT INTO u VALUES (1, 5)
  steps:
    - sql: BEGIN
    - sql: DECLARE c CURSOR FOR SELECT id, v FROM t ORDER BY id
    - sql: FETCH c
      expected: [[1, 10]]
      ordered: true
    - sql: UPDATE u SET v = 0 WHERE CURRENT OF c
      error: "24000"
    - sql: ROLLBACK
    - sql: BEGIN
    - sql: DECLARE c CURSOR FOR SELECT t.id, u.v FROM t JOIN u ON t.id = u.id
    - sql: FETCH c
      expected: [[1, 5]]
      ordered: true
    - sql: UPDATE t SET v = 0 WHERE CURRENT OF c
      error: "24000"
    - sql: ROLLBACK
    - sql: BEGIN
    - sql: DECLARE c CURSOR FOR SELECT v, COUNT(*) FROM t GROUP BY v
    - sql: FETCH c
      expected: [[10, 2]]
      ordered: true
    - sql: DELETE FROM t WHERE CURRENT OF c
      error: "24000"
    - sql: ROLLBACK
    - sql: BEGIN
    - sql: DECLARE c CURSOR FOR SELECT DISTINCT v FROM t
    - sql: FETCH c
      expected: [[10]]
      ordered: true
    - sql: DELETE FROM t WHERE CURRENT OF c
      error: "24000"
    - sql: ROLLBACK
    - sql: BEGIN
    - sql: DECLARE c CURSOR FOR SELECT id FROM t UNION ALL SELECT id FROM u
    - sql: FETCH c
      expected: [[1]]
    - sql: DELETE FROM t WHERE CURRENT OF c
      error: "24000"
    - sql: ROLLBACK
    - sql: SELECT id, v FROM t ORDER BY id
      expected: [[1, 10], [2, 10]]
      ordered: true
  teardown:
    - ROLLBACK
    - DROP TABLE t
    - DROP TABLE u

- name: WHERE CURRENT OF on a composite key and on a table with no primary key
  features: [E121-06, E121-07, pg:where-current-of]
  setup:
    - CREATE TABLE k (a INTEGER, b VARCHAR(5), v INTEGER, PRIMARY KEY (a, b))
    - INSERT INTO k VALUES (1, 'x', 0)
    - INSERT INTO k VALUES (1, 'y', 0)
    - INSERT INTO k VALUES (2, 'x', 0)
    - CREATE TABLE n (a INTEGER, v INTEGER)
    - INSERT INTO n VALUES (1, 0)
    - INSERT INTO n VALUES (1, 0)
    - INSERT INTO n VALUES (1, 0)
  steps:
    - sql: BEGIN
    - sql: DECLARE c CURSOR FOR SELECT a, b FROM k ORDER BY a, b
    - sql: FETCH 2 FROM c
      expected: [[1, x], [1, y]]
      ordered: true
    - sql: UPDATE k SET v = 1 WHERE CURRENT OF c
      rowcount: 1
    - sql: DECLARE d CURSOR FOR SELECT a, v FROM n
    - sql: FETCH 2 FROM d
      expected: [[1, 0], [1, 0]]
      ordered: true
    - sql: UPDATE n SET v = 1 WHERE CURRENT OF d
      rowcount: 1
    - sql: SELECT a, b, v FROM k ORDER BY a, b
      expected: [[1, x, 0], [1, y, 1], [2, x, 0]]
      ordered: true
    - sql: SELECT COUNT(*), SUM(v) FROM n
      expected: [[3, 1]]
    - sql: DELETE FROM n WHERE CURRENT OF d
      rowcount: 1
    - sql: SELECT COUNT(*), SUM(v) FROM n
      expected: [[2, 0]]
    - sql: COMMIT
  teardown:
    - ROLLBACK
    - DROP TABLE k
    - DROP TABLE n

- name: WHERE CURRENT OF through a FOR UPDATE cursor
  features: [E121-06, E121-07, pg:where-current-of]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
    - INSERT INTO t VALUES (1, 10)
    - INSERT INTO t VALUES (2, 20)
    - INSERT INTO t VALUES (3, 30)
  steps:
    - sql: BEGIN
    - sql: DECLARE c CURSOR FOR SELECT id, v FROM t WHERE v > 10 ORDER BY id FOR UPDATE
    - sql: FETCH c
      expected: [[2, 20]]
      ordered: true
    - sql: UPDATE t SET v = 0 WHERE CURRENT OF c
      rowcount: 1
    - sql: FETCH c
      expected: [[3, 30]]
      ordered: true
    - sql: DELETE FROM t WHERE CURRENT OF c
      rowcount: 1
    - sql: COMMIT
    - sql: SELECT id, v FROM t ORDER BY id
      expected: [[1, 10], [2, 0]]
      ordered: true
  teardown:
    - ROLLBACK
    - DROP TABLE t

- name: WHERE CURRENT OF through a WITH HOLD cursor, in its own transaction and after it
  features: [E121-06, E121-17, pg:where-current-of]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
    - INSERT INTO t VALUES (1, 10)
    - INSERT INTO t VALUES (2, 20)
  steps:
    - sql: BEGIN
    - sql: DECLARE h CURSOR WITH HOLD FOR SELECT id, v FROM t ORDER BY id
    - sql: FETCH h
      expected: [[1, 10]]
      ordered: true
    - sql: UPDATE t SET v = 11 WHERE CURRENT OF h
      rowcount: 1
    - sql: COMMIT
    - sql: FETCH h
      expected: [[2, 20]]
      ordered: true
    - sql: BEGIN
    - sql: UPDATE t SET v = 22 WHERE CURRENT OF h
      error: "24000"
    - sql: ROLLBACK
    - sql: CLOSE h
    - sql: SELECT id, v FROM t ORDER BY id
      expected: [[1, 11], [2, 20]]
      ordered: true
  teardown:
    - ROLLBACK
    - DROP TABLE t
