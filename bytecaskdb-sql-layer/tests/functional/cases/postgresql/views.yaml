# Views: CREATE VIEW and DROP VIEW, read like a table in FROM. A view is its
# query, read again at each use. INSERT writes through a simple view; a query
# that aggregates over a grouped view reads its groups as rows. UPDATE and
# DELETE through a view, and WITH CHECK OPTION, are not built.

- name: a view reads its table's rows as they are when it is read
  features: [F031-02]
  ordered: true
  setup:
    - CREATE TABLE vw1 (id INTEGER PRIMARY KEY, v INTEGER, w TEXT)
    - CREATE VIEW vw1_big AS SELECT id, v AS value, w FROM vw1 WHERE v > 10
  steps:
    - sql: INSERT INTO vw1 VALUES ($1, $2, $3)
      params: [1, 10, "a"]
      rowcount: 1
    - sql: INSERT INTO vw1 VALUES ($1, $2, $3)
      params: [2, 20, "b"]
      rowcount: 1
    - sql: SELECT * FROM vw1_big
      expected: [[2, 20, "b"]]
    - sql: INSERT INTO vw1 VALUES ($1, $2, $3)
      params: [3, 30, "c"]
      rowcount: 1
    - sql: SELECT value, id FROM vw1_big WHERE id >= 2 ORDER BY value DESC
      expected: [[30, 3], [20, 2]]
    - sql: SELECT id FROM vw1_big WHERE w = 'c' OR value = 20 ORDER BY id
      expected: [[2], [3]]
    - sql: SELECT COUNT(*) FROM vw1_big
      expected: [[2]]
    - sql: SELECT x.value FROM vw1_big AS x WHERE x.id = 3
      expected: [[30]]
    # the view's columns are its own names: the table's v is not one of them
    - sql: SELECT v FROM vw1_big
      error: "42703"
  teardown:
    - DROP VIEW vw1_big
    - DROP TABLE vw1

- name: a view takes a column list, and a view can be read through another
  features: [F031-02]
  ordered: true
  setup:
    - CREATE TABLE vw2 (id INTEGER PRIMARY KEY, v INTEGER)
    - CREATE VIEW vw2_a (k, n) AS SELECT id, v FROM vw2
    - CREATE VIEW vw2_b AS SELECT n AS m FROM vw2_a WHERE k < 3
  steps:
    - sql: INSERT INTO vw2 VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: INSERT INTO vw2 VALUES ($1, $2)
      params: [2, 20]
      rowcount: 1
    - sql: INSERT INTO vw2 VALUES ($1, $2)
      params: [3, 30]
      rowcount: 1
    - sql: SELECT k, n FROM vw2_a WHERE n >= 20 ORDER BY k
      expected: [[2, 20], [3, 30]]
    - sql: SELECT m FROM vw2_b ORDER BY m
      expected: [[10], [20]]
    - sql: SELECT id FROM vw2_a
      error: "42703"
    - sql: CREATE VIEW vw2_c (a, b, c) AS SELECT id, v FROM vw2
      error: "42601"
    - sql: CREATE VIEW vw2_c (a, a) AS SELECT id, v FROM vw2
      error: "42701"
  teardown:
    - DROP VIEW vw2_b
    - DROP VIEW vw2_a
    - DROP TABLE vw2

- name: a view in a join and in a subquery
  features: [F031-02, F041-01]
  ordered: true
  setup:
    - CREATE TABLE vw3 (id INTEGER PRIMARY KEY, v INTEGER)
    - CREATE TABLE vw3_o (id INTEGER PRIMARY KEY, c INTEGER)
    - CREATE VIEW vw3_v AS SELECT id, v FROM vw3 WHERE v > 10
  steps:
    - sql: INSERT INTO vw3 VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: INSERT INTO vw3 VALUES ($1, $2)
      params: [2, 20]
      rowcount: 1
    - sql: INSERT INTO vw3 VALUES ($1, $2)
      params: [3, 30]
      rowcount: 1
    - sql: INSERT INTO vw3_o VALUES ($1, $2)
      params: [2, 200]
      rowcount: 1
    - sql: INSERT INTO vw3_o VALUES ($1, $2)
      params: [3, 300]
      rowcount: 1
    - sql: INSERT INTO vw3_o VALUES ($1, $2)
      params: [4, 400]
      rowcount: 1
    - sql: SELECT vw3_v.v, vw3_o.c FROM vw3_v JOIN vw3_o ON vw3_v.id = vw3_o.id ORDER BY vw3_o.c
      expected: [[20, 200], [30, 300]]
    - sql: SELECT * FROM vw3_o JOIN vw3_v ON vw3_o.id = vw3_v.id ORDER BY vw3_o.id
      expected: [[2, 200, 2, 20], [3, 300, 3, 30]]
    - sql: SELECT c FROM vw3_o WHERE id IN (SELECT id FROM vw3_v) ORDER BY c
      expected: [[200], [300]]
    - sql: SELECT c FROM vw3_o WHERE id NOT IN (SELECT id FROM vw3_v) ORDER BY c
      expected: [[400]]
    - sql: SELECT vw3_o.c FROM vw3_o WHERE EXISTS (SELECT id FROM vw3_v WHERE v = 20) ORDER BY c
      expected: [[200], [300], [400]]
    # a column both have, unqualified
    - sql: SELECT id FROM vw3_v JOIN vw3_o ON vw3_v.id = vw3_o.id
      error: "42702"
  teardown:
    - DROP VIEW vw3_v
    - DROP TABLE vw3_o
    - DROP TABLE vw3

- name: INSERT through a simple view reaches its table
  features: [F031-02]
  setup:
    - CREATE TABLE vw4 (id INTEGER PRIMARY KEY, v INTEGER)
    - CREATE VIEW vw4_v AS SELECT id, v FROM vw4
  steps:
    - sql: INSERT INTO vw4_v VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: SELECT id, v FROM vw4
      expected: [[1, 10]]
  teardown:
    - DROP VIEW vw4_v
    - DROP TABLE vw4

- name: INSERT through a view fills the table's columns the view selects
  features: [F031-02, pg:returning]
  setup:
    - CREATE TABLE vw6 (id INTEGER PRIMARY KEY, v INTEGER DEFAULT 7, w TEXT)
    - CREATE VIEW vw6_v (k, val) AS SELECT id, v FROM vw6 WHERE v > 100
    - CREATE VIEW vw6_vv AS SELECT val, k FROM vw6_v
  steps:
    # the row fills the view's first columns; the table's default the rest
    - sql: INSERT INTO vw6_v VALUES ($1)
      params: [1]
      rowcount: 1
    # the view's WHERE is not checked, and RETURNING gives the view's columns
    - sql: INSERT INTO vw6_vv (k, val) VALUES ($1, $2) RETURNING *
      params: [2, 20]
      expected: [[20, 2]]
    - sql: SELECT id, v, w FROM vw6 ORDER BY id
      expected: [[1, 7, null], [2, 20, null]]
    - sql: SELECT k FROM vw6_v
      expected: []
  teardown:
    - DROP VIEW vw6_vv
    - DROP VIEW vw6_v
    - DROP TABLE vw6

- name: INSERT through a view PostgreSQL cannot write through is refused
  features: [F031-02]
  setup:
    - CREATE TABLE vw7 (id INTEGER PRIMARY KEY, v INTEGER)
    - CREATE VIEW vw7_d AS SELECT DISTINCT id FROM vw7
    - CREATE VIEW vw7_g AS SELECT v, COUNT(*) AS n FROM vw7 GROUP BY v
    - CREATE VIEW vw7_e AS SELECT id, v + 1 AS v1 FROM vw7
    - CREATE VIEW vw7_2 AS SELECT id, id AS id2 FROM vw7
    - CREATE VIEW vw7_l AS SELECT id FROM vw7 LIMIT 5
    - CREATE VIEW vw7_la AS SELECT id FROM vw7 LIMIT ALL
    - CREATE VIEW vw7_ln AS SELECT id FROM vw7 LIMIT NULL
    - CREATE VIEW vw7_o AS SELECT id FROM vw7 OFFSET 0
  steps:
    - sql: INSERT INTO vw7_d VALUES ($1)
      params: [1]
      error: "55000"
    - sql: INSERT INTO vw7_g (v) VALUES ($1)
      params: [1]
      error: "55000"
    # LIMIT or OFFSET written, even one that limits nothing
    - sql: INSERT INTO vw7_l VALUES ($1)
      params: [1]
      error: "55000"
    - sql: INSERT INTO vw7_la VALUES ($1)
      params: [1]
      error: "55000"
    - sql: INSERT INTO vw7_ln VALUES ($1)
      params: [1]
      error: "55000"
    - sql: INSERT INTO vw7_o VALUES ($1)
      params: [1]
      error: "55000"
    # a column that is an expression; two view columns of one table column
    - sql: INSERT INTO vw7_e VALUES ($1, $2)
      params: [1, 2]
      error: "0A000"
    - sql: INSERT INTO vw7_2 VALUES ($1, $2)
      params: [1, 1]
      error: "42601"
    - sql: INSERT INTO vw7_e (id) VALUES ($1)
      params: [3]
      rowcount: 1
    - sql: SELECT id, v FROM vw7
      expected: [[3, null]]
  teardown:
    - DROP VIEW vw7_o
    - DROP VIEW vw7_ln
    - DROP VIEW vw7_la
    - DROP VIEW vw7_l
    - DROP VIEW vw7_2
    - DROP VIEW vw7_e
    - DROP VIEW vw7_g
    - DROP VIEW vw7_d
    - DROP TABLE vw7

- name: DROP VIEW, and what keeps a table or a view from being dropped
  features: [F031-16]
  setup:
    - CREATE TABLE vw5 (id INTEGER PRIMARY KEY)
    - CREATE VIEW vw5_a AS SELECT id FROM vw5
    - CREATE VIEW vw5_b AS SELECT id FROM vw5_a
  steps:
    # RESTRICT is the default: a table a view reads, a view another reads
    - sql: DROP TABLE vw5
      error: "2BP01"
    - sql: DROP VIEW vw5_a
      error: "2BP01"
    - sql: DROP VIEW vw5_b
    - sql: DROP VIEW vw5_a
    - sql: DROP VIEW vw5_a
      error: "42P01"
    - sql: DROP VIEW IF EXISTS vw5_a
    # the kinds of object are not interchangeable
    - sql: DROP VIEW vw5
      error: "42809"
    - sql: CREATE VIEW vw5_c AS SELECT id FROM vw5
    - sql: DROP TABLE vw5_c
      error: "42809"
    - sql: CREATE TABLE vw5_c (id INTEGER PRIMARY KEY)
      error: "42P07"
    - sql: CREATE VIEW vw5 AS SELECT id FROM vw5_c
      error: "42P07"
    - sql: DROP VIEW vw5_c
  teardown:
    - DROP TABLE vw5

- name: a table a view reads only in a subquery, in any position, is not dropped while the view exists
  features: [F031-16]
  ordered: true
  setup:
    - CREATE TABLE vw33 (a INTEGER, b INTEGER)
    - CREATE TABLE vw33_s (a INTEGER, b INTEGER)
    - CREATE TABLE vw33_w (a INTEGER, b INTEGER)
    - CREATE TABLE vw33_o (a INTEGER, b INTEGER)
    - CREATE TABLE vw33_q (a INTEGER, b INTEGER)
    - INSERT INTO vw33 VALUES (1, 2), (3, 4)
    - INSERT INTO vw33_q VALUES (5, 6)
    - CREATE VIEW vw33_select AS SELECT a, (SELECT max(b) FROM vw33_s) AS m FROM vw33
    - CREATE VIEW vw33_where AS SELECT a FROM vw33 WHERE a IN (SELECT a FROM vw33_w)
    - CREATE VIEW vw33_order AS SELECT a FROM vw33 ORDER BY (SELECT max(b) FROM vw33_o)
    - CREATE VIEW vw33_qv AS SELECT a, b FROM vw33_q WHERE a > 0
    - CREATE VIEW vw33_order_view AS SELECT a FROM vw33 ORDER BY (SELECT max(a) FROM vw33_qv)
  steps:
    - sql: DROP TABLE vw33_s
      error: "2BP01"
    - sql: DROP TABLE vw33_w
      error: "2BP01"
    - sql: DROP TABLE vw33_o
      error: "2BP01"
    - sql: DROP VIEW vw33_qv
      error: "2BP01"
    - sql: SELECT a FROM vw33_order_view
      expected: [[1], [3]]
    - sql: DROP VIEW vw33_order
    - sql: DROP TABLE vw33_o
  teardown:
    - DROP VIEW vw33_order_view
    - DROP VIEW vw33_qv
    - DROP VIEW vw33_where
    - DROP VIEW vw33_select
    - DROP TABLE vw33_q
    - DROP TABLE vw33_w
    - DROP TABLE vw33_s
    - DROP TABLE vw33

- name: a view of a table that is not there, a column that is not there, or a parameter
  features: [F031-02]
  setup:
    - CREATE TABLE vw6 (id INTEGER PRIMARY KEY)
  steps:
    - sql: CREATE VIEW vw6_v AS SELECT id FROM vw6_nope
      error: "42P01"
    - sql: CREATE VIEW vw6_v AS SELECT nope FROM vw6
      error: "42703"
    - sql: CREATE VIEW vw6_v AS SELECT id FROM vw6 WHERE id = $1
      error: "42P02"
    - sql: SELECT id FROM vw6_v
      error: "42P01"
  teardown:
    - DROP TABLE vw6

- name: a grouped view is read for its groups; the query's WHERE keeps groups
  features: [F131-01]
  setup:
    - CREATE TABLE vw7 (id INTEGER PRIMARY KEY, a INTEGER, b INTEGER)
    - CREATE VIEW vw7_g AS SELECT a FROM vw7 GROUP BY a
    - CREATE VIEW vw7_h AS SELECT a, MIN(b) AS lo, COUNT(*) AS n FROM vw7 GROUP BY a
  steps:
    - sql: INSERT INTO vw7 VALUES ($1, $2, $3)
      params: [1, 1, 5]
      rowcount: 1
    - sql: INSERT INTO vw7 VALUES ($1, $2, $3)
      params: [2, 1, 7]
      rowcount: 1
    - sql: INSERT INTO vw7 VALUES ($1, $2, $3)
      params: [3, 2, 9]
      rowcount: 1
    - sql: SELECT a FROM vw7_g ORDER BY a
      expected: [[1], [2]]
      ordered: true
    - sql: SELECT a FROM vw7_g WHERE a = 1
      expected: [[1]]
    # grouped again by its own group: the view
    - sql: SELECT a FROM vw7_g GROUP BY a ORDER BY a
      expected: [[1], [2]]
      ordered: true
    - sql: SELECT a FROM vw7_g WHERE a = 1 GROUP BY a HAVING a = 2
      expected: []
    - sql: SELECT a, lo FROM vw7_h WHERE n = 2
      expected: [[1, 5]]
    - sql: SELECT lo FROM vw7_h WHERE lo > 5
      expected: [[9]]
  teardown:
    - DROP VIEW vw7_h
    - DROP VIEW vw7_g
    - DROP TABLE vw7

- name: a query that aggregates over a grouped view
  features: [F131-03]
  setup:
    - CREATE TABLE vw8 (id INTEGER PRIMARY KEY, a INTEGER, b INTEGER)
    - CREATE VIEW vw8_h AS SELECT a, MIN(b) AS lo FROM vw8 GROUP BY a
  steps:
    - sql: INSERT INTO vw8 VALUES ($1, $2, $3)
      params: [1, 1, 5]
      rowcount: 1
    - sql: INSERT INTO vw8 VALUES ($1, $2, $3)
      params: [2, 2, 7]
      rowcount: 1
    - sql: SELECT SUM(lo) FROM vw8_h
      expected: [[12]]
  teardown:
    - DROP VIEW vw8_h
    - DROP TABLE vw8

- name: a grouped view joined with a table reads its groups as the join's outer rows
  features: [F131-02]
  setup:
    - CREATE TABLE vw12 (id INTEGER PRIMARY KEY, a INTEGER, b INTEGER)
    - CREATE TABLE vw12_t (k INTEGER PRIMARY KEY, a INTEGER)
    - INSERT INTO vw12 VALUES (1, 1, 5), (2, 1, 7), (3, 2, 9), (4, NULL, 1)
    - INSERT INTO vw12_t VALUES (1, 1), (2, 2), (3, 3), (4, NULL), (5, 1)
    - CREATE VIEW vw12_g AS SELECT a, COUNT(*) AS n, SUM(b) AS s FROM vw12 GROUP BY a
  steps:
    - sql: SELECT a FROM vw12_g JOIN vw12_t USING (a)
      expected: [[1], [1], [2]]
    - sql: SELECT * FROM vw12_g JOIN vw12_t USING (a)
      expected: [[1, 2, 12, 1], [1, 2, 12, 5], [2, 1, 9, 2]]
    - sql: SELECT * FROM vw12_t NATURAL JOIN vw12_g WHERE k > 1
      expected: [[1, 5, 2, 12], [2, 2, 1, 9]]
    - sql: SELECT vw12_g.s, vw12_t.k FROM vw12_t, vw12_g WHERE vw12_t.a = vw12_g.a AND vw12_t.k > 1
      expected: [[9, 2], [12, 5]]
    # the view's groups the table matches none of are kept, NULL-extended
    - sql: SELECT vw12_g.a, n, k FROM vw12_g LEFT JOIN vw12_t ON vw12_t.a = vw12_g.a AND vw12_t.k < 5
      expected: [[1, 2, 1], [2, 1, 2], [null, 1, null]]
    # the table the view reads, joined again
    - sql: SELECT vw12_g.n, vw12.id FROM vw12_g JOIN vw12 ON vw12.a = vw12_g.a WHERE vw12_g.s > 10
      expected: [[2, 1], [2, 2]]
    - sql: SELECT k FROM vw12_g JOIN vw12_t USING (a) WHERE a = $1
      params: [2]
      expected: [[2]]
  teardown:
    - DROP VIEW vw12_g
    - DROP TABLE vw12_t
    - DROP TABLE vw12

- name: a grouped view on the NULL-extended side of an outer join, or sorted in a join
  features: [F131-02]
  unimplemented: true
  # the view's groups are read only as the join's outer rows, never held by a sorter: refused (42601, 0A000), #834
  setup:
    - CREATE TABLE vw13 (id INTEGER PRIMARY KEY, a INTEGER)
    - CREATE TABLE vw13_t (k INTEGER PRIMARY KEY, a INTEGER)
    - INSERT INTO vw13 VALUES (1, 1), (2, 1)
    - INSERT INTO vw13_t VALUES (1, 1), (2, 2)
    - CREATE VIEW vw13_g AS SELECT a, COUNT(*) AS n FROM vw13 GROUP BY a
  steps:
    - sql: SELECT k, n FROM vw13_t LEFT JOIN vw13_g USING (a)
      expected: [[1, 2], [2, null]]
    - sql: SELECT k, n FROM vw13_g JOIN vw13_t USING (a) ORDER BY k
      expected: [[1, 2]]
      ordered: true
  teardown:
    - DROP VIEW vw13_g
    - DROP TABLE vw13_t
    - DROP TABLE vw13

- name: a grouped view in a grouped join, joined with another view, or under another grouped view in a join
  features: [F131-02]
  unimplemented: true
  # refused (42601): an aggregate over a join of a grouped view, a grouped view joined with another view, a join of a view that aggregates over a grouped view, #835
  setup:
    - CREATE TABLE vw14 (id INTEGER PRIMARY KEY, a INTEGER)
    - CREATE TABLE vw14_t (k INTEGER PRIMARY KEY, a INTEGER)
    - INSERT INTO vw14 VALUES (1, 1), (2, 1), (3, 2)
    - INSERT INTO vw14_t VALUES (1, 1), (2, 2)
    - CREATE VIEW vw14_g AS SELECT a, COUNT(*) AS n FROM vw14 GROUP BY a
    - CREATE VIEW vw14_p AS SELECT k, a FROM vw14_t
    - CREATE VIEW vw14_gg AS SELECT n, COUNT(*) AS m FROM vw14_g GROUP BY n
  steps:
    - sql: SELECT COUNT(*), SUM(n) FROM vw14_g JOIN vw14_t USING (a)
      expected: [[2, 3]]
    - sql: SELECT k, n FROM vw14_g JOIN vw14_p USING (a)
      expected: [[1, 2], [2, 1]]
    - sql: SELECT k, m FROM vw14_gg JOIN vw14_t ON vw14_t.k = vw14_gg.n
      expected: [[1, 1], [2, 1]]
  teardown:
    - DROP VIEW vw14_gg
    - DROP VIEW vw14_p
    - DROP VIEW vw14_g
    - DROP TABLE vw14_t
    - DROP TABLE vw14

- name: an aggregate over a view of one group whose WHERE compares with constants
  features: [F131-03]
  setup:
    - CREATE TABLE vw10 (id INTEGER PRIMARY KEY, a INTEGER, b INTEGER)
    - INSERT INTO vw10 VALUES (1, 1, 1), (2, 1, 2), (3, 2, 3), (4, 3, 4), (5, 4, 5)
    - CREATE VIEW vw10_f AS SELECT COUNT(*) AS c, SUM(b) AS s FROM vw10 WHERE a > 1
    - CREATE VIEW vw10_r AS SELECT COUNT(*) AS c FROM vw10 WHERE id BETWEEN 2 AND 4
    - CREATE VIEW vw10_e AS SELECT COUNT(*) AS c, SUM(b) AS s FROM vw10 WHERE id < 0
  steps:
    - sql: SELECT SUM(c), MAX(s) FROM vw10_f
      expected: [[3, 12]]
    - sql: SELECT SUM(c) FROM vw10_r
      expected: [[3]]
    # its one group over no rows: COUNT 0, SUM NULL
    - sql: SELECT COUNT(*), SUM(c), MAX(s) FROM vw10_e
      expected: [[1, 0, null]]
  teardown:
    - DROP VIEW vw10_e
    - DROP VIEW vw10_r
    - DROP VIEW vw10_f
    - DROP TABLE vw10

- name: an aggregate over a view of one group read by a point lookup
  features: [F131-03]
  unimplemented: true
  # the plan may end before it reads, which gives no group: refused (0A000), #833
  setup:
    - CREATE TABLE vw11 (id INTEGER PRIMARY KEY, a INTEGER)
    - INSERT INTO vw11 VALUES (1, 1), (3, 2)
    - CREATE VIEW vw11_p AS SELECT COUNT(*) AS c FROM vw11 WHERE id = 3
  steps:
    - sql: SELECT SUM(c) FROM vw11_p
      expected: [[1]]
  teardown:
    - DROP VIEW vw11_p
    - DROP TABLE vw11

- name: MIN, MAX and COUNT(DISTINCT) over a grouped view that has no aggregate read the base rows' values
  features: [F131-04]
  setup:
    - CREATE TABLE vw9 (id INTEGER PRIMARY KEY, a INTEGER, b INTEGER)
    - CREATE VIEW vw9_g AS SELECT a, b FROM vw9 WHERE b > 0 GROUP BY a, b
  steps:
    - sql: INSERT INTO vw9 VALUES ($1, $2, $3)
      params: [1, 1, 5]
      rowcount: 1
    - sql: INSERT INTO vw9 VALUES ($1, $2, $3)
      params: [2, 1, 5]
      rowcount: 1
    - sql: INSERT INTO vw9 VALUES ($1, $2, $3)
      params: [3, 2, 7]
      rowcount: 1
    - sql: INSERT INTO vw9 VALUES ($1, $2, $3)
      params: [4, 3, -1]
      rowcount: 1
    - sql: SELECT MAX(a), MIN(b) FROM vw9_g
      expected: [[2, 5]]
    - sql: SELECT COUNT(DISTINCT a) FROM vw9_g WHERE a > 1
      expected: [[1]]
    - sql: SELECT a, MAX(b) FROM vw9_g GROUP BY a ORDER BY a
      expected: [[1, 5], [2, 7]]
      ordered: true
    # SUM and COUNT count the view's rows, one per group
    - sql: SELECT SUM(b) FROM vw9_g
      expected: [[12]]
  teardown:
    - DROP VIEW vw9_g
    - DROP TABLE vw9
