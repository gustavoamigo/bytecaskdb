# The :: cast, and what a cast refuses.

- name: text to integer and back
  features: [pg:cast-operator]
  steps:
    - sql: SELECT '42'::integer
      expected: [[42]]
    - sql: SELECT 42::text
      expected: [[42]]
    - sql: SELECT '  7 '::integer
      expected: [[7]]

- name: a cast that overflows its type
  features: [pg:cast-operator, E011-01]
  steps:
    - sql: SELECT 40000::smallint
      error: "22003"
    - sql: SELECT 3000000000::integer
      error: "22003"
    - sql: SELECT 32767::smallint
      expected: [[32767]]

- name: text that isn't a number
  features: [pg:cast-operator, E011-01]
  steps:
    - sql: SELECT 'x'::integer
      error: "22P02"
    - sql: SELECT ''::integer
      error: "22P02"

- name: numeric rounds to its scale
  features: [pg:cast-operator, E011-03]
  steps:
    - sql: SELECT 1.005::numeric(4,2)
      expected: [["1.01"]]
    - sql: SELECT 2.5::numeric(2,0)
      expected: [[3]]
    - sql: SELECT 99.99::numeric(3,1)
      error: "22003"

- name: a number cast to an integer rounds as PostgreSQL's cast functions do
  features: [pg:cast-operator, E011-01]
  steps:
    # A numeric rounds half away from zero; a float to the nearest even.
    - sql: SELECT 2.5::integer, (-2.5)::integer, 2.4::smallint, 7.5::bigint
      expected: [[3, -3, 2, 8]]
    - sql: SELECT '2.5'::float8::integer, '3.5'::float8::integer, '-0.5'::real::integer
      expected: [[2, 4, 0]]
    - sql: SELECT 32767.5::smallint
      error: "22003"
    - sql: SELECT '9.3e18'::float8::bigint
      error: "22003"
    - sql: SELECT 3::numeric(5,2), 7::real, 1.25::double precision, '1.5'::float8::numeric(5,2)
      expected: [["3.00", 7, "1.25", "1.50"]]

- name: a boolean casts to an integer and back, and to text
  features: [pg:cast-operator]
  steps:
    - sql: SELECT true::integer, false::integer, 0::boolean, 5::boolean, true::text
      expected: [[1, 0, f, t, "true"]]
    - sql: SELECT 5::bigint::boolean
      error: "42846"
    - sql: SELECT true::smallint
      error: "42846"

- name: a cast between types PostgreSQL has no cast for is refused
  features: [pg:cast-operator]
  steps:
    - sql: SELECT 1::date
      error: "42846"
    - sql: SELECT NULL::integer::date
      error: "42846"
    - sql: SELECT DATE '2026-01-01'::integer
      error: "42846"
    - sql: SELECT '\x01'::bytea::integer
      error: "42846"

- name: a typed string casts by the target's input function
  features: [pg:cast-operator]
  steps:
    - sql: SELECT '12'::text::integer, 'x'::text::bytea, 1.50::text
      expected: [[12, \x78, "1.50"]]
    - sql: SELECT 'abc'::text::integer
      error: "22P02"

- name: smallint arithmetic overflows a smallint
  features: [pg:cast-operator, E011-01]
  steps:
    - sql: SELECT 32767::smallint + 1::smallint
      error: "22003"
    - sql: SELECT 200::smallint * 200::smallint
      error: "22003"
    - sql: SELECT 32767::smallint + 1
      expected: [[32768]]

- name: a parameter cast to its column's type is compared as that type
  features: [pg:cast-operator, pg:parameters]
  setup:
    - CREATE TABLE pc (id INTEGER PRIMARY KEY, d DATE, n INTEGER)
    - INSERT INTO pc VALUES (1, '2026-10-25', 5)
    - INSERT INTO pc VALUES (2, '2026-10-26', 6)
  steps:
    - sql: SELECT id FROM pc WHERE $1::date = d
      params: ['2026-10-26']
      expected: [[2]]
    - sql: SELECT id FROM pc WHERE n = CAST($1 AS INTEGER)
      params: ['5']
      expected: [[1]]
    - sql: SELECT id FROM pc WHERE d = $1::date
      params: ['x']
      error: "22007"
  teardown:
    - DROP TABLE pc

- name: text to an integer reads prefixes, underscores and spaces as int4in does
  features: [pg:cast-operator]
  steps:
    - sql: SELECT '0x1F'::integer, '0o17'::integer, '0b101'::integer, '1_000'::integer, ' -0X1f '::integer
      expected: [[31, 15, 5, 1000, -31]]
    - sql: SELECT '0x_1F'::bigint, '1_000_000'::bigint, '-0x8000000000000000'::bigint, '0b111111111111111'::smallint
      expected: [[31, 1000000, "-9223372036854775808", 32767]]
    - sql: SELECT '0x1F'::integer + 1
      expected: [[32]]
    - sql: SELECT '1__0'::integer
      error: "22P02"
    - sql: SELECT '_1'::integer
      error: "22P02"
    - sql: SELECT '1_'::integer
      error: "22P02"
    - sql: SELECT '0x'::integer
      error: "22P02"
    - sql: SELECT '0o8'::integer
      error: "22P02"
    - sql: SELECT '1e3'::integer
      error: "22P02"

- name: text to an integer out of its range names the value
  features: [pg:cast-operator, E011-01]
  steps:
    - sql: SELECT '3000000000'::integer
      error: "22003"
    - sql: SELECT '0x80000000'::integer
      error: "22003"
    - sql: SELECT '70000'::smallint
      error: "22003"
    - sql: SELECT '0x8000000000000000'::bigint
      error: "22003"
    - sql: SELECT '3000000000x'::integer
      error: "22003"

- name: text to real is read as float4in reads it
  features: [pg:cast-operator, E011-02]
  steps:
    - sql: SELECT '1.5'::real, ' 2.25 '::real, '1e-45'::real
      expected: [["1.5", "2.25", "1e-45"]]
    - sql: SELECT '1e39'::real
      error: "22003"
    - sql: SELECT '1e-50'::real
      error: "22003"
    - sql: SELECT 'x'::real
      error: "22P02"
    - sql: SELECT '1e3x'::real
      error: "22P02"

- name: text out of a float's range is 22003 before any text after the number
  features: [pg:cast-operator, E011-02]
  steps:
    - sql: SELECT ' 1e39 '::real
      error: "22003"
    - sql: SELECT '1e39x'::real
      error: "22003"
    - sql: SELECT '1e999x'::float8
      error: "22003"

- name: an infinity is no value of a DECIMAL
  features: [pg:cast-operator, E011-03]
  steps:
    - sql: SELECT 'Infinity'::numeric(3,0)
      error: "22003"
    - sql: SELECT '-inf'::numeric(5,2)
      error: "22003"
    - sql: SELECT 'Infinityx'::numeric(3,0)
      error: "22P02"

- name: a cast of a column is computed for each row (casts of expressions)
  features: [pg:cast-operator]
  setup:
    - CREATE TABLE cx (id INTEGER PRIMARY KEY, s TEXT, n INTEGER, b BIGINT, d NUMERIC(5,2), f DOUBLE PRECISION, r REAL, ch CHAR(3), dt DATE, ts TIMESTAMP, tz TIMESTAMPTZ, tm TIME, ttz TIMETZ, bo BOOLEAN, by BYTEA, nm NAME, sm SMALLINT)
    - INSERT INTO cx VALUES (1, '12', 5, 3000000000, 2.50, 2.5, 1.5, 'ab', '2024-03-01', '2024-03-01 10:00', '2024-03-01 10:00+00', '10:00', '10:00+00', true, '\x6162', 'nm', 7)
    - INSERT INTO cx VALUES (2, ' 0x1F ', -7, -5, -2.50, 3.5, -2.5, 'q', '2024-02-29', '1999-12-31 23:59:59.5', '2000-01-01 00:00+00', '23:59:59', '01:00+00', false, '\x', 'z', -3)
    - INSERT INTO cx (id) VALUES (3)
  steps:
    - sql: SELECT s::integer, s::bigint + 1, s::smallint FROM cx ORDER BY id
      expected: [[null, null, null], [12, 13, 12], [31, 32, 31]]
    - sql: SELECT n::text, b::text, d::text, bo::text, bo::name, dt::text, ts::text, tz::text, tm::text, ttz::text, by::text, nm::text, ch::text || '|' FROM cx ORDER BY id
      expected:
        - [null, null, null, null, null, null, null, null, null, null, null, null, null]
        - [-7, -5, "-2.50", "false", f, "2024-02-29", "1999-12-31 23:59:59.5", "2000-01-01 00:00:00+00", "23:59:59", 01:00:00+00, \x, z, q|]
        - [5, 3000000000, "2.50", "true", t, "2024-03-01", "2024-03-01 10:00:00", "2024-03-01 10:00:00+00", "10:00:00", 10:00:00+00, \x6162, nm, ab|]
    - sql: SELECT n::bigint, d::integer, d::smallint, d::numeric(3,0), n::numeric(4,1), f::integer, r::integer, f::numeric(3,0), r::numeric(3,1), n::boolean, bo::integer FROM cx ORDER BY id
      expected:
        - [null, null, null, null, null, null, null, null, null, null, null]
        - [-7, -3, -3, -3, "-7.0", 4, -2, 4, "-2.5", t, 0]
        - [5, 3, 3, 3, "5.0", 2, 2, 3, "1.5", t, 1]
    - sql: SELECT d::float8, d::real, n::float8, f::real, r::float8 FROM cx ORDER BY id
      expected:
        - [null, null, null, null, null]
        - ["-2.5", "-2.5", -7, "3.5", "-2.5"]
        - ["2.5", "2.5", 5, "2.5", "1.5"]
    - sql: SELECT dt::timestamp, dt::timestamptz, ts::date, ts::time, tz::date, tz::time, tz::timetz, tm::timetz, ttz::time, ts::timestamptz, tz::timestamp FROM cx ORDER BY id
      expected:
        - [null, null, null, null, null, null, null, null, null, null, null]
        - ["2024-02-29 00:00:00", "2024-02-29 00:00:00+00", "1999-12-31", 23:59:59.5, "2000-01-01", 00:00:00, 00:00:00+00, 23:59:59+00, 01:00:00, "1999-12-31 23:59:59.5+00", "2000-01-01 00:00:00"]
        - ["2024-03-01 00:00:00", "2024-03-01 00:00:00+00", "2024-03-01", "10:00:00", "2024-03-01", "10:00:00", 10:00:00+00, 10:00:00+00, "10:00:00", "2024-03-01 10:00:00+00", "2024-03-01 10:00:00"]
    - sql: SELECT s::name, s::bytea, ch::name, ch::varchar FROM cx ORDER BY id
      expected:
        - [null, null, null, null]
        - [" 0x1F ", \x203078314620, q, q]
        - [12, \x3132, ab, ab]
    - sql: SELECT (s || '0')::integer, (d * 3)::integer, (n + 1)::text FROM cx ORDER BY id
      error: "22P02"
    - sql: SELECT CAST(s AS integer) + 1 FROM cx WHERE id = 1
      expected: [[13]]

- name: a cast of a column raises the cast function's error for a row it reaches
  features: [pg:cast-operator]
  setup:
    - CREATE TABLE ce (id INTEGER PRIMARY KEY, s TEXT, b BIGINT, d NUMERIC(5,2), f DOUBLE PRECISION, dt DATE)
    - INSERT INTO ce VALUES (1, 'ab', 3000000000, 999.99, '1e39', '5874897-12-31'), (2, '3000000000', 70000, 1.00, 2.5, '2024-01-01'), (3, '2024-02-30', NULL, NULL, NULL, NULL), (4, '1e39', NULL, NULL, NULL, NULL), (5, '123.456', NULL, NULL, NULL, NULL), (6, 'maybe', NULL, NULL, NULL, NULL)
  steps:
    - sql: SELECT s::integer FROM ce WHERE id = 1
      error: "22P02"
    - sql: SELECT s::integer FROM ce WHERE id = 2
      error: "22003"
    - sql: SELECT b::integer FROM ce WHERE id = 1
      error: "22003"
    - sql: SELECT b::smallint FROM ce WHERE id = 2
      error: "22003"
    - sql: SELECT d::numeric(4,2) FROM ce WHERE id = 1
      error: "22003"
    - sql: SELECT f::real FROM ce WHERE id = 1
      error: "22003"
    - sql: SELECT f::integer FROM ce WHERE id = 1
      error: "22003"
    - sql: SELECT dt::timestamp FROM ce WHERE id = 1
      error: "22008"
    - sql: SELECT s::date FROM ce WHERE id = 3
      error: "22008"
    - sql: SELECT s::date FROM ce WHERE id = 1
      error: "22007"
    - sql: SELECT s::real FROM ce WHERE id = 4
      error: "22003"
    - sql: SELECT s::numeric(5,2) FROM ce WHERE id = 5
      expected: [["123.46"]]
    - sql: SELECT s::numeric(4,2) FROM ce WHERE id = 5
      error: "22003"
    - sql: SELECT s::boolean FROM ce WHERE id = 6
      error: "22P02"
    - sql: SELECT s::integer FROM ce WHERE id = 99
      expected: []

- name: a cast PostgreSQL has no cast for is refused at the cast, whatever the rows
  features: [pg:cast-operator]
  setup:
    - CREATE TABLE cn (id INTEGER PRIMARY KEY, dt DATE, sm SMALLINT, tm TIME, ts TIMESTAMP, n INTEGER)
  steps:
    - sql: SELECT dt::integer FROM cn
      error: "42846"
    - sql: SELECT sm::boolean FROM cn
      error: "42846"
    - sql: SELECT tm::timestamp FROM cn
      error: "42846"
    - sql: SELECT ts::timetz FROM cn
      error: "42846"
    - sql: SELECT n::date FROM cn
      error: "42846"
    - sql: SELECT n::jsonb FROM cn
      error: "42846"

- name: a parameter cast twice, its text read per execution
  features: [pg:cast-operator]
  setup:
    - CREATE TABLE cp (id INTEGER PRIMARY KEY, s TEXT)
    - INSERT INTO cp VALUES (1, '7'), (2, 'x')
  steps:
    - sql: SELECT $1::text::integer + 1
      params: ["41"]
      expected: [[42]]
    - sql: SELECT $1::text::integer
      params: ["zz"]
      error: "22P02"
    - sql: SELECT id FROM cp WHERE id = $1::text::integer
      params: ["2"]
      expected: [[2]]
    - sql: SELECT ($1::jsonb -> 0)::integer::text
      params: ["[3]"]
      expected: [[3]]

- name: bytea input errors per row and for a constant
  features: [pg:cast-operator]
  setup:
    - CREATE TABLE cby (id INTEGER PRIMARY KEY, s TEXT)
    - INSERT INTO cby VALUES (1, 'x'), (2, '12'), (3, '')
  steps:
    - sql: SELECT ('a\' || s)::bytea FROM cby WHERE id = 1
      error: "22P02"
    - sql: SELECT ('a\400' || s)::bytea FROM cby WHERE id = 3
      error: "22P02"
    - sql: SELECT ('\X61' || s)::bytea FROM cby WHERE id = 3
      error: "22P02"
    - sql: SELECT ('\x6' || s)::bytea FROM cby WHERE id = 1
      error: "22023"
    - sql: SELECT ('\x6 ' || s)::bytea FROM cby WHERE id = 2
      error: "22023"
    - sql: SELECT ('\x61 ' || s)::bytea FROM cby WHERE id = 2
      expected: [[\x6112]]
    - sql: SELECT ('\x6' || s)::bytea FROM cby WHERE id = 3
      error: "22023"
    - sql: SELECT 'a\400'::bytea
      error: "22P02"
    - sql: SELECT '\x6g'::bytea
      error: "22023"
