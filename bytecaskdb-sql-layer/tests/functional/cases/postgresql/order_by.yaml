# ORDER BY a select-list position, in a plain SELECT. The position names the
# select-list item, which must be a column; a set operation's is in
# set_operations.yaml.

- name: ORDER BY takes select-list positions
  features: [F850]
  ordered: true
  setup:
    - CREATE TABLE ob (id INTEGER PRIMARY KEY, a INTEGER, b TEXT)
    - INSERT INTO ob VALUES (1, 30, 'x')
    - INSERT INTO ob VALUES (2, 10, 'z')
    - INSERT INTO ob VALUES (3, NULL, 'y')
    - INSERT INTO ob VALUES (4, 20, 'y')
  steps:
    - sql: SELECT a, b FROM ob ORDER BY 1
      expected: [[10, "z"], [20, "y"], [30, "x"], [null, "y"]]
    - sql: SELECT a, b FROM ob ORDER BY 1 DESC
      expected: [[null, "y"], [30, "x"], [20, "y"], [10, "z"]]
    - sql: SELECT b, a FROM ob ORDER BY 1, 2 DESC
      expected: [["x", 30], ["y", null], ["y", 20], ["z", 10]]
    - sql: SELECT b AS name, a FROM ob ORDER BY 1 DESC, 2 LIMIT 2
      expected: [["z", 10], ["y", 20]]
    - sql: SELECT a FROM ob ORDER BY 2
      error: "42P10"
    - sql: SELECT a FROM ob ORDER BY 0
      error: "42P10"
    - sql: SELECT a FROM ob ORDER BY 'a'
      error: "42601"
  teardown:
    - DROP TABLE ob

- name: ORDER BY an output name orders by its item, not the input column it hides
  features: [F850]
  ordered: true
  setup:
    - CREATE TABLE oa (id INTEGER PRIMARY KEY, a INTEGER, b TEXT)
    - INSERT INTO oa VALUES (1, 30, 'x')
    - INSERT INTO oa VALUES (2, 10, 'z')
    - INSERT INTO oa VALUES (3, NULL, 'y')
    - INSERT INTO oa VALUES (4, 20, 'y')
  steps:
    - sql: SELECT b AS a, a AS b FROM oa ORDER BY a, b
      expected: [["x", 30], ["y", 20], ["y", null], ["z", 10]]
    - sql: SELECT a, id AS a2, b AS id FROM oa ORDER BY id DESC, a
      expected: [[10, 2, "z"], [20, 4, "y"], [null, 3, "y"], [30, 1, "x"]]
    - sql: SELECT a, -id AS a FROM oa ORDER BY 1
      expected: [[10, -2], [20, -4], [30, -1], [null, -3]]
    - sql: SELECT a AS b, b AS a FROM oa ORDER BY 1
      expected: [[10, "z"], [20, "y"], [30, "x"], [null, "y"]]
    - sql: SELECT a AS b, b AS a FROM oa ORDER BY 2, 1
      expected: [[30, "x"], [20, "y"], [null, "y"], [10, "z"]]
    - sql: SELECT b AS a, a FROM oa ORDER BY a
      error: "42702"
    - sql: SELECT a AS x, b AS x FROM oa ORDER BY x
      error: "42702"
    - sql: SELECT a AS x, a AS x FROM oa ORDER BY x
      expected: [[10, 10], [20, 20], [30, 30], [null, null]]
  teardown:
    - DROP TABLE oa

- name: ORDER BY an output name of an expression
  features: [F850]
  # ORDER BY an output name of an expression is not supported yet
  unimplemented: true
  ordered: true
  setup:
    - CREATE TABLE oe (id INTEGER PRIMARY KEY, a INTEGER)
    - INSERT INTO oe VALUES (1, 30)
    - INSERT INTO oe VALUES (2, 10)
    - INSERT INTO oe VALUES (4, 20)
  steps:
    - sql: SELECT -a AS a FROM oe ORDER BY a
      expected: [[-30], [-20], [-10]]
  teardown:
    - DROP TABLE oe
