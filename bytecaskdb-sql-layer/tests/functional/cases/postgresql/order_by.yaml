# ORDER BY a select-list position or output name, and ORDER BY an
# expression of the FROM columns, in a plain SELECT. A position or output
# name orders by its select-list item, a column or an expression; a set
# operation's is in set_operations.yaml.

- name: ORDER BY takes select-list positions
  features: [F850]
  ordered: true
  setup:
    - CREATE TABLE ob (id INTEGER PRIMARY KEY, a INTEGER, b TEXT)
    - INSERT INTO ob VALUES (1, 30, 'x')
    - INSERT INTO ob VALUES (2, 10, 'z')
    - INSERT INTO ob VALUES (3, NULL, 'y')
    - INSERT INTO ob VALUES (4, 20, 'y')
  steps:
    - sql: SELECT a, b FROM ob ORDER BY 1
      expected: [[10, "z"], [20, "y"], [30, "x"], [null, "y"]]
    - sql: SELECT a, b FROM ob ORDER BY 1 DESC
      expected: [[null, "y"], [30, "x"], [20, "y"], [10, "z"]]
    - sql: SELECT b, a FROM ob ORDER BY 1, 2 DESC
      expected: [["x", 30], ["y", null], ["y", 20], ["z", 10]]
    - sql: SELECT b AS name, a FROM ob ORDER BY 1 DESC, 2 LIMIT 2
      expected: [["z", 10], ["y", 20]]
    - sql: SELECT a FROM ob ORDER BY 2
      error: "42P10"
    - sql: SELECT a FROM ob ORDER BY 0
      error: "42P10"
    - sql: SELECT a FROM ob ORDER BY 'a'
      error: "42601"
  teardown:
    - DROP TABLE ob

- name: ORDER BY an output name orders by its item, not the input column it hides
  features: [F850]
  ordered: true
  setup:
    - CREATE TABLE oa (id INTEGER PRIMARY KEY, a INTEGER, b TEXT)
    - INSERT INTO oa VALUES (1, 30, 'x')
    - INSERT INTO oa VALUES (2, 10, 'z')
    - INSERT INTO oa VALUES (3, NULL, 'y')
    - INSERT INTO oa VALUES (4, 20, 'y')
  steps:
    - sql: SELECT b AS a, a AS b FROM oa ORDER BY a, b
      expected: [["x", 30], ["y", 20], ["y", null], ["z", 10]]
    - sql: SELECT a, id AS a2, b AS id FROM oa ORDER BY id DESC, a
      expected: [[10, 2, "z"], [20, 4, "y"], [null, 3, "y"], [30, 1, "x"]]
    - sql: SELECT a, -id AS a FROM oa ORDER BY 1
      expected: [[10, -2], [20, -4], [30, -1], [null, -3]]
    - sql: SELECT a AS b, b AS a FROM oa ORDER BY 1
      expected: [[10, "z"], [20, "y"], [30, "x"], [null, "y"]]
    - sql: SELECT a AS b, b AS a FROM oa ORDER BY 2, 1
      expected: [[30, "x"], [20, "y"], [null, "y"], [10, "z"]]
    - sql: SELECT b AS a, a FROM oa ORDER BY a
      error: "42702"
    - sql: SELECT a AS x, b AS x FROM oa ORDER BY x
      error: "42702"
    - sql: SELECT a AS x, a AS x FROM oa ORDER BY x
      expected: [[10, 10], [20, 20], [30, 30], [null, null]]
  teardown:
    - DROP TABLE oa

- name: ORDER BY an output name of an expression
  features: [F850]
  ordered: true
  setup:
    - CREATE TABLE oe (id INTEGER PRIMARY KEY, a INTEGER)
    - INSERT INTO oe VALUES (1, 30)
    - INSERT INTO oe VALUES (2, 10)
    - INSERT INTO oe VALUES (4, 20)
  steps:
    - sql: SELECT -a AS a FROM oe ORDER BY a
      expected: [[-30], [-20], [-10]]
    - sql: SELECT a + 1 FROM oe ORDER BY 1 DESC
      expected: [[31], [21], [11]]
    - sql: SELECT a + 1 AS x, a + 1 AS x FROM oe ORDER BY x
      expected: [[11, 11], [21, 21], [31, 31]]
    - sql: SELECT a + 1 AS x, a + 2 AS x FROM oe ORDER BY x
      error: "42702"
  teardown:
    - DROP TABLE oe

- name: ORDER BY an expression of the FROM columns
  features: [E121-03]
  ordered: true
  setup:
    - CREATE TABLE ox (id INTEGER PRIMARY KEY, a INTEGER, b TEXT, s SMALLINT)
    - CREATE TABLE oy (id INTEGER PRIMARY KEY, a INTEGER)
    - INSERT INTO ox VALUES (1, 30, 'x', 200), (2, 10, 'z', 300), (3, NULL, 'y', 1), (4, 20, 'y', -5)
    - INSERT INTO oy VALUES (1, 5), (2, 6)
  steps:
    - sql: SELECT id FROM ox ORDER BY a + 5
      expected: [[2], [4], [1], [3]]
    - sql: SELECT id FROM ox ORDER BY -a DESC NULLS LAST
      expected: [[2], [4], [1], [3]]
    - sql: SELECT id, a FROM ox ORDER BY a % 7 NULLS FIRST, id
      expected: [[3, null], [1, 30], [2, 10], [4, 20]]
    - sql: SELECT id FROM ox ORDER BY b || 'a' DESC, id
      expected: [[2], [3], [4], [1]]
    - sql: SELECT id FROM ox ORDER BY abs(a - 15), id LIMIT 2
      expected: [[2], [4]]
    - sql: SELECT ox.id FROM ox JOIN oy ON ox.id = oy.id ORDER BY ox.a + oy.a
      expected: [[2], [1]]
    - sql: SELECT id FROM ox ORDER BY 1 + 1, id DESC
      expected: [[4], [3], [2], [1]]
    - sql: SELECT id FROM ox ORDER BY s * s
      error: "22003"
    - sql: SELECT DISTINCT a FROM ox ORDER BY a + 1
      error: "42P10"
    - sql: SELECT a FROM ox UNION SELECT a FROM oy ORDER BY a + 1
      error: "0A000"
  teardown:
    - DROP TABLE ox
    - DROP TABLE oy
