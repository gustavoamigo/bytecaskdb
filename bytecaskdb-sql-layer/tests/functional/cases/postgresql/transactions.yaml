# Transaction control: COMMIT, ROLLBACK, savepoints and the statements around
# them. Two sessions at once are a class of tests of their own.

- name: a committed transaction is seen by the next statement
  features: [E151-01]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: BEGIN
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, 20]
      rowcount: 1
    - sql: COMMIT
    - sql: SELECT id, v FROM t WHERE id >= $1
      params: [0]
      expected: [[1, 10], [2, 20]]
  teardown:
    - ROLLBACK
    - DROP TABLE t

- name: START TRANSACTION and END
  features: [E151-01, pg:end-transaction]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: START TRANSACTION
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, 20]
      rowcount: 1
    - sql: END
    - sql: SELECT id, v FROM t WHERE id >= $1
      params: [0]
      expected: [[1, 10], [2, 20]]
  teardown:
    - ROLLBACK
    - DROP TABLE t

- name: COMMIT with no transaction is accepted
  features: [E151-01]
  steps:
    - sql: COMMIT

- name: ROLLBACK with no transaction is accepted
  features: [E151-02]
  steps:
    - sql: ROLLBACK

- name: BEGIN inside a transaction is accepted
  features: [E151-01]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: BEGIN
    - sql: BEGIN
    - sql: COMMIT
  teardown:
    - ROLLBACK
    - DROP TABLE t

- name: a SAVEPOINT and ROLLBACK TO it
  features: [pg:savepoint]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: BEGIN
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: SAVEPOINT s
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, 20]
      rowcount: 1
    - sql: ROLLBACK TO SAVEPOINT s
    - sql: COMMIT
    - sql: SELECT id, v FROM t WHERE id >= $1
      params: [0]
      expected: [[1, 10]]
  teardown:
    - ROLLBACK
    - DROP TABLE t

- name: RELEASE SAVEPOINT keeps the work
  features: [pg:savepoint]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: BEGIN
    - sql: SAVEPOINT s
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: RELEASE SAVEPOINT s
    - sql: COMMIT
    - sql: SELECT id, v FROM t WHERE id >= $1
      params: [0]
      expected: [[1, 10]]
  teardown:
    - ROLLBACK
    - DROP TABLE t

- name: SET TRANSACTION ISOLATION LEVEL SERIALIZABLE
  features: [E152-01]
  # snapshot isolation only: the serializable guards are not built (0A000)
  unimplemented: true
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: BEGIN
    - sql: SET TRANSACTION ISOLATION LEVEL SERIALIZABLE
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, 20]
      rowcount: 1
    - sql: COMMIT
    - sql: SELECT id FROM t WHERE id >= $1
      params: [0]
      expected: [[1], [2]]
  teardown:
    - ROLLBACK
    - DROP TABLE t

- name: a READ ONLY transaction refuses a write
  features: [E152-02]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: BEGIN READ ONLY
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      error: "25006"
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, 20]
      error: "25P02"
    - sql: ROLLBACK
  teardown:
    - ROLLBACK
    - DROP TABLE t

- name: DDL inside a transaction
  features: [pg:transactional-ddl]
  steps:
    - sql: BEGIN
    - sql: CREATE TABLE t (id INTEGER PRIMARY KEY)
    - sql: ROLLBACK
    - sql: SELECT id FROM t WHERE id >= $1
      params: [0]
      error: "42P01"
  teardown:
    - ROLLBACK
    - DROP TABLE t

- name: a table created in a transaction is used in it and committed with its rows
  features: [pg:transactional-ddl]
  steps:
    - sql: BEGIN
    - sql: CREATE TABLE t (id INTEGER PRIMARY KEY, v TEXT)
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, a]
      rowcount: 1
    - sql: CREATE INDEX t_v ON t (v)
    - sql: SELECT id FROM t WHERE v = $1
      params: [a]
      expected: [[1]]
    - sql: COMMIT
    - sql: SELECT id, v FROM t WHERE id >= $1
      params: [0]
      expected: [[1, a]]
  teardown:
    - ROLLBACK
    - DROP TABLE t

- name: a DROP TABLE rolled back brings the table back with its rows
  features: [pg:transactional-ddl]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
    - INSERT INTO t VALUES (1, 10)
  steps:
    - sql: BEGIN
    - sql: DROP TABLE t
    - sql: SELECT id FROM t WHERE id >= $1
      params: [0]
      error: "42P01"
    - sql: ROLLBACK
    - sql: SELECT id, v FROM t WHERE id >= $1
      params: [0]
      expected: [[1, 10]]
  teardown:
    - ROLLBACK
    - DROP TABLE t

- name: ROLLBACK TO a savepoint undoes the DDL after it and keeps the rows before it
  features: [pg:transactional-ddl, pg:savepoint]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: BEGIN
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: SAVEPOINT s
    - sql: ALTER TABLE t ADD COLUMN w INTEGER DEFAULT 5
    - sql: CREATE TABLE u (id INTEGER PRIMARY KEY)
    - sql: SELECT id, v, w FROM t WHERE id >= $1
      params: [0]
      expected: [[1, 10, 5]]
    - sql: ROLLBACK TO SAVEPOINT s
    - sql: SELECT id FROM u WHERE id >= $1
      params: [0]
      error: "42P01"
    - sql: ROLLBACK TO SAVEPOINT s
    - sql: COMMIT
    - sql: SELECT * FROM t WHERE id >= $1
      params: [0]
      expected: [[1, 10]]
  teardown:
    - ROLLBACK
    - DROP TABLE u
    - DROP TABLE t

- name: a duplicate CREATE TABLE in a transaction is 42P07 and fails it
  features: [pg:transactional-ddl]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY)
  steps:
    - sql: BEGIN
    - sql: CREATE TABLE u (id INTEGER PRIMARY KEY)
    - sql: CREATE TABLE t (id INTEGER PRIMARY KEY)
      error: "42P07"
    - sql: CREATE TABLE w (id INTEGER PRIMARY KEY)
      error: "25P02"
    - sql: COMMIT
    - sql: SELECT id FROM u WHERE id >= $1
      params: [0]
      error: "42P01"
  teardown:
    - ROLLBACK
    - DROP TABLE u
    - DROP TABLE w
    - DROP TABLE t

- name: CREATE TABLE AS in a transaction reads its writes, and ROLLBACK undoes it
  features: [pg:transactional-ddl, pg:select-into]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
    - INSERT INTO t VALUES (1, 10)
  steps:
    - sql: BEGIN
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, 20]
      rowcount: 1
    - sql: CREATE TABLE ct AS SELECT id, v FROM t WHERE v > $1
      params: [5]
      rowcount: 2
    - sql: SELECT id, v FROM ct WHERE id >= $1
      params: [0]
      expected: [[1, 10], [2, 20]]
    - sql: ROLLBACK
    - sql: SELECT id FROM ct WHERE id >= $1
      params: [0]
      error: "42P01"
    - sql: BEGIN
    - sql: SELECT id INTO ct FROM t WHERE id >= $1
      params: [0]
      rowcount: 1
    - sql: COMMIT
    - sql: SELECT id FROM ct WHERE id >= $1
      params: [0]
      expected: [[1]]
  teardown:
    - ROLLBACK
    - DROP TABLE ct
    - DROP TABLE t

- name: a failed statement leaves the transaction aborted
  features: [E151-02]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: BEGIN
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 11]
      error: "23505"
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, 20]
      error: "25P02"
    - sql: COMMIT
    - sql: SELECT id, v FROM t WHERE id >= $1
      params: [0]
      expected: [[1, 10]]
  teardown:
    - ROLLBACK
    - DROP TABLE t

- name: an autocommit statement is its own transaction
  features: [E151-01]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 11]
      error: "23505"
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, 20]
      rowcount: 1
    - sql: SELECT id, v FROM t WHERE id >= $1
      params: [0]
      expected: [[1, 10], [2, 20]]
  teardown:
    - DROP TABLE t

- name: a transaction reads its own delete
  features: [E151-02, E101-04]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [1, 10]
      rowcount: 1
    - sql: INSERT INTO t VALUES ($1, $2)
      params: [2, 20]
      rowcount: 1
    - sql: BEGIN
    - sql: DELETE FROM t WHERE id = $1
      params: [1]
      rowcount: 1
    - sql: SELECT id FROM t WHERE id >= $1
      params: [0]
      expected: [[2]]
    - sql: ROLLBACK
    - sql: SELECT id FROM t WHERE id >= $1
      params: [0]
      expected: [[1], [2]]
  teardown:
    - ROLLBACK
    - DROP TABLE t

- name: SET TRANSACTION READ ONLY refuses a write and READ WRITE allows it
  features: [E152-02]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY, v INTEGER)
  steps:
    - sql: START TRANSACTION
    - sql: SET TRANSACTION READ ONLY
    - sql: SELECT id FROM t
      expected: []
    - sql: INSERT INTO t VALUES (1, 10)
      error: "25006"
    - sql: ROLLBACK
    - sql: START TRANSACTION
    - sql: SET TRANSACTION READ ONLY
    - sql: SET TRANSACTION READ WRITE
    - sql: INSERT INTO t VALUES (1, 10)
      rowcount: 1
    - sql: COMMIT
    - sql: SELECT id, v FROM t
      expected: [[1, 10]]
  teardown:
    - ROLLBACK
    - DROP TABLE t

- name: SET LOCAL TRANSACTION and SET SESSION TRANSACTION are SET TRANSACTION
  features: [E152-01, E152-02]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY)
  steps:
    - sql: START TRANSACTION
    - sql: SET LOCAL TRANSACTION READ ONLY
    - sql: INSERT INTO t VALUES (1)
      error: "25006"
    - sql: ROLLBACK
    - sql: START TRANSACTION
    - sql: SET SESSION TRANSACTION READ ONLY
    - sql: SET LOCAL TRANSACTION READ WRITE, ISOLATION LEVEL REPEATABLE READ
    - sql: INSERT INTO t VALUES (1)
      rowcount: 1
    - sql: COMMIT
    # The mode lasted only for its block.
    - sql: INSERT INTO t VALUES (2)
      rowcount: 1
    - sql: SELECT id FROM t
      expected: [[1], [2]]
  teardown:
    - ROLLBACK
    - DROP TABLE t

- name: SET TRANSACTION takes an isolation level the snapshot already gives, with modes
  features: [E152-01, E152-02]
  steps:
    - sql: START TRANSACTION
    - sql: SET TRANSACTION ISOLATION LEVEL REPEATABLE READ, READ ONLY
    - sql: COMMIT
    - sql: BEGIN READ ONLY, ISOLATION LEVEL READ COMMITTED
    - sql: COMMIT
  teardown:
    - ROLLBACK

- name: SET TRANSACTION must come before the transaction's first query
  features: [E152-01]
  setup:
    - CREATE TABLE t (id INTEGER PRIMARY KEY)
  steps:
    - sql: BEGIN
    - sql: SELECT id FROM t
      expected: []
    # The block's own level (READ COMMITTED) changes nothing and is taken, as in PostgreSQL.
    - sql: SET TRANSACTION ISOLATION LEVEL READ COMMITTED
    - sql: SET TRANSACTION ISOLATION LEVEL REPEATABLE READ
      error: "25001"
    - sql: ROLLBACK
  teardown:
    - ROLLBACK
    - DROP TABLE t

- name: SET TRANSACTION outside a transaction block only warns
  features: [E152-02]
  steps:
    - sql: SET TRANSACTION READ ONLY
