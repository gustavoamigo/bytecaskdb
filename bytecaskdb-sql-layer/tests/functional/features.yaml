# Every feature a case may name (docs/functional_testing_design.md, *The feature manifest*).
#
# The SQL features are the leaves of sqltest's taxonomy of SQL:2016
# (standards/2016/features.yml, MIT, Copyright (c) 2023 Elliot Chance,
# https://github.com/elliotchance/sqltest at 1951ddf: Annex F of the standard), with whether
# the feature is mandatory (Core) and whether PostgreSQL 17 supports it
# (PostgreSQL's documentation, *SQL Conformance*, D.1 supported and D.2
# unsupported; a subfeature PostgreSQL's tables don't list takes its
# parent's, and with no parent listed `pg` is left out). Below them are our
# own ids, for what the standard doesn't number.
#
# out_of_scope names the reason a feature is not a gap for the layer.

